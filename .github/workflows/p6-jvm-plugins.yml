name: JVM plugins

# The Gradle and Maven plugins (ADR 0010, ADR 0011). The Gradle plugin's TestKit builds generate, compile and cache a
# Spring Boot app from the reference contract, on Java 21 with the Gradle 8.14 floor and on Java 21 and 25 with the
# repository's Gradle. The Maven plugin's tests build the same app with a real Maven, 3.9 and 4, on Java 21 and 25;
# `identical-files` generates one app with both plugins and compares the files with each other and with the
# spring-boot golden tree. The compiler binary is a stub, so the jobs run with Node removed from the runner. On a pull
# request they run only when the change touches a watched path; `jvm-plugins` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: jvm-plugins-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jvm-plugins: ${{ steps.detect.outputs.jvm-plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request can be compared with its base.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a change to the JVM modules or what they read
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "jvm-plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The JVM modules, the config, bundle and IR schemas, the bundle vectors, the reference contract and the
          # golden IR, the consumer's Maven wrapper the Maven tests run, and this workflow.
          watched='^(jvm/|packages/core/spec/schemas/(bundle|config|ir)/|packages/core/spec/vectors/bundle/'
          watched+='|fixtures/reference/|fixtures/golden/|scripts/consumers/targets/spring-boot/maven/'
          watched+='|\.github/workflows/p6-jvm-plugins\.yml$)'
          # Both sides of a move, with names NUL-separated and never quoted, so that a moved path, or one with a
          # quote, a backslash, a tab or a non-ASCII byte, still matches.
          changed=$(git diff -z --name-only --no-renames "origin/$PR_BASE...HEAD" | tr '\0' '\n')
          # An empty diff runs every job rather than none.
          if [ -z "$changed" ] || grep -Eq "$watched" <<< "$changed"; then
            echo "jvm-plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "jvm-plugins=false" >> "$GITHUB_OUTPUT"
          fi

  gradle-plugin:
    name: gradle plugin (Java ${{ matrix.test-jdk }}, Gradle ${{ matrix.test-gradle }})
    needs: changes
    if: needs.changes.outputs.jvm-plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gradle 8.14, the floor (Spring Boot 4's), runs on Java 24 at most.
          - test-jdk: 21
            test-gradle: "8.14"
          - test-jdk: 21
            test-gradle: wrapper
          - test-jdk: 25
            test-gradle: wrapper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the JVM path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node; then
            echo "Node is still on the PATH."
            exit 1
          fi
      # Both JDKs are installed: Gradle runs on the last one, and the tests run on the matrix one, which the
      # toolchain detection finds without a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the Gradle plugin on Java ${{ matrix.test-jdk }} and Gradle ${{ matrix.test-gradle }}
        working-directory: jvm
        env:
          TEST_JDK: ${{ matrix.test-jdk }}
          TEST_GRADLE: ${{ matrix.test-gradle }}
        run: |
          set -euo pipefail
          gradle_flag=()
          if [ "$TEST_GRADLE" != "wrapper" ]; then gradle_flag=("-PtestGradle=$TEST_GRADLE"); fi
          ./gradlew :seampact-gradle-plugin:check -PtestJdk="$TEST_JDK" "${gradle_flag[@]}"

  maven-plugin:
    name: maven plugin (Java ${{ matrix.test-jdk }}, Maven ${{ matrix.test-maven }})
    needs: changes
    if: needs.changes.outputs.jvm-plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [21, 25]
        # The 3.9 floor and Maven 4.
        test-maven: ["3.9.16", "4.0.0-rc-7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the JVM path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node; then
            echo "Node is still on the PATH."
            exit 1
          fi
      # Both JDKs are installed: Gradle runs on the last one, and the tests (and their Maven builds) run on the matrix
      # one, which the toolchain detection finds without a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the Maven plugin on Java ${{ matrix.test-jdk }} and Maven ${{ matrix.test-maven }}
        working-directory: jvm
        env:
          TEST_JDK: ${{ matrix.test-jdk }}
          TEST_MAVEN: ${{ matrix.test-maven }}
        run: ./gradlew :seampact-maven-plugin:check -PtestJdk="$TEST_JDK" -PtestMaven="$TEST_MAVEN"

  identical-files:
    name: identical files (Gradle and Maven plugins)
    needs: changes
    if: needs.changes.outputs.jvm-plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the JVM path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate the reference app with both plugins and compare the files with the spring-boot golden
        working-directory: jvm
        run: ./gradlew :seampact-maven-plugin:test --tests '*IdenticalFilesTest'

  # The required check: a skipped job (no change to watch) counts as passed, a failed or cancelled one does not.
  jvm-plugins:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, gradle-plugin, maven-plugin, identical-files]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A JVM plugins job ended in $result (results: $RESULTS)."
              exit 1
            fi
          done
