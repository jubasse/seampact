# Role bindings (ADR 0002 section 11 "Error roles", ADR 0006 section 6, A35): a pack binding, a conventions binding
# with a params template, and errorRoles on nodes where the nearest wins, each reaching the role's required data by
# name or through the template.
api: { name: shop, version: 1, kind: product }
packs: [./pack.yaml]

conventions:
  rateLimit: { header: Retry-After, param: retryAfterMs, unit: s }
  errors:
    derived:
      schemaInvalid:
        code: shop.invalid
        params: { problems: { $each: $issues, $as: { at: $item.pointer } } }
      sortKeyForbidden: { code: shop.sort_denied, params: { detail: 'sort key ${key} is not allowed' } }
      rateLimited: shop.slow_down

errors:
  shop.invalid:
    status: 400
    params: { problems: { type: array, items: { type: object, properties: { at: { type: string } } } } }
  shop.sort_denied: { status: 403, params: { detail: { type: string } } }
  shop.slow_down: { status: 429, params: { retryAfterMs: { type: integer, minimum: 0 } } }
  members.not_found: { status: 404 }
  members.gone: { status: 404, title: The member left. }

schemas:
  UserId: { type: string }
  Member:
    type: object
    required: [userId]
    properties:
      userId: UserId

surfaces:
  app:
    prefix: /v{version}
    access: { public: The fixture checks role bindings only. }
    routes:
      members:
        kind: collection
        id: { userId: UserId }
        item: Member
        ops: { list: { paging: none }, get: {} }
        member:
          errorRoles:
            notFound: members.not_found
          routes:
            history:
              method: get
              errorRoles:
                notFound: { code: members.gone }
