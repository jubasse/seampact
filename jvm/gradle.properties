# Dependency resolution retries a 429, a 5xx or a timeout from a repository after a doubling pause (5, 10, 20, 40, 80
# then 160 seconds, about 5 minutes in all) before it disables that repository for the build: Maven Central's 429
# outlasts a minute. Gradle's own default is 3 attempts from 1 second. The Spring Boot consumer builds copy these lines.
systemProp.org.gradle.internal.repository.max.tentatives=7
systemProp.org.gradle.internal.repository.initial.backoff=5000

# Unchanged tasks reuse their outputs from the build cache, and an unchanged build reuses its task graph from the
# configuration cache; a configuration cache problem fails the build.
org.gradle.caching=true
org.gradle.configuration-cache=true

# The release version of every module, written by scripts/release/stamp.ts.
version=1.0.0
