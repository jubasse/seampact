# docs/conformance/proofs/p8-conformance-18.yaml
# The boot items' proofs are the http-suite boot cases each server consumer runs (their suite reports), and on Express
# and AdonisJS the default case whose first contract request refuses a mount mismatch; nestjs's version-neutral
# routes are a live-boundary test. CHK-163's native access (`artefacts.accessHooks: false`) is refused by name at
# generation on every server: the tests of that refusal.
lane: p8-conformance-18
proofs:
  - id: CHK-163
    refusals:
      - 'spring-boot: jvm/seampact-spring-boot/src/test/kotlin/io/github/jubasse/seampact/springboot/SpringBootOptionsTest.kt#refusesTheEntryMembersLaterReleasesServe'
      - 'laravel: php/laravel/tests/LaravelRefusalsTest.php#testTheFullReferenceIsServedAndNativeAccessWaitsForAConsumer'
      - 'symfony: php/symfony/tests/SymfonyRefusalsTest.php#testNativeAccessWaitsForAnAppThatNeedsIt'
      - 'fastapi: python/fastapi/fastapi_tests/test_generator.py#test_artefacts_the_target_does_not_take_yet_are_refused_by_name'
      - 'drf: python/drf/drf_tests/test_drf_generator.py#test_options_and_artefacts_the_target_does_not_take_are_refused_by_name'
      - 'ninja: python/ninja/ninja_tests/test_generator.py#test_artefacts_the_target_does_not_take_are_refused_by_name'
      - 'nestjs: packages/targets/codegen-nestjs/src/native-access-refused.test.ts#native access is refused by name'
      - 'fastify: packages/targets/codegen-fastify/src/native-access-refused.test.ts#native access is refused by name'
      - 'express: packages/targets/codegen-express/src/native-access-refused.test.ts#native access is refused by name'
      - 'adonis: packages/targets/codegen-adonis/src/native-access-refused.test.ts#native access is refused by name'
      - 'hono: packages/targets/codegen-hono/src/native-access-refused.test.ts#native access is refused by name'
  - id: CHK-161
    tests:
      - 'nestjs: packages/targets/codegen-nestjs/src/live-boundary.test.ts#the operation composite routes the full contract path, version-neutral'
