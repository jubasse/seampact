# The uv workspace of the Python packages (ADR 0010): one distribution per member, tested and checked together.
# The workspace root is virtual: it is never built, it only holds the members, the dev tools and their settings.

[tool.uv]
required-version = "==0.13.6"
# Every build requirement of the members, pinned and hashed: hatchling, what it pulls, and `editables` for the
# editable installs of `uv sync`. uv checks these hashes in `uv sync` and `uv build`, and refuses a build requirement
# without one. To bump hatchling: `uv pip compile --generate-hashes` of `hatchling==<new>` and `editables~=0.3`, then
# replace these pins and hashes and the `requires` of each member's `[build-system]`.
build-constraint-dependencies = [
    { requirement = "editables==0.6", hashes = [
        "sha256:1163834902381c4613787951c5914800fdf155ae08848a373b8ea5006780977c",
        "sha256:d70e4698078a1d033e7786d9c64e5be070d058a67c21417024d38a58ac20aa43",
    ] },
    { requirement = "hatchling==1.33.0", hashes = [
        "sha256:415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d",
        "sha256:4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef",
    ] },
    { requirement = "packaging==26.3", hashes = [
        "sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79",
        "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
    ] },
    { requirement = "pathspec==1.1.1", hashes = [
        "sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a",
        "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
    ] },
    { requirement = "pluggy==1.7.0", hashes = [
        "sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec",
        "sha256:d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8",
    ] },
    { requirement = "tomlkit==0.15.2", hashes = [
        "sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437",
        "sha256:83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6",
    ] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = [
        "sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71",
        "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17",
    ] },
]
require-build-hashes = true
# Hash checking of build requirements is a uv preview feature; this silences its warning, not the check.
preview-features = ["build-dependency-hashes"]

[tool.uv.workspace]
members = ["codegen", "compiler", "django", "drf", "fastapi", "hooks", "ir", "ninja", "signed-webhooks"]

[dependency-groups]
# The vulnerability audit of the lock file, installed only by its CI job.
audit = [
    "pip-audit==2.10.1",
]
dev = [
    "mypy==2.4.1",
    # The Pydantic extra of seampact-codegen, for its tests and the mypy plugin.
    "pydantic==2.14.2",
    # Checks the golden output of the Pydantic emitter as Pylance users read it; Node comes as a wheel.
    "pyright[nodejs]==1.1.414",
    # The types of Django and DRF, for the Django layer, the DRF target and its golden output; one release serves
    # Django 5.2 and 6.x.
    "django-stubs==6.1.2",
    "djangorestframework-stubs==3.18.1",
    # The Ninja target and its golden output; its floor row installs 1.5.3 over the lock.
    "django-ninja==1.7.3",
    "pytest==9.2.0",
    "types-jsonschema==4.26.0.20261006",
    "rich==15.0.0",
    "ruff==0.17.3",
    "httpx2==2.16.0",
    # The build hook of the seampact-compiler wheels, for mypy; the same pin as the build constraints above.
    "hatchling==1.33.0",
]
# The servers the consumer tests run a generated app under: uvicorn for ASGI, gunicorn for WSGI (and ASGI through
# uvicorn's worker). Installed by those tests only, never by a workspace sync.
serve = [
    "gunicorn==26.2.0",
    "uvicorn==0.54.0",
]

[tool.ruff]
target-version = "py312"
src = ["codegen/src", "compiler", "compiler/src", "django/src", "drf/src", "fastapi/src", "hooks/src", "ir/src", "ninja/src", "signed-webhooks/src"]
line-length = 120
# The namespace package `seampact` has no `__init__.py` (PEP 420): without this, ruff would take `seampact/fastapi`
# or `seampact/django` for a top-level framework package and sort the framework's imports as first party.
namespace-packages = [
    "codegen/src/seampact",
    "compiler/src/seampact",
    "django/src/seampact",
    "drf/src/seampact",
    "fastapi/src/seampact",
    "hooks/src/seampact",
    "ir/src/seampact",
    "ninja/src/seampact",
    "signed-webhooks/src/seampact",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = [
    "codegen/src",
    # The release scripts and the build hook of seampact-compiler, imported by their tests as top-level modules.
    "compiler",
    "compiler/src",
    "django/src",
    "drf/src",
    "fastapi/src",
    "hooks/src",
    "ir/src",
    "ninja/src",
    "signed-webhooks/src",
]
files = [
    "codegen/src",
    "codegen/tests",
    "compiler/hatch_build.py",
    "compiler/release_version.py",
    "compiler/wheel_smoke.py",
    "compiler/src",
    "compiler/tests",
    "django/src",
    "django/django_tests",
    "drf/src",
    "drf/drf_tests",
    "fastapi/src",
    "fastapi/fastapi_tests",
    "hooks/src",
    "hooks/tests",
    "ir/src",
    "ir/tests",
    "ninja/src",
    "ninja/ninja_tests",
    "signed-webhooks/src",
    "signed-webhooks/tests",
]
explicit_package_bases = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The golden output of the Pydantic emitter and of the FastAPI and Ninja targets, as Pylance users check it.
[tool.pyright]
include = ["codegen/tests/golden", "fastapi/fastapi_tests/golden", "ninja/ninja_tests/golden"]
extraPaths = ["codegen/src", "django/src", "fastapi/src", "hooks/src", "ninja/src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = [
    "codegen/tests",
    "compiler/tests",
    "django/django_tests",
    "drf/drf_tests",
    "fastapi/fastapi_tests",
    "hooks/tests",
    "ir/tests",
    "ninja/ninja_tests",
    "signed-webhooks/tests",
]
# The tests of seampact-compiler import its release scripts, which live beside the package, not in it.
pythonpath = ["compiler"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
