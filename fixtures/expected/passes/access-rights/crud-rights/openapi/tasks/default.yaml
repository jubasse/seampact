            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: channel
          from: path.channelId
      x-seampact-requires:
        - right: channels.get
          subject: path.channelId
        - right: channels.member
          subject: scope.channel
      x-seampact-maturity:
        level: experimental
        source: api
