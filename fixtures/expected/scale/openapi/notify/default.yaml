          type: string
          minLength: 1
          maxLength: 80
        condition:
          $ref: "#/components/schemas/Condition"
        quantity:
          type: integer
          minimum: 0
          maximum: 1000
      required:
        - label
    ChilledRate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        rating:
          $ref: "#/components/schemas/Rating"
        quantity:
          type: integer
          minimum: 0
          maximum: 100
        inner:
          $ref: "#/components/schemas/ChilledWindow"
      required:
        - label
    ChilledSpan:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        grade:
          $ref: "#/components/schemas/Grade"
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
      required:
        - label
    ChilledTally:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        visibility:
          $ref: "#/components/schemas/Visibility"
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
        inner:
          $ref: "#/components/schemas/ChilledLimit"
      required:
        - label
    ChilledWindow:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        stage:
          $ref: "#/components/schemas/Stage"
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
      required:
        - label
    Condition:
      type: string
      enum:
        - new
        - used
        - damaged
    CreateDelivery:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        state:
          $ref: "#/components/schemas/Unit"
        kind:
          $ref: "#/components/schemas/Region"
      required:
        - name
        - state
        - kind
    CreateTemplate:
      type: object
      properties:
        name:
