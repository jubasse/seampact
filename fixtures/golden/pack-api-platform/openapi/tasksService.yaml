openapi: 3.1.0
info:
  title: tasksService
  version: "1"
x-seampact-api:
  kind: service
  caller:
    identity: service
    right: callerService
x-seampact-format: jsonld
paths:
  /internal/v1/channels/{channelId}/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Deadline
          in: header
          required: true
          schema:
            type: string
          x-seampact-semantic: deadline
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
          x-seampact-semantic: traceContext
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      "@context":
                        const: /contexts/Task
                      "@id":
                        type: string
                        format: uri-reference
                      "@type":
                        const: Task
                    required:
                      - "@context"
                      - "@id"
                      - "@type"
                  - $ref: "#/components/schemas/Task"
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.forbidden
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.forbidden"
          x-seampact-errors:
            - code: api.forbidden
              derivedFrom: requirement.errors
        "404":
          description: api.not_found
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: relay.route
        "422":
          description: api.validation_failed
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.validation_failed"
          x-seampact-errors:
            - code: api.validation_failed
              derivedFrom: input.invalid
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
        "504":
          description: api.deadline_exceeded
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.deadline_exceeded"
          x-seampact-errors:
            - code: api.deadline_exceeded
              derivedFrom: identity.deadline
      security:
        - internalToken: []
      x-seampact-access:
        identity: service
      x-seampact-requires:
        - right: callerService
          params:
            allowed:
              - catalog
      x-seampact-maturity:
        level: provisional
        source: api
      x-seampact-relays:
        api: tasks
        operationId: getTask
components:
  schemas:
    ApiForbiddenParams:
      type: object
      properties:
        pointer:
          type: string
    ApiValidationFailedParams:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationFailedParamsViolationsItem"
      required:
        - violations
    ApiValidationFailedParamsViolationsItem:
      type: object
      properties:
        propertyPath:
          type: string
        message:
          type: string
      required:
        - propertyPath
        - message
    Task:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        state:
          $ref: "#/components/schemas/TaskState"
        effort:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      required:
        - taskId
        - title
        - state
        - version
        - createdAt
    TaskState:
      type: string
      enum:
        - open
        - done
        - archived
    api.deadline_exceeded:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 504
        code:
          type: string
          const: api.deadline_exceeded
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: unavailable
    api.forbidden:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 403
            code:
              type: string
              const: api.forbidden
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - status
            - code
        - $ref: "#/components/schemas/ApiForbiddenParams"
      x-seampact-nature:
        base: refused
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 404
        code:
          type: string
          const: api.not_found
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.validation_failed:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            title:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 422
            code:
              type: string
              const: api.validation_failed
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - title
            - status
            - code
        - $ref: "#/components/schemas/ApiValidationFailedParams"
      x-seampact-nature:
        base: refused
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: jwt
