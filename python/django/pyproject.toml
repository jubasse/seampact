[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-django"
version = "1.0.1"
description = "The Django layer shared by the seampact DRF and Ninja targets: URLconf and settings emitters and the runtime of generated code."
keywords = ["django", "server", "python", "seampact", "api-contract", "openapi", "codegen"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["django>=5.2", "seampact-codegen==1.0.1"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/concepts/packages/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

[project.optional-dependencies]
# What the emitters need; a production install of an app leaves it out.
generate = ["seampact-codegen[generate]==1.0.1"]

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]

[tool.uv.sources]
seampact-codegen = { workspace = true }
