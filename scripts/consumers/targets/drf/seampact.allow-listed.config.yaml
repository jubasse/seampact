# The consumer's app config for the `allow-listed-framework-route` boot case: the app config with the route it serves
# beside the contract allow-listed.
outDir: generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-drf
    api: tasks
    operations:
      include: [health, getChannel, getDraft]
    frameworkRoutes:
      - { path: /v1/unlisted, reason: "The boot case's framework route beside the contract (ADR 0015)." }
