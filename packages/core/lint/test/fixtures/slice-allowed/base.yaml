# base.yaml: the workspace's shared file; redundant-maturity is off for the whole api
lint:
  rules: { seampact/redundant-maturity: disabled }

schemes:
  bearer: { kind: bearer }
  csrfToken: { kind: header, name: X-Csrf-Token }
  session: { kind: cookie, name: __Host-session, csrf: csrfToken }
  pageSession:
    kind: cookie
    name: page-session
    lint: { allow: { seampact/cookie-without-csrf: "Pages are read-only, so no write needs a CSRF check." } }

identities:
  user:
    schemes: { read: [bearer, session], write: [bearer, session] }
    principal: UserPrincipal
  reader:
    schemes: { read: [pageSession], write: [pageSession] }
    principal: UserPrincipal

schemas:
  UserPrincipal:
    type: object
    required: [userId]
    properties: { userId: { type: string } }
