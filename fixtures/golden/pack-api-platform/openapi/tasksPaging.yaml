openapi: 3.1.0
info:
  title: tasksPaging
  version: "1"
  summary: Notes read through a changes feed, a Stripe-style list and a clamped list that reports its limit.
x-seampact-api:
  kind: product
x-seampact-format: jsonld
paths:
  /paging/v1/capped:
    get:
      operationId: listCapped
      parameters:
        - name: page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  has_more:
                    type: boolean
                  limit:
                    type: integer
                required:
                  - data
                  - has_more
                  - limit
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: cappedPages
        position: page
        roles:
          page: query.page
          limit: query.limit
        maxLimit: 10
        defaultLimit: 10
        overLimit: clamp
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
  /paging/v1/changes:
    get:
      operationId: listChanges
      parameters:
        - name: since
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  next:
                    type: string
                  complete:
                    type: boolean
                  limit:
                    type: integer
                required:
                  - items
                  - next
                  - complete
                  - limit
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "410":
          description: api.cursor_too_old
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.cursor_too_old"
          x-seampact-errors:
            - code: api.cursor_too_old
              derivedFrom: paging.gone
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: changes
        position: since
        roles:
          since: query.since
          limit: query.limit
        maxLimit: 10
        defaultLimit: 10
        overLimit: clamp
        token: opaque
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
  /paging/v1/events:
    get:
      operationId: listEvents
      parameters:
        - name: since
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  next:
                    type: string
                    format: date-time
                  complete:
                    type: boolean
                  limit:
                    type: integer
                required:
                  - items
                  - next
                  - complete
                  - limit
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "410":
          description: api.cursor_too_old
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.cursor_too_old"
          x-seampact-errors:
            - code: api.cursor_too_old
              derivedFrom: paging.gone
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: changes
        position: since
        roles:
          since: query.since
          limit: query.limit
        maxLimit: 10
        defaultLimit: 10
        overLimit: reject
        token: instant
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
  /paging/v1/notes:
    get:
      operationId: listNotes
      parameters:
        - name: starting_after
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: ending_before
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  has_more:
                    type: boolean
                  url:
                    type: string
                required:
                  - object
                  - data
                  - has_more
                  - url
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: stripeList
        position: cursor
        roles:
          after: query.starting_after
          before: query.ending_before
          limit: query.limit
        maxLimit: 10
        defaultLimit: 10
        overLimit: reject
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssuesItem"
      required:
        - issues
    IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - noteId
        - text
    api.cursor_too_old:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 410
        code:
          type: string
          const: api.cursor_too_old
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 400
            code:
              type: string
              const: api.schema_invalid
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - status
            - code
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
