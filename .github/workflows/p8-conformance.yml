name: Conformance release gate

# The checklist's release gate over every proof: the proof files and the http-suite reports the consumer workflows
# uploaded on develop (the newest of each artefact from a successful run). It names each live id that has no
# fixture, or no test for a target it lists. Report-only until RELEASE_GATE_BLOCKING is set to "true" below.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p8-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_GATE_BLOCKING: "false"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the consumers' http-suite reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checklist/fetch-suite-reports.sh "$RUNNER_TEMP/suite-reports"
      - name: Run the release gate
        continue-on-error: ${{ env.RELEASE_GATE_BLOCKING != 'true' }}
        run: |
          set -o pipefail
          node scripts/checklist/cli.ts check --release-gate --suite-reports "$RUNNER_TEMP/suite-reports" 2>&1 |
            tee "$RUNNER_TEMP/release-gate.txt"
      - name: Write the gaps to the job summary
        if: always()
        run: |
          {
            echo "## Conformance release gate"
            echo
            echo "Blocking: $RELEASE_GATE_BLOCKING"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-gate.txt" 2>/dev/null || echo "The gate did not run: see the download step."
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # The lane's check: no change filter, the gate runs on every push to develop and every manual run.
  p8-conformance:
    # Every job this check stands for is listed here, or its failure would not reach the check.
    needs: [release-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: "true"
