name: Express and Fastify consumers

# Builds and packs the seampact packages, then installs them from the tarballs into each test consumer, generates
# the boundary of both reference apis, typechecks, starts the app and runs `reference slice answers` against it:
# the Express router on Express 5 and Express 4 (ADR 0018), and the Fastify plugin on Fastify 5 (ADR 0017).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: express-fastify-consumers-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
      post-merge: ${{ steps.detect.outputs.post-merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages a Node server consumer installs (core, packs, runtime, the TypeScript, fetch and validator
          # targets, its own), the http suite, the consumer harness and its overlays, the reference contract and the pins.
          watched-paths: |
            ^packages/(core|packs|runtime)/
            ^packages/targets/codegen-(ts|fetch|zod|yup|class-validator|express|fastify)/
            ^packages/tools/http-suite/
            ^scripts/consumers/(cli|build-and-pack|consumer-project|install-into|ignore-vendor|packed-packages|run-step|served-app|validator-choice)\.ts$
            ^scripts/consumers/template/
            ^scripts/consumers/pack/
            ^fixtures/golden/pack-laravel/
            ^scripts/consumers/targets/(express|express4|fastify)/
            ^scripts/golden/
            ^fixtures/reference/
            ^\.github/actions/
            ^\.github/workflows/p5-fastify-express\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^tsconfig\.base\.json$
            ^\.nvmrc$

  # The PR row, the Node server family's representative; the queue job runs every other target and validator once,
  # the post-merge job the other pairs.
  consumer:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: express, validators: zod }
    steps: &consumer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.target }} consumer on ${{ matrix.validators }} from packed tarballs
        run: node scripts/consumers/cli.ts --target "${{ matrix.target }}" --validators "${{ matrix.validators }}" --dir "$RUNNER_TEMP/test-seampact-${{ matrix.target }}-${{ matrix.validators }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.target }}-http-suite-${{ matrix.validators }}
          path: ${{ runner.temp }}/test-seampact-${{ matrix.target }}-${{ matrix.validators }}/reports
          retention-days: 90
          if-no-files-found: warn

  consumer-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: express4, validators: yup }
          - { target: fastify, validators: zod }
    steps: *consumer-steps

  consumer-post-merge:
    needs: changes
    if: needs.changes.outputs.post-merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: express, validators: yup }
          - { target: express4, validators: zod }
          - { target: fastify, validators: yup }
    steps: *consumer-steps

  # The queue rows of the pack profiles (ADR 0015 "Suite profiles"): the consumer generated from the reference contract
  # with a first-party pack applied, which runs that pack's profile. The Node servers refuse the pair sort style of
  # pack-spring and pack-hal by name (paging.sort.style.unsupported), so only pack-laravel runs.
  pack-consumer:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: express, validators: zod, pack: laravel }
          - { target: fastify, validators: zod, pack: laravel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.target }} consumer under pack-${{ matrix.pack }} from packed tarballs
        run: node scripts/consumers/cli.ts --target "${{ matrix.target }}" --validators "${{ matrix.validators }}" --pack "${{ matrix.pack }}" --dir "$RUNNER_TEMP/test-seampact-${{ matrix.target }}-pack-${{ matrix.pack }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.target }}-http-suite-pack-${{ matrix.pack }}
          path: ${{ runner.temp }}/test-seampact-${{ matrix.target }}-pack-${{ matrix.pack }}/reports
          retention-days: 90
          if-no-files-found: warn

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  express-fastify:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, consumer, consumer-queue, consumer-post-merge, pack-consumer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
          # Queue rows: a pull request to develop runs without them.
          allow-skip: ${{ needs.changes.outputs.queue == 'false' && 'pack-consumer' || '' }}
