# The config of the hook-check-off and filtered-out-handler boot variants: the consumer config with the hook check off
# and the health operation filtered out on the tasks api.
outDir: src/Generated
openapi: none
sources:
  contract: { path: contract }
  inputRules: { path: input-rules-contract }
targets:
  - id: tasks
    out: Tasks
    use: seampact/symfony
    api: tasks
    operations: { exclude: [health] }
    artefacts:
      bootCheck: { hooks: "off" }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksService
    out: TasksService
    use: seampact/symfony
    api: tasksService
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksServiceWrites
    out: TasksServiceWrites
    use: seampact/symfony
    api: tasksServiceWrites
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksDevices
    out: TasksDevices
    use: seampact/symfony
    api: tasksDevices
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksOptionalAuth
    out: TasksOptionalAuth
    use: seampact/symfony
    api: tasksOptionalAuth
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksAbsoluteUrls
    out: TasksAbsoluteUrls
    use: seampact/symfony
    api: tasksAbsoluteUrls
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksResponses
    out: TasksResponses
    use: seampact/symfony
    api: tasksResponses
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksPaging
    out: TasksPaging
    use: seampact/symfony
    api: tasksPaging
    # The changes-since feed carries the complete page fact, which this target refuses by name in 1.0.
    operations: { exclude: [listChanges, listEvents] }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksSplitSort
    out: TasksSplitSort
    use: seampact/symfony
    api: tasksSplitSort
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: inputRules
    out: InputRules
    use: seampact/symfony
    api: inputRules
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
