openapi: 3.1.0
info:
  title: shop
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/deep:
    get:
      operationId: deep
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L0"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: clerk
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    L0:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L1"
        b:
          $ref: "#/components/schemas/L1"
    L1:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L2"
        b:
          $ref: "#/components/schemas/L2"
    L10:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L11"
        b:
          $ref: "#/components/schemas/L11"
    L11:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L12"
        b:
          $ref: "#/components/schemas/L12"
    L12:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L13"
        b:
          $ref: "#/components/schemas/L13"
    L13:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L14"
        b:
          $ref: "#/components/schemas/L14"
    L14:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L15"
        b:
          $ref: "#/components/schemas/L15"
    L15:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L16"
        b:
          $ref: "#/components/schemas/L16"
    L16:
      type: object
      properties:
        code:
          type: string
    L2:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L3"
        b:
          $ref: "#/components/schemas/L3"
    L3:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L4"
        b:
          $ref: "#/components/schemas/L4"
    L4:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L5"
        b:
          $ref: "#/components/schemas/L5"
    L5:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L6"
        b:
          $ref: "#/components/schemas/L6"
    L6:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L7"
        b:
          $ref: "#/components/schemas/L7"
    L7:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L8"
        b:
          $ref: "#/components/schemas/L8"
    L8:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L9"
        b:
          $ref: "#/components/schemas/L9"
    L9:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/L10"
        b:
          $ref: "#/components/schemas/L10"
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        type:
          type: string
          const: api.unauthenticated
        status:
          type: integer
          const: 401
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unauthenticated
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
