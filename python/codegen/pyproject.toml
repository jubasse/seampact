[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-codegen"
version = "1.0.1"
description = "The framework-neutral code generation of the seampact Python targets and the runtime their generated code imports."
keywords = ["generator", "python", "pydantic", "seampact", "api-contract", "openapi", "codegen"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["seampact-hooks==1.0.1"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/concepts/packages/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

[project.optional-dependencies]
# The type layer of the generated Pydantic models (FastAPI and Ninja); 2.9 is FastAPI 0.162's own floor.
pydantic = ["pydantic>=2.9,<3"]
# What the generator itself needs; a production install of an app leaves it out.
generate = ["seampact-ir==1.0.1"]

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]

[tool.uv.sources]
seampact-hooks = { workspace = true }
seampact-ir = { workspace = true }
