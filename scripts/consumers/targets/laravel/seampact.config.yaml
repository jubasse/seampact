# The consumer's app config: the reference contract and one seampact/laravel entry per api, serving every operation;
# the suite's control routes are allow-listed framework routes.
outDir: app/Generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: Tasks
    use: seampact/laravel
    api: tasks
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksService
    out: TasksService
    use: seampact/laravel
    api: tasksService
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
