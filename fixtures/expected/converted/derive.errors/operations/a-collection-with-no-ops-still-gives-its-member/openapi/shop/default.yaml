openapi: 3.1.0
info:
  title: shop
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/tasks/{taskId}/comments:
    get:
      operationId: listComments
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "404":
          description: tasks.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/tasks.not_found"
          x-seampact-errors:
            - code: tasks.not_found
              derivedFrom: member.notFound
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security: []
      x-seampact-access:
        public: The contract checks member.notFound only.
      x-seampact-paging:
        none: true
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    Comment:
      type: object
      properties:
        commentId:
          type: string
      required:
        - commentId
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    tasks.not_found:
      type: object
      properties:
        type:
          type: string
          const: tasks.not_found
        status:
          type: integer
          const: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: tasks.not_found
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
