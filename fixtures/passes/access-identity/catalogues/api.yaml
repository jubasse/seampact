# The access.identity catalogues: the five schemes of CHK-005, a query API key, HTTP Basic, bearer schemes with
# OAuth 2 flows and an OpenID Connect URL, template and application signature schemes, identity headers, and the
# four credential identities of CHK-004, a partner identity on the CHK-132 schemes, and four signed ones.
api: { name: catalogues, version: 1 }

schemes:
  sessionCookie: { kind: cookie, name: __Host-session, csrf: csrfToken }
  csrfToken: { kind: header, name: X-Csrf-Token }
  bearer: { kind: bearer }
  deviceToken: { kind: header, name: X-Device-Token }
  internalToken: { kind: bearer, bearerFormat: jwt }
  mapsKey: { kind: query, name: key }
  legacyBasic: { kind: basic }
  partnerOauth:
    kind: bearer
    oauth2:
      flows:
        clientCredentials: { tokenUrl: 'https://auth.example.com/token', scopes: {} }
  partnerOidc: { kind: bearer, openIdConnect: 'https://auth.example.com/.well-known/openid-configuration' }
  stripeSignature:
    kind: signature
    name: Stripe-Signature
    format: 't={ts},v1={sig}'
    algorithm: hmac-sha256
    payload: '{ts}.{rawBody}'
    encoding: hex
    tolerance: 5m
    key: { value: stripe }
  githubSignature:
    kind: signature
    name: X-Hub-Signature-256
    format: 'sha256={sig}'
    algorithm: hmac-sha256
    payload: '{rawBody}'
    encoding: hex
    key: { from: path.workspaceId }
  clerkWebhook:
    kind: signature
    verify: application
    name: svix-signature
    headers: [svix-id, svix-timestamp]
  slackSignature:
    kind: signature
    verify: application
    name: X-Slack-Signature
    headers: [X-Slack-Request-Timestamp]

headers:
  deadline: { name: X-Deadline, in: request, semantic: deadline }
  trace: { name: traceparent, in: request, semantic: traceContext }
  actorSurface: { name: X-Actor-Surface, in: request, semantic: actorSurface }
  rightsVersion: { semantic: versionToken, response: X-Rights-Version, request: If-Rights-Version }

identities:
  viewer:
    schemes:
      read: [sessionCookie, bearer]
      write: [sessionCookie, bearer]
      optionalRead: [deviceToken]
    principal: ViewerPrincipal
  viewer_or_device:
    schemes: { read: [sessionCookie, bearer], write: [sessionCookie, bearer], optionalRead: [deviceToken] }
    principal:
      variants: { viewer: ViewerPrincipal, device: DevicePrincipal }
    summary: A signed-in viewer or a registered device.
  operator:
    schemes: { read: [sessionCookie], write: [sessionCookie] }
    principal: OperatorPrincipal
    headers:
      rightsVersion: { from: principal.rightsVersion, for: writes, required: false, stale: api.rights_version_stale }
  service:
    schemes: { read: [internalToken], write: [internalToken] }
    principal: ServicePrincipal
    errors: [api.unavailable]
    headers:
      deadline: { for: all, required: true }
      trace: { for: all }
      actorSurface: { for: writes, required: true, schema: { enum: Surface } }
  partner:
    schemes: { read: [mapsKey, partnerOauth, partnerOidc, legacyBasic], write: [] }
    principal: PartnerPrincipal
  stripe:
    kind: signed
    scheme: stripeSignature
    principal: WebhookCaller
  github:
    kind: signed
    scheme: githubSignature
    principal: WebhookCaller
    unknownKeys: { ignore: "GitHub adds payload fields without notice." }
  clerk:
    kind: signed
    scheme: clerkWebhook
    principal: WebhookCaller
    unknownKeys: { keep: "Clerk adds event fields the handler forwards." }
  slack:
    kind: signed
    scheme: slackSignature
    principal: WebhookCaller

enums:
  Surface: { values: [app, studio], reason: "The product's entry points." }

schemas:
  ViewerPrincipal: { type: object, required: [userId], properties: { userId: { type: string } } }
  DevicePrincipal: { type: object, required: [deviceId], properties: { deviceId: { type: string } } }
  OperatorPrincipal:
    type: object
    required: [operatorId, rightsVersion]
    properties: { operatorId: { type: string }, rightsVersion: { type: string } }
  ServicePrincipal: { type: object, required: [service], properties: { service: { type: string } } }
  PartnerPrincipal: { type: object, required: [partnerId], properties: { partnerId: { type: string } } }
  WebhookCaller: { type: object, required: [account], properties: { account: { type: string } } }

surfaces:
  app:
    identity: viewer
    routes: {}
