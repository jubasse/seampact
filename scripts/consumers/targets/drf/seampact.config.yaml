# The consumer's app config: the reference contract's apis through seampact-drf, serving every
# operation; the suite's control views sit outside the api's base path.
outDir: generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-drf
    api: tasks
    frameworkRoutes:
      - { path: "/v1/patterned/**", reason: "The pattern-allow-listed-framework-route boot case's routes (ADR 0015)." }
  - id: tasksService
    out: tasks_service
    use: pypi:seampact-drf
    api: tasksService
  - id: tasksServiceWrites
    out: tasks_service_writes
    use: pypi:seampact-drf
    api: tasksServiceWrites
  - id: tasksDevices
    out: tasks_devices
    use: pypi:seampact-drf
    api: tasksDevices
  - id: tasksOptionalAuth
    out: tasks_optional_auth
    use: pypi:seampact-drf
    api: tasksOptionalAuth
  - id: tasksAbsoluteUrls
    out: tasks_absolute_urls
    use: pypi:seampact-drf
    api: tasksAbsoluteUrls
  - id: tasksPaging
    out: tasks_paging
    use: pypi:seampact-drf
    api: tasksPaging
    # The changes-since feed carries the complete page fact, which this target refuses by name in 1.0.
    operations: { exclude: [listChanges, listEvents] }
  - id: tasksSplitSort
    out: tasks_split_sort
    use: pypi:seampact-drf
    api: tasksSplitSort
