# The registry proof after a release: one consumer per family installs the published version from the real
# registries only and passes the http suite's default profile, from the checkout of the release tag. NestJS from npm,
# Spring Boot with Gradle (the plugin from the Gradle Plugin Portal) and with Maven from Maven Central, Laravel from
# Packagist and FastAPI from PyPI. The Spring Boot plugins resolve the compiler from Maven Central and FastAPI from
# the seampact-compiler wheel, each through the pin it ships; the binary the Laravel and FastAPI consumers bundle the
# contract with comes from the GitHub release, checked against its SHA256SUMS. Started by hand once the six PHP
# mirrors are on Packagist. It publishes nothing and reads no secret.
name: post-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The published release version, MAJOR.MINOR.PATCH.
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The version is a release version
        run: node scripts/release/run-version.ts "$VERSION" --mode real

  proof-nestjs:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: The NestJS consumer installs from npm and passes the http suite
        run: node scripts/release/registry-proof/node-consumer.ts --registry https://registry.npmjs.org/ --version "$VERSION" --dir "$RUNNER_TEMP/nestjs"

  # The Maven and the Gradle consumer are two jobs: the Gradle Plugin Portal reviews a new plugin by hand, so the
  # Gradle proof can fail for days after the release while the Maven proof already passes.
  proof-spring-boot-maven:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: The Maven consumer builds from Maven Central
        run: scripts/release/registry-proof/spring-boot.sh maven registries "$VERSION" "$RUNNER_TEMP/consumers"
      - run: pnpm install --frozen-lockfile
      - name: The Maven consumer passes the http suite
        env:
          SEAMPACT_PROOF_TARGET: spring-boot
          SEAMPACT_PROOF_APP: ${{ runner.temp }}/consumers/maven/target/consumer.jar
          SEAMPACT_PROOF_REPORTS: ${{ runner.temp }}/reports/maven
        run: pnpm vitest run --config scripts/release/registry-proof/vitest.config.ts

  proof-spring-boot-gradle:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: The Gradle consumer builds from the Gradle Plugin Portal and Maven Central
        run: scripts/release/registry-proof/spring-boot.sh gradle registries "$VERSION" "$RUNNER_TEMP/consumers"
      - run: pnpm install --frozen-lockfile
      - name: The Gradle consumer passes the http suite
        env:
          SEAMPACT_PROOF_TARGET: spring-boot
          SEAMPACT_PROOF_APP: ${{ runner.temp }}/consumers/gradle/build/libs/consumer.jar
          SEAMPACT_PROOF_REPORTS: ${{ runner.temp }}/reports/gradle
        run: pnpm vitest run --config scripts/release/registry-proof/vitest.config.ts

  proof-laravel:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:2.10.2
          coverage: none
      - name: Download the release binary and bundle the reference contract
        run: |
          scripts/release/registry-proof/release-binary.sh "$VERSION" "$RUNNER_TEMP/binary"
          scripts/consumers/php/bundle.sh "$RUNNER_TEMP/binary/seampact-linux-x64" "$RUNNER_TEMP/bundles/reference"
      - name: The Laravel consumer installs from Packagist and generates
        run: scripts/release/registry-proof/laravel.sh "$RUNNER_TEMP/bundles/reference" "$VERSION" "$RUNNER_TEMP/laravel"
      - run: pnpm install --frozen-lockfile
      - name: The Laravel consumer passes the http suite
        env:
          SEAMPACT_PROOF_TARGET: laravel
          SEAMPACT_PROOF_APP: ${{ runner.temp }}/laravel/app
          SEAMPACT_PROOF_REPORTS: ${{ runner.temp }}/reports/laravel
        run: pnpm vitest run --config scripts/release/registry-proof/vitest.config.ts

  proof-fastapi:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Download the release binary and bundle the reference contract
        run: |
          scripts/release/registry-proof/release-binary.sh "$VERSION" "$RUNNER_TEMP/binary"
          scripts/consumers/php/bundle.sh "$RUNNER_TEMP/binary/seampact-linux-x64" "$RUNNER_TEMP/bundles/reference"
      - name: The FastAPI consumer installs from PyPI and generates
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: scripts/release/registry-proof/fastapi.sh "$RUNNER_TEMP/bundles/reference" "$VERSION" "$RUNNER_TEMP/fastapi"
      - run: pnpm install --frozen-lockfile
      - name: The FastAPI consumer passes the http suite
        env:
          SEAMPACT_PROOF_TARGET: fastapi
          SEAMPACT_PROOF_APP: ${{ runner.temp }}/fastapi/app
          SEAMPACT_PROOF_VENV: ${{ runner.temp }}/fastapi/venv
          SEAMPACT_PROOF_REPORTS: ${{ runner.temp }}/reports/fastapi
        run: pnpm vitest run --config scripts/release/registry-proof/vitest.config.ts
