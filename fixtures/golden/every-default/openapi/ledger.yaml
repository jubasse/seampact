    Entry:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          minimum: 0
        postedAt:
          type: string
          format: date-time
      required:
        - entryId
        - kind
        - amount
        - postedAt
    EntryFilter:
      type: object
