          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: channel
          from: path.channelId
      x-seampact-requires:
        - right: tasks.list
          subject: scope.channel
        - right: channels.member
          subject: scope.channel
      x-seampact-paging:
        none: true
      x-seampact-maturity:
        level: experimental
        source: api
    post:
      operationId: createTask
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
