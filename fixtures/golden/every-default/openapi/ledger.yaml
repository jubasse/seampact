openapi: 3.1.0
info:
  title: ledger
  version: "2"
  summary: Entries kept by a bookkeeping product.
x-seampact-api:
  kind: product
x-seampact-format: house
paths:
  /entries:
    get:
      operationId: entries_list
      parameters:
        - name: filter
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/EntryFilter"
        - name: kinds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntryKind"
            maxItems: 2
        - name: p
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
        - name: per
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: order
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:postedAt|amount),(?:asc|desc)$
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
                  meta:
                    type: object
                    properties:
                      servedAt:
                        type: string
                        format: date-time
                      page:
                        type: integer
                      lastPage:
                        type: integer
                      perPage:
                        type: integer
                      total:
                        type: integer
                    required:
                      - servedAt
                      - page
                      - lastPage
                      - perPage
                      - total
                required:
                  - data
                  - meta
        "400":
          description: err.bad_input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/err.bad_input"
          x-seampact-errors:
            - code: err.bad_input
              derivedFrom: input.invalid
        "401":
          description: err.unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/err.unauthenticated"
          x-seampact-errors:
            - code: err.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: err.internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/err.internal"
          x-seampact-errors:
            - code: err.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: pages
        position: page
        roles:
          page: query.p
          limit: query.per
          sort: query.order
        maxLimit: 40
        defaultLimit: 20
        overLimit: clamp
        sortKeys:
          - key: amount
          - key: postedAt
      x-seampact-unknown-query:
        ignore: Gateways add tracking parameters.
      x-seampact-maturity:
        level: provisional
        source: api
    post:
      operationId: entry_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntry"
        x-seampact-unknown-keys:
