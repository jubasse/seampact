version: 1
differences:
  - id: big-integers-exact
    reason: The Rust core keeps an integer above 2^53 exactly, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: ir
      pointer: /schemas/Counter/properties/0/default
    change: value
    from: 9223372036854776000
    to: 9223372036854775807
  - id: big-integers-exact-tree-schemas
    reason: The Rust core keeps an integer default above 2^53 exactly in the tree.schemas half, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: halves
      api: bigints
      half: tree.schemas
      pointer: /schemas/Counter/properties/0/default
    change: value
    from: 9223372036854776000
    to: 9223372036854775807
  - id: big-integers-exact-derive-errors
    reason: The Rust core keeps an integer error example above 2^53 exactly in the derive.errors half, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: halves
      api: bigints
      half: derive.errors
      pointer: /errors/api.limit_exceeded/example/limit
    change: value
    from: 9007199254740992
    to: 9007199254740993
  - id: yaml-syntax-parser-message
    reason: The Rust loader parses YAML with saphyr-parser, whose syntax error message replaces the yaml package's; the position is the same.
    decision: docs/maintainers/rust-design/loader-and-pipeline.md#10-out-of-scope-and-differences-to-record
    applies:
      fixtures: ["rules/load-yaml-syntax"]
      output: diagnostics
      pointer: /workspace/1/message
    change: message
    from: "YAML syntax error: Flow map in block collection must be sufficiently indented and end with a }"
    to: "YAML syntax error: while parsing a flow mapping, did not find expected ',' or '}'"
