api: { name: a, version: 1 }
schemes:

  none:
    kind: signature
    name: X-Sig
    format: 'sha256={sig}'
    algorithm: none
    payload: '{rawBody}'
    encoding: hex
    key: { value: k }
  sha1:
    kind: signature
    name: X-Sig
    format: 'sha1={sig}'
    algorithm: sha1
    payload: '{rawBody}'
    encoding: hex
    key: { value: k }