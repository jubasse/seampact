name: Native IR models

# The native IR models generated from the IR JSON Schema (ADR 0010): the regenerate-and-diff check, then the
# Kotlin model's tests on Java 21 and 25 (A13), with bytecode for Java 21, and the PHP model's tests and static
# analysis on the latest PHP 8.3 and 8.5 (the patched floor, ADR 0010). On a pull request they run only when the change touches the models,
# their sources, the toolchain pins or this workflow; `native-ir` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ir-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native-ir: ${{ steps.detect.outputs.native-ir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request can be compared with its base.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a change to the native IR models or their sources
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "native-ir=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The sources of the models and of `regenerate`: the golden IR files, the IR and naming schemas, code and vectors, the
          # generator, the spec package's exports, the workspace and toolchain pins, the models and this workflow.
          watched='^(jvm/|php/|scripts/ir-models/|fixtures/golden/|packages/core/spec/(schemas/ir|src/ir|vectors/ir|src/naming|vectors/naming)/'
          watched+='|\.github/actions/|\.github/workflows/p2-native-ir\.yml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$'
          watched+='|packages/core/spec/package\.json$|\.nvmrc$)'
          # Both sides of a move, with names NUL-separated and never quoted, so that a moved path, or one with a
          # quote, a backslash, a tab or a non-ASCII byte, still matches.
          changed=$(git diff -z --name-only --no-renames "origin/$PR_BASE...HEAD" | tr '\0' '\n')
          # An empty diff runs every job rather than none.
          if [ -z "$changed" ] || grep -Eq "$watched" <<< "$changed"; then
            echo "native-ir=true" >> "$GITHUB_OUTPUT"
          else
            echo "native-ir=false" >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated models are current
        run: node --import ./scripts/ir-models/register.ts scripts/ir-models/cli.ts --check

  kotlin:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both JDKs are installed: Gradle runs on the last one, and the tests run on the matrix one, which the
      # toolchain detection finds without a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test the Kotlin model on Java ${{ matrix.test-jdk }}
        working-directory: jvm
        run: ./gradlew check -PtestJdk=${{ matrix.test-jdk }}

  php:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - name: Install the PHP dev tools from the lock file
        working-directory: php/ir
        run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - name: Test the PHP model and reader on PHP ${{ matrix.php-version }}
        working-directory: php/ir
        run: vendor/bin/phpunit
      - name: Analyse the PHP model and reader
        working-directory: php/ir
        run: vendor/bin/phpstan analyse --no-progress

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  native-ir:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, regenerate, kotlin, php]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.native-ir }}
