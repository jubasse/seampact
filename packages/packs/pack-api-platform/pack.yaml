# JSON-LD items, Hydra collections and the iri-reference format for API Platform.
pack: { name: '@seampact/pack-api-platform', version: 1.1.0, extends: [] }

scalars:
  iri-reference: { type: string, description: "An IRI reference, such as the '@id' of a JSON-LD node." }

errors:
  api.validation_failed:
    status: 422
    nature: refused
    title: The request does not satisfy the contract.
    params:
      violations:
        type: array
        items:
          type: object
          properties:
            propertyPath: { type: string }
            message: { type: string }
          required: [propertyPath, message]
    example: { violations: [{ propertyPath: /title, message: minLength }] }

formats:
  jsonld:
    media: application/ld+json
    success:
      item:
        body: { '@context': '/contexts/${resource}', '@id': $self, '@type': $resource, $merge: $payload }
    error:
      body:
        '@context': /contexts/Error
        '@id': '/errors/${status}'
        '@type': Error
        type: '/errors/${status}'
        title: $title
        detail: $detail
        status: $status
        code: $code
        $merge: $params

pagings:
  hydra:
    request:
      page: { query: page }
      limit: { query: itemsPerPage }
      sort: { query: 'order[{key}]', style: keyed }
    response:
      body:
        '@context': '/contexts/${resource}'
        '@id': $path
        '@type': Collection
        totalItems: $total
        member: { $each: $items, $as: { '@id': $itemSelf, '@type': $resource, $merge: $item } }
        view: { '@id': $self, '@type': PartialCollectionView, first: $first, last: $last, previous: $previous, next: $next }

conventions:
  format: jsonld
  errors:
    derived:
      schemaInvalid:
        code: api.validation_failed
        params: { violations: { $each: $issues, $as: { propertyPath: $item.pointer, message: $item.rule } } }
  paging: { default: hydra }
