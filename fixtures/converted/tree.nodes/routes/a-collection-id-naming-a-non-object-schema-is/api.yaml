
api: { name: a, version: 1, kind: product }

pagings:
  cursor:
    request: { cursor: { query: cursor }, limit: { query: limit } }
    response: { body: $items }
conventions:
  paging: { default: cursor, maxLimit: 50 }

schemas:
  Missing: { type: string }
  Task: { type: object, properties: { taskId: { type: string } } }
surfaces:
  app:
    prefix: /v{version}
    routes:
      tasks: { kind: collection, id: Missing, singular: task, item: Task, ops: [get, list] }
