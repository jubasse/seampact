[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace crates.
seampact-authoring = { path = "crates/authoring", version = "2.0.0" }
seampact-bundle = { path = "crates/bundle", version = "2.0.0" }
seampact-bundle-fetch = { path = "crates/bundle-fetch", version = "2.0.0" }
seampact-bundle-source = { path = "crates/bundle-source", version = "2.0.0" }
seampact-cli = { path = "crates/cli", version = "2.0.0" }
seampact-cli-config = { path = "crates/cli-config", version = "2.0.0" }
seampact-compiler = { path = "crates/compiler", version = "2.0.0" }
seampact-diagnostics = { path = "crates/diagnostics", version = "2.0.0" }
seampact-diff = { path = "crates/diff", version = "2.0.0" }
seampact-diff-table = { path = "crates/diff-table", version = "2.0.0" }
seampact-editor-schemas = { path = "crates/editor-schemas", version = "2.0.0" }
seampact-finalize = { path = "crates/finalize", version = "2.0.0" }
seampact-format = { path = "crates/format", version = "2.0.0" }
seampact-gen-probe = { path = "crates/gen-probe", version = "2.0.0" }
seampact-generate = { path = "crates/generate", version = "2.0.0" }
seampact-generators = { path = "crates/generators", version = "2.0.0" }
seampact-ir = { path = "crates/ir", version = "2.0.0" }
seampact-ir-check = { path = "crates/ir-check", version = "2.0.0" }
seampact-js = { path = "crates/js", version = "2.0.0" }
seampact-json = { path = "crates/json", version = "2.0.0" }
seampact-lint = { path = "crates/lint", version = "2.0.0" }
seampact-load = { path = "crates/load", version = "2.0.0" }
seampact-naming = { path = "crates/naming", version = "2.0.0" }
seampact-openapi = { path = "crates/openapi", version = "2.0.0" }
seampact-oracle = { path = "crates/oracle", version = "2.0.0" }
seampact-pass-access-identity = { path = "crates/pass-access-identity", version = "2.0.0" }
seampact-pass-access-rights = { path = "crates/pass-access-rights", version = "2.0.0" }
seampact-pass-derive-errors = { path = "crates/pass-derive-errors", version = "2.0.0" }
seampact-pass-derive-wire = { path = "crates/pass-derive-wire", version = "2.0.0" }
seampact-pass-link = { path = "crates/pass-link", version = "2.0.0" }
seampact-pass-tree-nodes = { path = "crates/pass-tree-nodes", version = "2.0.0" }
seampact-pass-tree-schemas = { path = "crates/pass-tree-schemas", version = "2.0.0" }
seampact-pass-tree-shared = { path = "crates/pass-tree-shared", version = "2.0.0" }
seampact-paths = { path = "crates/paths", version = "2.0.0" }
seampact-pipeline = { path = "crates/pipeline", version = "2.0.0" }
seampact-span = { path = "crates/span", version = "2.0.0" }
seampact-target = { path = "crates/target", version = "2.0.0" }
seampact-templates = { path = "crates/templates", version = "2.0.0" }
seampact-validate = { path = "crates/validate", version = "2.0.0" }
seampact-writer = { path = "crates/writer", version = "2.0.0" }
# Parse surface and ordered maps; the number features follow the IR types design note, section 3.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision", "float_roundtrip", "unbounded_depth"] }
indexmap = { version = "2.14.2", features = ["serde"] }
ryu-js = "1.0.3"
regress = "0.12.0"
jsonschema = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
similar = "3.2.1"
saphyr-parser = "0.3.4"
# The OpenAPI YAML emitter, at the parser's version: no second parser version.
saphyr = "=0.3.4"
camino = "1.2.6"
thiserror = "2.0.21"
rayon = "1.12.0"
line-index = "0.1.2"
text-size = "1.1.1"
unicode-normalization = "0.1.26"
annotate-snippets = "0.12.18"
flate2 = "1.1.11"
sha2 = "0.11.1"
# The formatter of generated TypeScript and JavaScript, seampact-format only: one git rev (tag oxfmt_v0.78.0), each
# with its version so cargo-deny reads no wildcard. The pin moves only in a lead PR that reruns the oracle.
oxc_formatter = { git = "https://github.com/oxc-project/oxc", rev = "7d8e1f49", version = "0.78.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", rev = "7d8e1f49", version = "0.78.0" }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "7d8e1f49", version = "0.158.0" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "7d8e1f49", version = "0.158.0" }
# The release channel of seampact-bundle-fetch only: HTTPS through rustls with the ring provider and the OS store.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# WHATWG URL parsing for printable URLs and the release channel, as the TypeScript's `URL`.
url = "2.5.8"
num-bigint = "0.4.8"
# Tests and benchmarks.
insta = "1.49.0"
tempfile = "3.27.0"
snapbox = "1.2.2"
libtest-mimic = "0.8.2"
proptest = "1.12.0"
criterion = "0.8.2"
arbitrary = "1.5.0"
libfuzzer-sys = "0.4.13"
# The CLI binary and xtask only.
anyhow = "1.0.104"

# Tests and the oracle run 4-5 times faster at opt-level 1 (the gate: 320 s to 70 s after a one-crate
# change); debug assertions and overflow checks stay on, so behaviour is unchanged.
[profile.dev]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
