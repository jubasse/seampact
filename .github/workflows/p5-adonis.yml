name: AdonisJS consumer

# Builds and packs the seampact packages, then installs them from the tarballs into the AdonisJS test consumer,
# generates the AdonisJS boundary of both reference apis, typechecks, boots AdonisJS in process and runs
# `reference slice answers` against it, once per AdonisJS major (ADR 0019).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release-gate:
        description: A run the release starts for its conformance gate; it skips the drift rows, which test newer dependencies, not the release.
        required: false
        type: boolean
        default: false
  # The nightly run holds the drift row (AdonisJS 6 on yup).
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: adonis-consumer-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
      post-merge: ${{ steps.detect.outputs.post-merge }}
      # A release gate run holds no drift row.
      drift: ${{ inputs.release-gate != true && steps.detect.outputs.drift || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages a Node server consumer installs (core, packs, runtime, the TypeScript, fetch and validator
          # targets, its own), the http suite, the consumer harness and its overlays, the reference contract and the pins.
          watched-paths: |
            ^packages/(core|packs|runtime)/
            ^packages/targets/codegen-(ts|fetch|zod|yup|class-validator|adonis)/
            ^packages/tools/http-suite/
            ^scripts/consumers/(cli|build-and-pack|consumer-project|install-into|ignore-vendor|packed-packages|run-step|served-app|validator-choice)\.ts$
            ^scripts/consumers/template/
            ^scripts/consumers/targets/(adonis|adonis6)/
            ^scripts/golden/
            ^fixtures/reference/
            ^\.github/actions/
            ^\.github/workflows/p5-adonis\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^tsconfig\.base\.json$
            ^\.nvmrc$
          # The fast tier: a pull request to develop runs this lane only for its own code.
          pull-request-paths: |
            ^packages/targets/codegen-(adonis)/
            ^scripts/consumers/targets/(adonis|adonis6)/
            ^\.github/workflows/p5-adonis\.yml$

  # The PR row; the post-merge and drift jobs below run the other pairs.
  adonis-consumer:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: adonis, validators: zod }
    steps: &consumer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.target }} consumer on ${{ matrix.validators }} from packed tarballs
        run: node scripts/consumers/cli.ts --target "${{ matrix.target }}" --validators "${{ matrix.validators }}" --dir "$RUNNER_TEMP/test-seampact-${{ matrix.target }}-${{ matrix.validators }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.target }}-http-suite-${{ matrix.validators }}
          path: ${{ runner.temp }}/test-seampact-${{ matrix.target }}-${{ matrix.validators }}/reports
          retention-days: 90
          if-no-files-found: warn

  adonis-consumer-post-merge:
    needs: changes
    if: needs.changes.outputs.post-merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: adonis, validators: yup }
          - { target: adonis6, validators: zod }
    steps: *consumer-steps

  adonis-consumer-drift:
    needs: changes
    if: needs.changes.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: adonis6, validators: yup }
    steps: *consumer-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  adonis:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, adonis-consumer, adonis-consumer-post-merge, adonis-consumer-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
