name: API Platform target

# The API Platform generator (ADR 0029), `seampact/api-platform`, which runs on the Symfony target: validated, installed
# from its lock file, audited, tested and analysed at PHPStan level max with Symfony 7.4, together with the Symfony
# runtime it changes. The e2e job derives the API Platform consumer from the Symfony one, generates the reference
# contract into it with Node removed, warms it (the boot check) and serves it with PHP's built-in server to the shared
# http suite's default and pack:api-platform profiles. On a pull request they run only when the change touches the PHP packages, the
# reference contract, the consumer or this workflow; `api-platform` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "45 0 * * *"

permissions:
  contents: read

concurrency:
  group: api-platform-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api-platform: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Detect a change to the PHP packages, the consumer or the files they read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^php/
            ^fixtures/reference/
            ^fixtures/golden/reference/
            ^fixtures/golden/pack-api-platform/
            ^packages/packs/pack-api-platform/
            ^packages/core/
            ^packages/tools/binary/
            ^packages/tools/http-suite/
            ^scripts/consumers/targets/symfony/
            ^scripts/consumers/targets/api-platform/
            ^scripts/consumers/php/
            ^scripts/consumers/targets/spring-boot/(contract-source\.sh|credentials\.json)$
            ^scripts/consumers/served-app\.ts$
            ^pnpm-lock\.yaml$
            ^\.github/actions/
            ^\.github/workflows/api-platform\.yml$
          # The fast tier: a pull request to develop runs this lane only for its own code.
          pull-request-paths: |
            ^php/api-platform/
            ^php/symfony/
            ^scripts/consumers/targets/api-platform/
            ^\.github/workflows/api-platform\.yml$

  generator:
    needs: changes
    if: needs.changes.outputs.api-platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.5"
    steps: &generator-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - uses: ./.github/actions/composer-cache
        with:
          dependency-hash: ${{ hashFiles('php/api-platform/composer.lock', 'php/symfony/composer.lock') }}
      - name: Validate the Composer manifest
        working-directory: php/api-platform
        run: composer validate --strict --no-interaction
      - name: Install from the lock file, the sibling packages through their path repositories
        working-directory: php/api-platform
        run: bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" install --no-interaction --no-progress --no-plugins --no-scripts
      - name: Audit the locked dependencies
        working-directory: php/api-platform
        run: bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" audit --locked --no-interaction
      - name: Lint the golden tree
        working-directory: php/api-platform
        shell: bash
        run: |
          set -euo pipefail
          find tests/golden -name '*.php' -print0 | xargs -0 -n 1 php -l > /dev/null
      - name: Test on PHP ${{ matrix.php-version }}
        working-directory: php/api-platform
        run: vendor/bin/phpunit
      - name: Analyse
        working-directory: php/api-platform
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  generator-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.3"
    steps: *generator-steps

  # The reference contract and its pack-api-platform variant bundled once by the compiler binary, so the consumer job
  # fetches them without Node.
  contract-bundle:
    needs: changes
    if: needs.changes.outputs.api-platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore or build the compiler binary
        uses: ./.github/actions/compiler-binary
      - name: Bundle the reference contract and its pack-api-platform variant
        run: |
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/reference"
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/pack-api-platform" fixtures/golden/pack-api-platform/contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-platform-contract-bundle
          path: ${{ runner.temp }}/bundles
          # The pack-api-platform bundle keeps its packs under `sources/.packs`, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The consumer generated from the bundle with Node removed, warmed by `cache:warmup` (the boot check), then served by
  # `php -S` to the http suite's default and hand-written profiles; the boot profile warms the boot-variant apps, and its
  # pack-api-platform app runs the `pack:api-platform` profile.
  e2e:
    name: e2e (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.api-platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.5"
            symfony: "7.4"
    env:
      WORK: ${{ github.workspace }}/../api-platform-consumer
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - uses: ./.github/actions/composer-cache
        with:
          dependency-hash: ${{ hashFiles('php/*/composer.json', 'scripts/consumers/targets/symfony/composer.json') }}
      - name: Remove Node from the runner, so the PHP path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-platform-contract-bundle
          path: ${{ runner.temp }}/bundles
      - name: Assemble, install, generate and warm the consumer and its boot-variant and pack-api-platform apps
        shell: bash
        env:
          SYMFONY_MAJOR: ${{ matrix.symfony }}
        run: |
          set -euo pipefail
          for variant in "" allow-listed route-check-off hook-check-off pack-api-platform; do
            bundled="$RUNNER_TEMP/bundles/reference"
            if [ "$variant" = "pack-api-platform" ]; then bundled="$RUNNER_TEMP/bundles/pack-api-platform"; fi
            scripts/consumers/targets/api-platform/assemble.sh "$WORK" "$bundled" "$SYMFONY_MAJOR" $variant
            app="$WORK/app${variant:+-$variant}"
            if [ "$variant" = "pack-api-platform" ]; then app="$WORK/app-pack-laravel"; fi
            (
              cd "$app"
              bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" update --no-interaction --no-progress --no-plugins --no-scripts
              "$GITHUB_WORKSPACE/scripts/consumers/targets/symfony/check-majors.sh" . "$SYMFONY_MAJOR"
              bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" audit --no-interaction
              vendor/bin/seampact generate
              php bin/console cache:warmup
            )
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the default, hand-written, boot and pack:api-platform profiles
        env:
          SEAMPACT_API_PLATFORM_APP: ${{ env.WORK }}/app
          SEAMPACT_API_PLATFORM_ALLOW_LISTED_APP: ${{ env.WORK }}/app-allow-listed
          SEAMPACT_API_PLATFORM_ROUTE_CHECK_OFF_APP: ${{ env.WORK }}/app-route-check-off
          SEAMPACT_API_PLATFORM_HOOK_CHECK_OFF_APP: ${{ env.WORK }}/app-hook-check-off
          SEAMPACT_API_PLATFORM_PACK_APP: ${{ env.WORK }}/app-pack-laravel
          SEAMPACT_API_PLATFORM_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/api-platform/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-platform-http-suite-php${{ matrix.php-version }}-symfony${{ matrix.symfony }}
          overwrite: true
          path: reports
          retention-days: 90
          if-no-files-found: warn

  e2e-queue:
    name: e2e (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.3"
            symfony: "7.4"
    env:
      WORK: ${{ github.workspace }}/../api-platform-consumer
    steps: *e2e-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  api-platform:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, generator, generator-queue, contract-bundle, e2e, e2e-queue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.api-platform }}
