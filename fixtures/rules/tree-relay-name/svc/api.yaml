api: { name: svc, version: 1, kind: service, caller: { identity: service, right: callerService } }
schemes:
  internalToken: { kind: bearer }
identities:
  service:
    schemes: { read: [internalToken], write: [internalToken] }
    principal: P
schemas:
  P: { type: object, required: [service], properties: { service: { type: string } } }
rights:
  callerService: {}
surfaces:
  internal:
    prefix: /internal/v{version}
    requires: [{ right: callerService }]
    routes:
      fetch: { relays: tasks.getTask }
