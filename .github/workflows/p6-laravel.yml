name: Laravel target

# The Laravel generator (ADR 0023) and the framework-neutral emitters it shares with the other PHP targets:
# `seampact/laravel` and `seampact/codegen`, each validated, installed from its lock file, audited, tested and
# analysed at PHPStan level max on the latest PHP 8.3 and 8.5. The laravel tests compare the reference contract's
# generated tree with the committed golden, which PHPStan analyses against Laravel 13 and `php -l` lints. On a pull
# request they run only when the change touches the PHP packages, the reference contract or this workflow; `laravel`
# is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      laravel: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the PHP packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^php/
            ^fixtures/golden/reference/
            ^packages/core/spec/schemas/ir/
            ^\.github/actions/
            ^\.github/workflows/p6-laravel\.yml$

  packages:
    needs: changes
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.5"]
        package: [codegen, laravel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - name: Validate the Composer manifest
        working-directory: php/${{ matrix.package }}
        run: composer validate --strict --no-interaction
      - name: Install from the lock file, the sibling packages through their path repositories
        working-directory: php/${{ matrix.package }}
        run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - name: Audit the locked dependencies
        working-directory: php/${{ matrix.package }}
        run: composer audit --locked --no-interaction
      - name: Lint the golden tree
        if: matrix.package == 'laravel'
        working-directory: php/laravel
        shell: bash
        run: |
          set -euo pipefail
          find tests/golden -name '*.php' -print0 | xargs -0 -n 1 php -l > /dev/null
      - name: Test ${{ matrix.package }} on PHP ${{ matrix.php-version }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpunit
      - name: Analyse ${{ matrix.package }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  laravel:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.laravel }}
