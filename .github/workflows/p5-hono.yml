name: Hono consumer

# Builds and packs the seampact packages, then installs them from the tarballs into the Hono test consumer,
# generates the boundary of both reference apis, typechecks, starts the app on `@hono/node-server` and runs
# `reference slice answers` against it (ADR 0020).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hono-consumer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      post-merge: ${{ steps.detect.outputs.post-merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # Every path: only a change to documentation no test reads skips this lane.
          watched-paths: |
            .

  # The PR rows: every target and every validator once; the post-merge job below runs the other pairs.
  consumer:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: hono, validators: zod }
    steps: &consumer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.target }} consumer on ${{ matrix.validators }} from packed tarballs
        run: node scripts/consumers/cli.ts --target "${{ matrix.target }}" --validators "${{ matrix.validators }}" --dir "$RUNNER_TEMP/test-seampact-${{ matrix.target }}-${{ matrix.validators }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.target }}-http-suite-${{ matrix.validators }}
          path: ${{ runner.temp }}/test-seampact-${{ matrix.target }}-${{ matrix.validators }}/reports
          retention-days: 7
          if-no-files-found: warn

  consumer-post-merge:
    needs: changes
    if: needs.changes.outputs.post-merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: hono, validators: yup }
    steps: *consumer-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  hono:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, consumer, consumer-post-merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
