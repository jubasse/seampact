name: Conformance release gate

# The checklist's release gate over every proof: the proof files and the http-suite reports the consumer workflows
# uploaded on develop (kept 90 days): the newest of each artefact from a successful push or scheduled run of this
# repository. It names each live id that has no fixture, or no test for a target it lists, and each server consumer
# without a report; API Platform pairs are out until after v1. Report-only: a gap or a failed download is a warning.
# The blocking gate runs in release.yml, on the reports of the release commit.

on:
  # Weekly, Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p8-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the consumers' http-suite reports
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          bash scripts/checklist/fetch-suite-reports.sh "$RUNNER_TEMP/suite-reports" 2>&1 |
            tee "$RUNNER_TEMP/suite-reports.txt"
      - name: Run the release gate
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/checklist/cli.ts check --release-gate --suite-reports "$RUNNER_TEMP/suite-reports" 2>&1 |
            tee "$RUNNER_TEMP/release-gate.txt"
      - name: Write the gaps to the job summary
        if: always()
        run: |
          {
            echo "## Conformance release gate"
            echo
            echo "Reports (the run and commit each one comes from):"
            echo
            echo '```'
            cat "$RUNNER_TEMP/suite-reports.txt" 2>/dev/null || echo "No report was downloaded."
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-gate.txt" 2>/dev/null || echo "The gate did not run: see the download step."
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # The lane's check: no change filter, the gate runs weekly and on every manual run.
  p8-conformance:
    # Every job this check stands for is listed here, or its failure would not reach the check.
    needs: [release-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: "true"
