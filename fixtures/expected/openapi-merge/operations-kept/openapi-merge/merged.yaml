openapi: 3.1.0
info:
  title: reference
  version: tasks 1
x-seampact-apis:
  - name: tasks
    kind: product
    version: "1"
    summary: Tasks shared inside channels.
x-seampact-format: bare
paths:
  /v1/channels/{channelId}/tasks:
    post:
      operationId: Tasks.createTask
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tasks.CreateTask"
      responses:
        "201":
          description: Success.
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks.Task"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.csrf_invalid, api.forbidden
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Tasks.api.csrf_invalid"
                  - $ref: "#/components/schemas/Tasks.api.forbidden"
                discriminator:
                  propertyName: code
                  mapping:
                    api.csrf_invalid: "#/components/schemas/Tasks.api.csrf_invalid"
                    api.forbidden: "#/components/schemas/Tasks.api.forbidden"
          x-seampact-errors:
            - code: api.csrf_invalid
              derivedFrom: csrf.cookieWrite
            - code: api.forbidden
              derivedFrom: requirement.errors
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: scope.errors
        "409":
          description: api.idempotency_in_progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.idempotency_in_progress"
          x-seampact-errors:
            - code: api.idempotency_in_progress
              derivedFrom: idempotency.write
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "422":
          description: api.idempotency_key_reused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.idempotency_key_reused"
          x-seampact-errors:
            - code: api.idempotency_key_reused
              derivedFrom: idempotency.write
        "429":
          description: api.rate_limited
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.rate_limited"
          x-seampact-errors:
            - code: api.rate_limited
              derivedFrom: requirement.errors
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - Tasks.bearer: []
        - Tasks.sessionCookie: []
          Tasks.csrfToken: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: channel
          from: path.channelId
      x-seampact-requires:
        - rule: throttle
          bucket: write
          entry: writeThrottle
        - right: roles
          params:
            allowed:
              - owner
              - editor
          subject: scope.channel
          entry: channelEditor
      x-seampact-restricted-to:
        - schema: Tasks.CreateTask
          pointer: /effort
          right: roles
          params:
            allowed:
              - owner
          subject: scope.channel
          direction: input
          input: reject
        - schema: Tasks.Task
          pointer: /effort
          right: tasks.seeEffort
          subject: holderField.taskId
          direction: output
      x-seampact-idempotency:
        header: Idempotency-Key
        replayHeader: Idempotency-Replayed
        lifetimeMs: 86400000
        required: true
        enforce: boundary
      x-seampact-maturity:
        level: provisional
        source: api
      x-seampact-source-api: tasks
  /v1/channels/{channelId}/tasks/{taskId}/archive:
