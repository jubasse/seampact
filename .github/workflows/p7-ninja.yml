name: Ninja target

# The Django Ninja target of the uv workspace `python/` (ADR 0027 "Ninja"): the golden packages of the reference
# contract under ruff, `ruff format --check`, `mypy --strict` with the Django stubs and pyright strict, and the tests of
# `seampact-ninja`, on two rows: Python 3.12 with the Django 5.2 and Ninja 1.5.3 floor, installed by hash over the
# lock, and the latest Python with the locked Django 6.x and the latest Ninja; then the consumer of
# `scripts/consumers/targets/ninja` through the http suite on both rows. On a pull request or a push they run only when
# the change touches the Python packages, the files their tests read, or this workflow; `ninja` is the one check to
# require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ninja: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the Python packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^python/
            ^fixtures/golden/
            ^fixtures/hooks-shape/
            ^fixtures/reference/
            ^packages/core/
            ^packages/tools/binary/
            ^packages/tools/http-suite/
            ^pnpm-lock\.yaml$
            ^\.github/actions/
            ^\.github/workflows/p7-ninja\.yml$
            ^scripts/consumers/targets/ninja/
            ^scripts/consumers/targets/fastapi/app/(handlers|sample_data)\.py$
            ^scripts/consumers/targets/drf/app/control\.py$
            ^scripts/consumers/python/
            ^scripts/consumers/php/bundle\.sh$
            ^scripts/consumers/targets/spring-boot/(contract-source\.sh|credentials\.json)$
            ^scripts/consumers/served-app\.ts$
  golden:
    needs: changes
    if: needs.changes.outputs.ninja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: Python 3.12, Django 5.2 LTS and Ninja 1.5.3, installed by hash over the lock.
          - python-version: "3.12"
            django: "5.2"
            ninja: "1.5"
            floor-requirements: ninja/ci/floor-requirements.txt
          # The latest Python with the locked Django 6.x and the latest Ninja.
          - python-version: "3.x"
            django: "6"
            ninja: "1.7"
            floor-requirements: ""
    name: golden (Python ${{ matrix.python-version }}, Django ${{ matrix.django }}, Ninja ${{ matrix.ninja }})
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Install the Django and Ninja floor by hash
        if: matrix.floor-requirements != ''
        env:
          FLOOR_REQUIREMENTS: ${{ matrix.floor-requirements }}
        run: uv pip install --require-hashes --no-deps -r "$FLOOR_REQUIREMENTS"
      # Read from the installed metadata: importing Ninja needs Django settings.
      - name: Check the row runs the Django and Ninja versions it names
        env:
          DJANGO_ROW: ${{ matrix.django }}
          NINJA_ROW: ${{ matrix.ninja }}
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version; import os;
          assert version('django').startswith(os.environ['DJANGO_ROW']), version('django');
          assert version('django-ninja').startswith(os.environ['NINJA_ROW']), version('django-ninja')"
      # `--no-sync` from here: a sync would put the locked Django back over the floor.
      - name: Lint
        run: uv run --no-sync ruff check django ninja
      - name: Check the format
        run: uv run --no-sync ruff format --check django ninja
      - name: Type-check the packages and their golden output with the Django stubs
        run: uv run --no-sync mypy django/src ninja/src ninja/ninja_tests
      - name: Type-check the golden output as pyright strict reads it
        run: uv run --no-sync pyright
      - name: Test on Python ${{ matrix.python-version }}, Django ${{ matrix.django }} and Ninja ${{ matrix.ninja }}
        run: uv run --no-sync pytest ninja/ninja_tests
  contract-bundle:
    needs: changes
    if: needs.changes.outputs.ninja == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - name: Bundle the reference contract
        run: scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/reference"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ninja-contract-bundle
          path: ${{ runner.temp }}/bundles
          retention-days: 3
          if-no-files-found: error

  # The consumer installed from the built wheels and generated from the bundle with Node removed, then served to the
  # http suite's default, hand-written and boot profiles: the floor row (Django 5.2, Ninja 1.5.3, sync views) under
  # gunicorn as a WSGI app, the latest row (Django 6.x, the latest Ninja, async views) under uvicorn as an ASGI app;
  # both are PR rows.
  e2e:
    name: e2e (${{ matrix.row }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.ninja == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: floor
            python-version: "3.12"
            django: "5.2"
            server: gunicorn
            views: sync
            pins: python/ninja/ci/floor-requirements.txt
          - row: latest
            python-version: "3.x"
            django: "6"
            server: uvicorn
            views: async
            pins: ""
    env:
      WORK: ${{ github.workspace }}/../ninja-consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the Python path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ninja-contract-bundle
          path: ${{ runner.temp }}/bundles
      - name: Build the wheels and write the hash-pinned requirements from the lock
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
          SERVER: ${{ matrix.server }}
        run: |
          set -euo pipefail
          (cd python && uv build --all-packages --wheel --out-dir "$WORK/wheels")
          scripts/consumers/python/requirements.sh "$WORK/requirements.txt" seampact-ninja generate "$SERVER"
      - name: Install with pip, then assemble and generate the consumer and its allow-listed variant
        shell: bash
        env:
          DJANGO_ROW: ${{ matrix.django }}
          SEAMPACT_NINJA_VIEWS: ${{ matrix.views }}
        run: |
          set -euo pipefail
          scripts/consumers/python/install.sh "$WORK/venv" "$WORK/requirements.txt" "$WORK/wheels" \
            'seampact-ninja[generate]' ${{ matrix.pins }}
          # The consumer's stripe hook verifies signatures with seampact-signed-webhooks, as an app installs it.
          "$WORK/venv/bin/python" -m pip install --no-input --disable-pip-version-check --no-index \
            --find-links "$WORK/wheels" seampact-signed-webhooks
          "$WORK/venv/bin/python" -c "from importlib.metadata import version; import os; print(version('django'), version('django-ninja')); assert version('django').startswith(os.environ['DJANGO_ROW'])"
          for variant in "" allow-listed; do
            scripts/consumers/targets/ninja/assemble.sh "$WORK" "$RUNNER_TEMP/bundles/reference" $variant
            (cd "$WORK/app${variant:+-$variant}" && "$WORK/venv/bin/seampact" generate)
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node came back during the install or the generation."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the default, hand-written and boot profiles on every operation of both apis
        env:
          SEAMPACT_NINJA_SERVER: ${{ matrix.server }}
          SEAMPACT_NINJA_APP: ${{ env.WORK }}/app
          SEAMPACT_NINJA_ALLOW_LISTED_APP: ${{ env.WORK }}/app-allow-listed
          SEAMPACT_NINJA_VENV: ${{ env.WORK }}/venv
          SEAMPACT_NINJA_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/ninja/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ninja-http-suite-${{ matrix.row }}
          path: reports
          retention-days: 7
          if-no-files-found: warn

  ninja:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, golden, contract-bundle, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.ninja }}
