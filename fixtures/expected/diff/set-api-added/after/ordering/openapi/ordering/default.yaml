openapi: 3.1.0
info:
  title: ordering
  version: "1"
tags:
  - name: Zebra
  - name: zebra
  - name: élan
  - name: ꙮ
  - name: 𝒜
  - name: 😀
  - name: ｚ
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/event:
    post:
      tags:
        - Zebra
        - zebra
        - élan
        - ꙮ
        - 𝒜
        - 😀
        - ｚ
      operationId: event
      parameters:
        - name: X-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "204":
          description: Success.
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security: []
      x-seampact-access:
        public: The ordering fixture has no identity.
      x-seampact-maturity:
        level: provisional
        source: api
  /v1/mixed:
    post:
      tags:
        - Zebra
        - zebra
        - élan
        - ꙮ
        - 𝒜
        - 😀
        - ｚ
      operationId: mixed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mixed"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mixed"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security: []
      x-seampact-access:
        public: The ordering fixture has no identity.
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    Event:
      oneOf:
        - $ref: "#/components/schemas/Variant2"
        - $ref: "#/components/schemas/Variant1"
        - $ref: "#/components/schemas/Variant3"
        - $ref: "#/components/schemas/Variant5"
        - $ref: "#/components/schemas/Variant6"
        - $ref: "#/components/schemas/Variant4"
      x-seampact-discriminator:
        in: header
        name: X-Event
    Mixed:
      type: object
      properties:
        zebra:
          type: string
        Zebra:
          type: string
        élan:
          type: string
        ｚ:
          type: string
        𝒜:
          type: string
        😀:
          type: string
        ꙮ:
          type: string
    Variant1:
      type: object
      properties:
        v1:
          type: string
    Variant2:
      type: object
      properties:
        v2:
          type: string
    Variant3:
      type: object
      properties:
        v3:
          type: string
    Variant4:
      type: object
      properties:
        v4:
          type: string
    Variant5:
      type: object
      properties:
        v5:
          type: string
    Variant6:
      type: object
      properties:
        v6:
          type: string
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.payload_too_large:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.payload_too_large
            status:
              type: integer
              const: 413
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.payload_too_large
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiPayloadTooLargeParams"
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unsupported_media_type:
      type: object
      properties:
        type:
          type: string
          const: api.unsupported_media_type
        status:
          type: integer
          const: 415
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unsupported_media_type
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
