# Access catalogue declarations access.rights refuses (ADR 0002 sections 4 and 9, ADR 0007 section 2): right
# names outside conventions.rights.pattern or without an identifier segment, a subject scope and a parent scope
# that are not declared, a cycle of parent scopes, a proof without a schema, a bucket prefix and window too large.
api: { name: shop, version: 1 }

conventions:
  rights: { pattern: '^[a-z]+(\.[a-z]+)+$' }

schemas:
  TeamId: { type: string }

scopes:
  team: { id: TeamId, within: org }
  left: { id: TeamId, within: right }
  right: { id: TeamId, within: left }

rights:
  tasks.read: {}
  Tasks: {}
  tasks.code: { codeName: '--' }
  '*': {}
  tasks.own: { subject: { scope: channel } }

rules:
  stepUp:
    proof: { in: body, name: stepUpToken }

buckets:
  wide: { key: [address/200] }
  forever: { key: [address], limit: 1, window: 99999999999999d }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The fixture checks catalogues only. }
    routes:
      ping: { method: get }
