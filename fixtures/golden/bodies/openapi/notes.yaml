openapi: 3.1.0
info:
  title: notes
  version: "1"
  summary: Notes shared inside a workspace.
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/spaces/{spaceId}:
    get:
      operationId: getSpace
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: scope.errors
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: space
          from: path.spaceId
      x-seampact-maturity:
        level: provisional
        source: api
  /v1/spaces/{spaceId}/notes:
    get:
      operationId: listNotes
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: "#/components/schemas/NoteState"
        - name: labels
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              maxLength: 30
            maxItems: 4
        - name: range
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: "#/components/schemas/NoteFilter"
        - name: archived
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: boolean
        - name: minWords
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: sort
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              pattern: ^(?:createdAt|-createdAt|wordCount|-wordCount)$
      responses:
        "200":
          description: Success.
          headers:
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.sort_key_forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.sort_key_forbidden"
          x-seampact-errors:
            - code: api.sort_key_forbidden
              derivedFrom: sortKey.restricted
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: scope.errors
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: space
          from: path.spaceId
      x-seampact-restricted-to:
        - schema: Note
          pointer: /wordCount
          right: notes.seeWordCount
          subject: scope.space
          direction: output
      x-seampact-filtered-by: notes.read
      x-seampact-paging:
        style: cursor
        position: cursor
        roles:
          cursor: query.cursor
          limit: query.limit
          sort: query.sort
        maxLimit: 100
        defaultLimit: 100
        overLimit: reject
        sortKeys:
          - key: createdAt
          - key: wordCount
            right: notes.seeWordCount
            subject: scope.space
      x-seampact-maturity:
        level: provisional
        source: api
  /v1/spaces/{spaceId}/notes/attach:
    post:
      operationId: attachNotes
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachNotesInput"
            encoding:
              file:
                contentType: image/png, application/pdf
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: scope.errors
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: space
          from: path.spaceId
      x-seampact-idempotency:
        exempt: An upload is harmless to repeat.
      x-seampact-maturity:
        level: provisional
        source: api
  /v1/spaces/{spaceId}/notes/feedback:
    post:
      operationId: feedbackNotes
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Feedback"
            encoding:
              tags:
                style: form
                explode: true
      responses:
        "303":
          description: Redirection.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: scope.errors
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: space
          from: path.spaceId
      x-seampact-idempotency:
        exempt: A feedback form is harmless to repeat.
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssuesItem"
      required:
        - issues
    ApiSortKeyForbiddenParams:
      type: object
      properties:
        key:
          type: string
      required:
        - key
    AttachNotesInput:
      type: object
      properties:
        file:
          type: string
          x-seampact-max-size: 20971520
        caption:
          type: string
          maxLength: 200
        meta:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: "#/components/schemas/AttachmentMeta"
      required:
        - file
    Attachment:
      type: object
      properties:
        attachmentId:
          type: string
          format: uuid
      required:
        - attachmentId
    AttachmentMeta:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
      required:
        - label
    Feedback:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
        score:
          type: integer
          minimum: 1
          maximum: 5
        subscribe:
          type: boolean
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
      required:
        - message
    IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        state:
          $ref: "#/components/schemas/NoteState"
        wordCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
        - noteId
        - title
        - state
        - createdAt
    NoteFilter:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    NoteState:
      type: string
      enum:
        - draft
        - published
    Space:
      type: object
      properties:
        spaceId:
          type: string
          format: uuid
      required:
        - spaceId
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        type:
          type: string
          const: api.not_found
        status:
          type: integer
          const: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.not_found
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    api.payload_too_large:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.payload_too_large
            status:
              type: integer
              const: 413
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.payload_too_large
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiPayloadTooLargeParams"
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.sort_key_forbidden:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.sort_key_forbidden
            status:
              type: integer
              const: 403
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.sort_key_forbidden
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSortKeyForbiddenParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        type:
          type: string
          const: api.unauthenticated
        status:
          type: integer
          const: 401
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unauthenticated
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    api.unsupported_media_type:
      type: object
      properties:
        type:
          type: string
          const: api.unsupported_media_type
        status:
          type: integer
          const: 415
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unsupported_media_type
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
