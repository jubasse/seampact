openapi: 3.1.0
info:
  title: tasksAbsoluteUrls
  version: "1"
  summary: Notes whose page links are absolute URLs.
x-seampact-api:
  kind: product
x-seampact-format: hal
paths:
  /absolute-urls/v1/notes:
    get:
      operationId: listNotes
      parameters:
        - name: page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Success.
          content:
            application/hal+json:
              schema:
                type: object
                properties:
                  _embedded:
                    type: object
                    properties:
                      notes:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                _links:
                                  type: object
                                  properties:
                                    self:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                      required:
                                        - href
                                  required:
                                    - self
                              required:
                                - _links
                            - $ref: "#/components/schemas/Note"
                    required:
                      - notes
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                        required:
                          - href
                      first:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                        required:
                          - href
                      prev:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                      last:
                        type: object
                        properties:
                          href:
                            type: string
                            format: uri
                        required:
                          - href
                    required:
                      - self
                      - first
                      - last
                  page:
                    type: object
                    properties:
                      size:
                        type: integer
                      totalElements:
                        type: integer
                      totalPages:
                        type: integer
                      number:
                        type: integer
                    required:
                      - size
                      - totalElements
                      - totalPages
                      - number
                required:
                  - _embedded
                  - _links
                  - page
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: halPages
        position: page
        roles:
          page: query.page
          limit: query.size
          sort: query.sort
        maxLimit: 100
        defaultLimit: 100
        overLimit: reject
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
  /absolute-urls/v1/notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success.
          content:
            application/hal+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      _links:
                        type: object
                        properties:
                          self:
                            type: object
                            properties:
                              href:
                                type: string
                                format: uri
                            required:
                              - href
                        required:
                          - self
                    required:
                      - _links
                  - $ref: "#/components/schemas/Note"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: member.notFound
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssuesItem"
      required:
        - issues
    IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - noteId
        - text
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        type:
          type: string
          const: api.not_found
        status:
          type: integer
          const: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.not_found
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        type:
          type: string
          const: api.unauthenticated
        status:
          type: integer
          const: 401
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unauthenticated
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
