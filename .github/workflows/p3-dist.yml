name: Contract bundles

# Writes the reference contract's bundle tarball on Linux, macOS and Windows, under other time zones and locales,
# and checks the three SHA-256 values are one (ADR 0011: the same sources and compiler give the same tarball bytes
# on every machine). The checkout keeps LF line endings on Windows, so the job measures the writer, not autocrlf.
# A pull request and a push compare Linux and Windows; the nightly adds macOS.
# `channel-smoke` serves a bundle of the reference contract through a loopback npm registry, a loopback HTTPS
# server and a local bare git repository, and runs the Node CLI against each (ADR 0011 "Channel smoke tests").
# `bundle-determinism` and `channel-smoke` are the checks to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run holds the drift row (macOS).
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: p3-dist-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      drift: ${{ steps.detect.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # Every path: only a change to documentation no test reads skips this lane.
          watched-paths: |
            .

  # The PR rows; the drift job below runs the same steps on macOS.
  tarball:
    name: &tarball-name tarball (${{ matrix.os }}, ${{ matrix.tz }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tz: UTC, lang: en_US.UTF-8 }
          - { os: windows-latest, tz: Pacific/Auckland, lang: en_US.UTF-8 }
    env: &tarball-env
      TZ: ${{ matrix.tz }}
      LANG: ${{ matrix.lang }}
      LC_ALL: ${{ matrix.lang }}
    steps: &tarball-steps
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the reference tarball and its SHA-256
        shell: bash
        run: |
          mkdir -p out
          node --experimental-transform-types --no-warnings --import ./scripts/ir-models/register.ts \
            packages/core/compiler/src/bundle/reference-tarball.test-support.ts out/reference.tgz \
            | tee "out/${{ runner.os }}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ runner.os }}
          path: out

  tarball-drift:
    name: *tarball-name
    needs: changes
    if: needs.changes.outputs.drift == 'true'
    runs-on: ${{ matrix.os }}
    # macOS runners queue and start slowly.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, tz: Asia/Kolkata, lang: tr_TR.UTF-8 }
    env: *tarball-env
    steps: *tarball-steps

  bundle-determinism:
    needs: [changes, tarball, tarball-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
      # A documentation-only change built no tarball: the check passes on the verdict above.
      - if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: tarballs
      - name: One SHA-256 on every OS that ran
        if: needs.changes.outputs.run == 'true'
        env:
          # Linux and Windows, and macOS when the drift row ran.
          EXPECTED_TARBALL_COUNT: ${{ needs.changes.outputs.drift == 'true' && 3 || 2 }}
        run: |
          test "$(ls tarballs | wc -l)" = "$EXPECTED_TARBALL_COUNT"
          cat tarballs/*/*.sha256
          for file in tarballs/*/reference.tgz; do sha256sum "$file"; done
          test "$(cat tarballs/*/*.sha256 | sort -u | wc -l)" = 1
          test "$(sha256sum tarballs/*/reference.tgz | cut -d ' ' -f 1 | sort -u | wc -l)" = 1

  # A required check that is also the job: a skipped job would pass, so it always starts and the aggregate step turns
  # a failed change filter into a failure; a documentation-only change passes at once.
  channel-smoke:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
      - if: needs.changes.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: needs.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Fetch, check and generate from each channel
        if: needs.changes.outputs.run == 'true'
        run: pnpm vitest run scripts/dist-smoke
