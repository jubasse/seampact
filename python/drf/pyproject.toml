[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-drf"
version = "1.1.0"
description = "Seampact target for Django REST Framework: its generator and the runtime of the server code it generates."
keywords = ["django", "django-rest-framework", "drf", "server", "python", "seampact", "api-contract", "openapi", "codegen"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["djangorestframework>=3.18", "seampact-django==1.1.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/backend/drf/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

[project.optional-dependencies]
# What the generator needs; a production install of an app leaves it out.
generate = ["seampact-django[generate]==1.1.0"]

# The target `use: pypi:seampact-drf` names; `seampact generate` finds it through this group.
[project.entry-points."seampact.generators"]
drf = "seampact.drf.generator:DrfGenerator"

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]

[tool.uv.sources]
seampact-django = { workspace = true }
