      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 415
        code:
          type: string
          const: api.unsupported_media_type
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    csrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
