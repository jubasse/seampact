api: { name: shop, version: 1 }
conventions:
  errors:
    derived:
      sortKeyForbidden: { code: shop.sort_denied, params: { detail: [$$key, other] } }
errors:
  shop.sort_denied: { status: 403, params: { detail: { type: array, items: { type: string } } } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
