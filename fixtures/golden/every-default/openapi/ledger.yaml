          content:
            application/json:
              schema:
                $ref: "#/components/schemas/err.internal"
          x-seampact-errors:
            - code: err.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-unknown-query:
        ignore: Gateways add tracking parameters.
      x-seampact-maturity:
        level: provisional
