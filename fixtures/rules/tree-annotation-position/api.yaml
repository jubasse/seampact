api: { name: t, version: 1, kind: product }

services:
  catalog: { maturity: stable }

schemas:
  Note:
    type: object
    required: [tags]
    properties:
      tags: { type: array, items: { type: string, deprecated: true } }

surfaces:
  app:
    prefix: /v{version}
    routes:
      one: { method: get, operationId: getNote, output: Note }
