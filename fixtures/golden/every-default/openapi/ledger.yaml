components:
  schemas:
    CreateEntry:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/EntryKind"
        amount:
          type: integer
          format: int64
          minimum: 0
      required:
        - kind
        - amount
    EntriesBatchGetInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 25
      required:
