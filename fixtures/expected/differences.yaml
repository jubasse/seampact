version: 1
differences:
  - id: big-integers-exact
    reason: The Rust core keeps an integer above 2^53 exactly, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: ir
      pointer: /schemas/Counter/properties/0/default
    change: value
    from: 9223372036854776000
    to: 9223372036854775807
  - id: big-integers-exact-tree-schemas
    reason: The Rust core keeps an integer default above 2^53 exactly in the tree.schemas half, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: halves
      api: bigints
      half: tree.schemas
      pointer: /schemas/Counter/properties/0/default
    change: value
    from: 9223372036854776000
    to: 9223372036854775807
  - id: big-integers-exact-derive-errors
    reason: The Rust core keeps an integer error example above 2^53 exactly in the derive.errors half, where the TS oracle rounds it to a double.
    decision: docs/adr/0031-rust-core.md#what-stays
    applies:
      fixtures: ["big-integers/**"]
      output: halves
      api: bigints
      half: derive.errors
      pointer: /errors/api.limit_exceeded/example/limit
    change: value
    from: 9007199254740992
    to: 9007199254740993
  - id: yaml-syntax-parser-message
    reason: The Rust loader parses YAML with saphyr-parser, whose syntax error message replaces the yaml package's; the position is the same.
    decision: docs/maintainers/rust-design/loader-and-pipeline.md#10-out-of-scope-and-differences-to-record
    applies:
      fixtures: ["rules/load-yaml-syntax"]
      output: diagnostics
      pointer: /workspace/1/message
    change: message
    from: "YAML syntax error: Flow map in block collection must be sufficiently indented and end with a }"
    to: "YAML syntax error: while parsing a flow mapping, did not find expected ',' or '}'"
  - id: diagnostic-origin-member-order
    reason: The Rust core writes every diagnostic origin with its members in one order, api, layer, pointer, where the TS oracle appended the api last for an origin copied from another api.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["rules/workspace-relay-cycle"]
      output: diagnostics
      pointer: /apis/*/diagnostics/0/related/0/origin
    change: member-order
  - id: cli-config-yaml-syntax-text
    reason: The Rust CLI parses a config with saphyr-parser, so the YAML syntax error of `seampact.config.yaml` has its wording and its column, where the TS CLI prints the yaml package's.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["cli/config-yaml-tab", "cli/config-yaml-flow"]
      output: cli-stderr
      pointer: /stderr/0
    change: value
  - id: cli-diff-baseline-not-json-text
    reason: The Rust CLI reads a baseline IR with serde_json, whose parse error wording replaces V8's `JSON.parse` message.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["cli/diff-against-not-json"]
      output: cli-stderr
      pointer: /stderr/0
    change: value
  - id: cli-diff-baseline-schema-text
    reason: The Rust CLI lists the IR schema problems of a baseline with the schema engine's wording, where the TS CLI lists ajv's.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["cli/diff-against-invalid-ir"]
      output: cli-stderr
      pointer: /stderr/0
    change: value
  - id: cli-config-yaml-syntax-message
    reason: The Rust CLI parses a config with saphyr-parser, so the recorded read of a config with a YAML syntax error has its wording, where the TS reader has the yaml package's.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["cli/config-yaml-tab", "cli/config-yaml-flow"]
      output: cli-config
      pointer: /result/problems/0/message
    change: message
  - id: cli-config-yaml-tab-column
    reason: The Rust CLI reports the column of a tab used as indentation where saphyr-parser finds it, the second, where the yaml package reports the first.
    decision: docs/adr/0031-rust-core.md#bytes-that-change-once
    applies:
      fixtures: ["cli/config-yaml-tab"]
      output: cli-config
      pointer: /result/problems/0/where
    change: value
    from: "broken.config.txt:2:1"
    to: "broken.config.txt:2:2"
