# One refusal of each wire format and paging style check of tree.nodes (ADR 0002 sections 13 and 14): a slot its
# shape does not fill, a $ that starts no slot, a meta field with no type, an error body without $code, an id slot
# on an item without its id, a merged payload that clashes or is no object; a style named none, with two
# positions, a role with no parameter, a split sort without direction, a body without $items, a role outside its
# kind, a link that is no URL role, meta under a page without $meta, and a meta member the format names too; an
# array template with another key, a merge with a member path, a member name that is no slot; a keyed sort without
# {key}, a direction without split, and after without before.
api: { name: formats, version: 1, kind: product }

conventions:
  paging: { maxLimit: 50 }

schemas:
  Note: { type: object, properties: { kind: { type: string }, text: { type: string } } }

formats:
  slotted:
    success: { item: { body: { data: $payload, code: $code } } }
  broken:
    success: { list: { body: "cost $5" } }
  untyped:
    meta: { user: { fill: handler } }
  codeless:
    error: { body: { message: $title } }
  ided:
    success: { item: { body: { id: $id, data: $fields } } }
  merged:
    success: { item: { body: { $merge: $payload, kind: note } } }
  malformed:
    success:
      item: { body: { $each: $payload, $as: $item, extra: 1 } }
      table: { body: { $merge: $payload.id } }
      list: { body: { $bad.key: 1 } }
  stamped:
    success: { page: { body: { data: $items, meta: $meta } } }
    meta: { servedAt: { fill: now } }

pagings:
  none:
    request: { cursor: { query: cursor } }
    response: { body: $items }
  twice:
    request: { cursor: { query: cursor }, page: { query: page } }
  nameless:
    request: { cursor: {} }
  split:
    request: { cursor: { query: cursor }, sort: { query: sort, style: split } }
  itemless:
    request: { cursor: { query: cursor } }
    response: { body: { count: $total } }
  misfit:
    request: { cursor: { query: cursor } }
    response: { meta: { page: $page } }
  linked:
    request: { cursor: { query: cursor } }
    response: { links: { next: $nextCursor } }
  metaed:
    request: { cursor: { query: cursor } }
    response: { meta: { count: $total } }
  keyed:
    request: { cursor: { query: cursor }, sort: { query: sort, style: keyed } }
  directed:
    request: { cursor: { query: cursor }, sort: { query: sort, direction: dir } }
  half:
    request: { after: { query: after } }
  clashing:
    request: { cursor: { query: cursor } }
    response: { meta: { servedAt: $total } }

surfaces:
  app:
    prefix: /v{version}
    routes:
      slotted: { method: get, output: Note, format: slotted }
      broken: { method: get, output: Note, format: broken }
      untyped: { method: get, output: Note, format: untyped }
      codeless: { method: get, output: Note, format: codeless }
      ided: { method: get, output: Note, format: ided }
      merged: { method: get, output: Note, format: merged }
      text: { method: get, output: { type: string }, format: merged }
      malformed: { method: get, output: Note, format: malformed }
      keyed: { method: get, item: Note, paging: keyed }
      directed: { method: get, item: Note, paging: directed }
      half: { method: get, item: Note, paging: half }
      twice: { method: get, item: Note, paging: twice }
      nameless: { method: get, item: Note, paging: nameless }
      split: { method: get, item: Note, paging: split }
      itemless: { method: get, item: Note, paging: itemless }
      misfit: { method: get, item: Note, paging: misfit }
      linked: { method: get, item: Note, paging: linked }
      metaed: { method: get, item: Note, paging: metaed }
      clashing: { method: get, item: Note, paging: clashing, format: stamped }
