components:
  schemas:
    ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    Bounds:
      type: object
      properties:
        aboveZero:
          type: integer
          exclusiveMinimum: 0
        belowHundred:
          type: integer
          exclusiveMaximum: 100
        step:
          type: integer
          multipleOf: 5
        tenth:
          type: integer
          multipleOf: 0.1
        hundredth:
          type: integer
          multipleOf: 0.01
        fraction:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        plain:
          type: number
    Comment:
      type: object
      properties:
        text:
          type: string
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
      required:
        - text
    Counts:
      type: object
      propertyNames:
        type: string
        pattern: ^[a-z]+$
      additionalProperties:
        type: integer
        minimum: 0
    Day:
      type: object
      properties:
        day:
          type: string
          format: date
      required:
        - day
    Envelope:
      type: object
      properties:
        id:
          type: string
        data:
          x-seampact-opaque: The sender's object depends on the event type.
      required:
        - id
        - data
    Formats:
      type: object
      properties:
        email:
          type: string
          format: email
        uri:
          type: string
          format: uri
        uriReference:
          type: string
          format: uri-reference
        id:
          type: string
          format: uuid
        big:
          type: string
          format: int64
          pattern: ^-?(0|[1-9][0-9]*)$
        amount:
          type: string
          format: decimal
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
          x-seampact-minimum: "0"
    IgnoreChild:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    IgnoreKeys:
      type: object
      properties:
        label:
          type: string
        child:
          $ref: "#/components/schemas/IgnoreChild"
      required:
        - label
    Instant:
      type: object
      properties:
        at:
          type: string
          format: date-time
      required:
        - at
    KeepChild:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    KeepKeys:
      type: object
      properties:
        label:
          type: string
        child:
          $ref: "#/components/schemas/KeepChild"
      required:
        - label
    Labelled:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 3
      required:
        - label
    Member:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
      required:
        - role
    Notice:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/NoticeAssigned"
            - type: object
              properties:
                kind:
                  const: assigned
              required:
                - kind
        - allOf:
            - $ref: "#/components/schemas/NoticeCancelled"
            - type: object
              properties:
                kind:
                  const: cancelled
              required:
                - kind
        - allOf:
            - $ref: "#/components/schemas/NoticeDone"
            - type: object
              properties:
                kind:
                  const: done
              required:
                - kind
    NoticeAssigned:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        assignee:
          type: string
          format: uuid
      required:
        - taskId
        - assignee
    NoticeCancelled:
      type: object
      properties: {}
    NoticeDone:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
      required:
        - taskId
    OpaqueItems:
      type: object
      properties:
        items:
          type: array
          items:
            x-seampact-opaque: The sender's values depend on the event type.
      required:
        - items
    OptionalEnvelope:
      type: object
      properties:
        data:
          anyOf:
            - x-seampact-opaque: The sender's object depends on the event type.
            - type: "null"
      required:
        - data
    Owner:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
          enum:
            - owner
      required:
        - role
    PatchArticle:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        publishOn:
          anyOf:
            - type: string
              format: date
            - type: "null"
    Patterns:
      type: object
      properties:
        dot:
          type: string
          pattern: ^a[^\u000A\u000D\u0085\u2028-\u2029]b$
        space:
          type: string
          pattern: ^a[\u0009-\u000D ]b$
        end:
          type: string
          pattern: ^abc$
        dash:
          type: string
          pattern: ^[\-az]+$
        brace:
          type: string
          pattern: ^a\{2\}$
    Percent:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - value
    Point:
      type: object
      properties:
        left:
          type: integer
        top:
          type: integer
      required:
        - left
        - top
    Profile:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        nickname:
          type: string
          minLength: 1
      required:
        - name
    Quantity:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
    Receipt:
      type: object
      properties:
        note:
          anyOf:
            - type: string
            - type: "null"
      required:
        - note
    Role:
      type: string
      enum:
        - owner
        - editor
        - viewer
    StrictChild:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    StrictKeys:
      type: object
      properties:
        label:
          type: string
        child:
          $ref: "#/components/schemas/StrictChild"
      required:
        - label
    SubtreeInner:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    SubtreeKeys:
      type: object
      properties:
        label:
          type: string
        inner:
          $ref: "#/components/schemas/SubtreeInner"
      required:
        - label
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        title:
          type: string
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.payload_too_large:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.payload_too_large
            title:
              type: string
            status:
              type: integer
              const: 413
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.payload_too_large
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - title
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiPayloadTooLargeParams"
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            title:
              type: string
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - title
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unsupported_media_type:
      type: object
      properties:
        type:
          type: string
          const: api.unsupported_media_type
        title:
          type: string
        status:
          type: integer
          const: 415
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unsupported_media_type
        nature:
          type: string
        traceId:
          type: string
      required:
