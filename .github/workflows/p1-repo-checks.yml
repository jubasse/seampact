name: Repository checks

# The conformance checklist (ids, proofs, per-target report), the agent cartography
# (docs/agents/cartography.md) and the workflows themselves (actionlint): GitHub runs no job of an invalid workflow
# and reports it under its file path, so neither its required check nor ci-watch would see it. The package role, dependency rule and namespace checks run in
# `pnpm gate` (CI).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so --base can read the checklist at the base ref.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the checklist and its proofs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=$(bash .github/actions/lane-changes/change-range.sh)
          # The base is the range's left side: the pull request's base branch, the merge group's base or the push's
          # old tip.
          base="${range%%..*}"
          if [ -n "$base" ]; then
            node scripts/checklist/cli.ts check --base "$base"
          else
            node scripts/checklist/cli.ts check
          fi
      - name: Check the agent cartography is current
        run: node scripts/cartography/cli.ts --check
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Workflow syntax, expressions and contexts only; the scripts inside run steps are not linted here.
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
      - name: Report the share of items proven per target
        run: node scripts/checklist/cli.ts report >> "$GITHUB_STEP_SUMMARY"
