api: { name: shop, version: 1 }
conventions:
  errors:
    derived:
      schemaInvalid: { code: shop.invalid, params: { issues: { $each: $issues, $as: { $merge: $item } } } }
schemas:
  Issue: { type: object, required: [pointer, rule], properties: { in: { type: integer }, pointer: { type: string }, rule: { type: string } } }
errors:
  shop.invalid: { status: 400, params: { issues: { type: array, items: Issue } } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
