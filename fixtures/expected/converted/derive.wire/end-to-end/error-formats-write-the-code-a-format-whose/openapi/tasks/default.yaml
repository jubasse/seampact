openapi: 3.1.0
info:
  title: tasks
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: plain
paths:
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: api.schema_invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "404":
          description: api.not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: member.notFound
        "500":
          description: api.internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security: []
      x-seampact-access:
        public: Tasks are public.
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id
        - title
    api.internal:
      type: object
      properties:
        type:
          const: https://errors.example.com/api.internal
      required:
        - type
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        type:
          const: https://errors.example.com/api.not_found
      required:
        - type
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      type: object
      properties:
        type:
          const: https://errors.example.com/api.schema_invalid
      required:
        - type
      x-seampact-nature:
        base: refused
