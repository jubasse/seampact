          $ref: "#/components/schemas/Currency"
        quantity:
          type: integer
          minimum: 0
          maximum: 100
        inner:
          $ref: "#/components/schemas/ChilledMargin"
      required:
        - label
    ChilledCount:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        region:
          $ref: "#/components/schemas/Region"
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
        inner:
          $ref: "#/components/schemas/ChilledSpan"
      required:
        - label
    ChilledLimit:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        priority:
          $ref: "#/components/schemas/Priority"
        quantity:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - label
    ChilledMargin:
      type: object
      properties:
