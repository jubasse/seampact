# The uv workspace of the Python packages (ADR 0010): one distribution per member, tested and checked together.
# The workspace root is virtual: it is never built, it only holds the members, the dev tools and their settings.

[tool.uv]
required-version = "==0.13.6"

[tool.uv.workspace]
members = ["ir"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "types-jsonschema==4.26.0.20261006",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
src = ["ir/src"]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["ir/src"]
files = ["ir/src", "ir/tests"]
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["ir/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
