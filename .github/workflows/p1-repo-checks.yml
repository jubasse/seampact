name: Repository checks

# The conformance checklist (ids, proofs, per-target report). The package role, dependency
# rule and namespace checks run in `pnpm gate` (CI).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so --base can read the checklist at the base ref.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the checklist and its proofs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$PR_BASE"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # A new branch (all-zero sha) or a force push whose old tip is gone has no base.
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ]; then
            node scripts/checklist/cli.ts check --base "$base"
          else
            node scripts/checklist/cli.ts check
          fi
      - name: Report the share of items proven per target
        run: node scripts/checklist/cli.ts report >> "$GITHUB_STEP_SUMMARY"
