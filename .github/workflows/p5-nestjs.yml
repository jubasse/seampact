name: NestJS consumer

# Builds and packs the seampact packages, then installs them from the tarballs into the NestJS test consumer,
# generates the NestJS boundary of both reference apis, typechecks, boots NestJS on Express and runs
# `reference slice answers` against it, once per validator style of the compatibility matrix (ADR 0016), and once
# more on zod with the reply interceptor (target option `reply: interceptor`), since validation is the same pipe in
# both reply modes.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: nestjs-consumer-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
      post-merge: ${{ steps.detect.outputs.post-merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages a Node server consumer installs (core, packs, runtime, the TypeScript, fetch and validator
          # targets, its own), the http suite, the consumer harness and its overlays, the reference contract and the pins.
          watched-paths: |
            ^packages/(core|packs|runtime)/
            ^packages/targets/codegen-(ts|fetch|zod|yup|class-validator|nestjs)/
            ^packages/tools/http-suite/
            ^scripts/consumers/(cli|build-and-pack|consumer-project|install-into|ignore-vendor|packed-packages|run-step|served-app|validator-choice)\.ts$
            ^scripts/consumers/template/
            ^scripts/consumers/targets/(nestjs|nestjs-cjs)/
            ^scripts/golden/
            ^fixtures/reference/
            ^\.github/actions/
            ^\.github/workflows/p5-nestjs\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^tsconfig\.base\.json$
            ^\.nvmrc$
          # The fast tier: a pull request to develop runs this lane only for its own code.
          pull-request-paths: |
            ^packages/targets/codegen-(nestjs)/
            ^scripts/consumers/targets/(nestjs|nestjs-cjs)/
            ^\.github/workflows/p5-nestjs\.yml$

  # The PR row; the queue job runs every other target and validator once and the CommonJS tree, the post-merge job
  # the other pairs.
  nestjs-consumer:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: nestjs, validators: zod, reply: interceptor }
    steps: &consumer-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.target }} consumer on ${{ matrix.validators }} with reply ${{ matrix.reply }} from packed tarballs
        run: node scripts/consumers/cli.ts --target "${{ matrix.target }}" --validators "${{ matrix.validators }}" --target-option "reply=${{ matrix.reply }}" --dir "$RUNNER_TEMP/test-seampact-${{ matrix.target }}-${{ matrix.validators }}-${{ matrix.reply }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.target }}-http-suite-${{ matrix.validators }}-${{ matrix.reply }}
          path: ${{ runner.temp }}/test-seampact-${{ matrix.target }}-${{ matrix.validators }}-${{ matrix.reply }}/reports
          retention-days: 90
          if-no-files-found: warn

  nestjs-consumer-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: nestjs, validators: class-validator, reply: handler }
          # The generated tree on CommonJS, loading the runtime's CommonJS build.
          - { target: nestjs-cjs, validators: zod, reply: handler }
    steps: *consumer-steps

  nestjs-consumer-post-merge:
    needs: changes
    if: needs.changes.outputs.post-merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: nestjs, validators: zod, reply: handler }
          - { target: nestjs, validators: yup, reply: handler }
    steps: *consumer-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  nestjs:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, nestjs-consumer, nestjs-consumer-queue, nestjs-consumer-post-merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
