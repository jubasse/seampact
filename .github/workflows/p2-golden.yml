name: Golden IR determinism

# `scripts/golden --check` on every golden case: it compiles each case and compares the IR, the side table and the OpenAPI documents byte for
# byte with the committed files. The matrix runs it on Linux, macOS and Windows, with two time zones and two locales
# (one of them Turkish, for case mapping), and Windows converts every case source to CRLF before the check. ICU takes its
# default locale from the OS on Windows, so the Windows `lang` cells vary the time zone only. A pull request runs one
# Linux and one Windows row, a push to develop the other two, and the nightly the macOS rows (they only ever failed
# by timing out). `golden-determinism` is the check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run holds the drift rows (macOS).
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: golden-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      post-merge: ${{ steps.detect.outputs.post-merge }}
      drift: ${{ steps.detect.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # Every path: only a change to documentation no test reads skips this lane.
          watched-paths: |
            .

  # The PR rows; the post-merge and drift jobs below run the same steps on the other rows.
  determinism:
    name: &determinism-name determinism (${{ matrix.os }}, ${{ matrix.tz }}, ${{ matrix.lang }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tz: Pacific/Kiritimati, lang: tr_TR.UTF-8 }
          - { os: windows-latest, tz: Pacific/Auckland, lang: tr_TR.UTF-8 }
    env: &determinism-env
      TZ: ${{ matrix.tz }}
      LANG: ${{ matrix.lang }}
      LC_ALL: ${{ matrix.lang }}
    steps: &determinism-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .gitattributes keeps the fixtures LF, so autocrlf cannot give them CRLF: convert every case source here.
      # The pack-* contracts are generated copies of the reference, compared byte for byte: they stay LF.
      - name: Convert every case source to CRLF on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            const caseDirectories = ["fixtures/reference", "fixtures/validator-agreement",
              ...readdirSync("fixtures/golden").filter((name) => !name.startsWith("pack-")).map((name) => join("fixtures/golden", name, "contract"))];
            let convertedCount = 0;
            for (const directory of caseDirectories) {
              let entries;
              try { entries = readdirSync(directory, { recursive: true }); } catch (error) {
                if (error.code === "ENOENT") continue;
                throw error;
              }
              for (const entry of entries.filter((name) => name.endsWith(".yaml"))) {
                const file = join(directory, entry);
                const crlfText = readFileSync(file, "utf8").replace(/\r?\n/g, "\r\n");
                writeFileSync(file, crlfText);
                if (!readFileSync(file, "utf8").includes("\r\n")) throw new Error(`${file} has no CRLF after conversion`);
                convertedCount += 1;
              }
            }
            if (convertedCount === 0) throw new Error("no case source found to convert to CRLF");
            console.log(`converted ${convertedCount} case sources to CRLF`);
          '
      - name: Check every golden case
        run: node --experimental-transform-types --import ./scripts/ir-models/register.ts scripts/golden/cli.ts --check

  determinism-post-merge:
    name: *determinism-name
    needs: changes
    if: needs.changes.outputs.post-merge == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tz: UTC, lang: en_US.UTF-8 }
          - { os: windows-latest, tz: UTC, lang: en_US.UTF-8 }
    env: *determinism-env
    steps: *determinism-steps

  determinism-drift:
    name: *determinism-name
    needs: changes
    if: needs.changes.outputs.drift == 'true'
    runs-on: ${{ matrix.os }}
    # macOS runners queue and start slowly: two 15-minute timeouts were runner time, not the check.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, tz: America/Los_Angeles, lang: en_US.UTF-8 }
          - { os: macos-latest, tz: Asia/Kolkata, lang: tr_TR.UTF-8 }
    env: *determinism-env
    steps: *determinism-steps

  golden-determinism:
    needs: [changes, determinism, determinism-post-merge, determinism-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
