# The consumer's app config: the reference contract's tasks and tasksService apis through seampact-fastapi, every
# operation; the suite's control routes sit outside the api's base path. The tasks routes join FastAPI's document
# (`nativeDocs`), which the suite compares with seampact's `full` document written beside it.
outDir: generated
openapi:
  tasks:
    full: openapi/tasks.full.yaml
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-fastapi
    api: tasks
    artefacts: { nativeDocs: true }
  - id: tasksService
    out: tasks_service
    use: pypi:seampact-fastapi
    api: tasksService
