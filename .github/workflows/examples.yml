name: Examples

# Keeps the runnable example apps green: each one generates its code from its contract with the workspace packages,
# type-checks, builds the front and runs one request against the server it starts. On a pull request they run only when
# the change touches the example, the packages it generates with or this workflow; `examples` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change an example depends on
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The example apps and everything they generate with or run on: the compiler, the targets, the runtimes.
          watched-paths: |
            ^examples/
            ^packages/(core|runtime)/
            ^packages/targets/codegen-(ts|zod|fetch|nestjs|react)/
            ^\.github/actions/
            ^\.github/workflows/examples\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^tsconfig\.base\.json$
            ^\.nvmrc$
          # The fast tier: a pull request to develop runs this lane only for its own code.
          pull-request-paths: |
            ^examples/
            ^\.github/workflows/examples\.yml$

  nestjs-react:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/nestjs-react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate the server and the client from the contract
        run: pnpm generate
      - name: Type-check
        run: pnpm check:types
      - name: The build refuses a missing base URL
        run: "! pnpm build"
      - name: Build the React app
        run: cp .env.example .env && pnpm build
      - name: Start the server and call it with the generated client
        run: pnpm e2e

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  examples:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, nestjs-react]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.examples }}
