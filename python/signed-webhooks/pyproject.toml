[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-signed-webhooks"
version = "1.0.1"
description = "Verifies a template-signed webhook (HMAC, timestamp tolerance, secret rotation) inside an authenticate hook."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/concepts/packages/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]
