name: Python core packages

# The Python packages of the uv workspace `python/` (ADR 0010): the regenerate-and-diff check of the Python IR model,
# then each package tested and checked on the Python 3.12 floor and the latest Python: `uv sync --locked`, ruff lint
# and format, `mypy --strict`, pyright strict on the golden output of the Pydantic emitter, and pytest; each package's
# wheel built and installed into a fresh virtual environment from those wheels only, with Node removed; and `pip-audit` over the lock file. On a pull request or a push they run
# only when the change touches the Python packages, the generator of their IR model, the files their tests read or
# this workflow; `python-core` is the one check to require. The binary row builds the linux-x64 compiler binary and
# runs the runner test with it, with Node removed; the channel smoke (ADR 0011 "Channel smoke tests") generates from the
# release and git channels served locally with no binary and expects each tampered copy to be refused; on a pull
# request these run only when what they prove changes.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-core: ${{ steps.detect.outputs.run }}
      # The binary row builds the compiler: on a pull request it runs only when what it proves changes.
      binary-row: ${{ steps.detect.outputs.post-merge == 'true' || steps.binary-row.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the Python packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages, the model generator and its sources, the golden IR files, shared vectors and hooks shape
          # the tests read, the LICENSE each wheel carries, the Node toolchain pins of `regenerate`, and this workflow.
          watched-paths: |
            ^python/
            ^packages/runtime/signed-webhooks/vectors/
            ^fixtures/hooks-shape/
            ^LICENSE$
            ^scripts/ir-models/
            ^fixtures/golden/
            ^packages/core/spec/(schemas/(ir|bundle)|src/ir|vectors/(ir|bundle)|src/naming|vectors/naming)/
            ^packages/core/spec/package\.json$
            ^pnpm-lock\.yaml$
            ^package\.json$
            ^\.nvmrc$
            ^\.github/actions/
            ^\.github/workflows/p7-python-core\.yml$
      - name: Detect a change to what the binary row proves
        id: binary-row
        uses: ./.github/actions/lane-changes
        with:
          # The runner and its binary module, the binary and the CLI and compiler it embeds, the reference
          # contract and its golden IR, the channel servers and the Python smoke scripts, and this workflow.
          watched-paths: |
            ^python/(ir|codegen|hooks|fastapi)/
            ^scripts/dist-smoke/
            ^scripts/consumers/python/
            ^python/uv\.lock$
            ^scripts/ir-models/
            ^packages/tools/binary/
            ^packages/core/cli/
            ^packages/core/compiler/
            ^fixtures/reference/
            ^fixtures/golden/reference/
            ^\.github/actions/
            ^\.github/workflows/p7-python-core\.yml$

  regenerate:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated models are current
        run: node --import ./scripts/ir-models/register.ts scripts/ir-models/cli.ts --check

  packages:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor, and `3.x`, the latest stable Python.
        python-version: ["3.12", "3.x"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run --locked ruff check
      - name: Check the format
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      - name: Type-check the golden output of the Pydantic emitter as Pylance users do
        run: uv run --locked pyright
      - name: Test on Python ${{ matrix.python-version }}
        run: uv run --locked pytest

  binary:
    name: binary (linux x64)
    needs: changes
    if: needs.changes.outputs.python-core == 'true' && needs.changes.outputs.binary-row == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore or build the compiler binary
        uses: ./.github/actions/compiler-binary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-core-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  # The runner test: the pinned binary compiles the reference contract and its IR is byte-identical to the golden
  # files. Node is removed first, so the Python path is proven to need none.
  binary-runner:
    name: binary runner (linux x64)
    needs: [changes, binary]
    if: needs.changes.outputs.python-core == 'true' && needs.changes.outputs.binary-row == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-core-binary-linux-x64
          path: ${{ runner.temp }}/bin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Run the binary through the runner
        env:
          RUNNER_BINARY_DIRECTORY: ${{ runner.temp }}/bin
        run: |
          chmod +x "$RUNNER_BINARY_DIRECTORY/seampact-linux-x64"
          SEAMPACT_BINARY="$RUNNER_BINARY_DIRECTORY/seampact-linux-x64" \
            uv run --locked pytest ir/tests/test_binary_runner.py -rs

  # The Python leg of the channel smoke tests: a project using seampact-fastapi, installed from the built wheels, with
  # `openapi: none` and no binary, generates and checks from the release and git channels that
  # `scripts/dist-smoke/cli.ts serve` starts, and each tampered copy is refused as `bundle.file-hash`, naming the
  # file. The channels are served by Node; the Python side needs none.
  channel-smoke:
    name: channel smoke (python)
    needs: changes
    if: needs.changes.outputs.python-core == 'true' && needs.changes.outputs.binary-row == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      # The runner context is not available in a job-level env, which makes the whole workflow invalid.
      - name: Set the work directory
        run: echo "WORK=$RUNNER_TEMP/channel-smoke" >> "$GITHUB_ENV"
      - name: Install seampact-fastapi from the built wheels
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          scripts/consumers/python/build-wheels.sh "$WORK/wheels"
          scripts/consumers/python/requirements.sh "$WORK/requirements.txt" seampact-fastapi generate uvicorn
          scripts/consumers/python/install.sh "$WORK/venv" "$WORK/requirements.txt" "$WORK/wheels" 'seampact-fastapi[generate]'
      - name: Serve the release and git channels
        shell: bash
        run: |
          set -euo pipefail
          # Node stays on the PATH here: dist-smoke, a Node program, serves the channels; the runner steps run from the venv only.
          served="$RUNNER_TEMP/served.json"
          node --experimental-transform-types --import ./scripts/ir-models/register.ts scripts/dist-smoke/cli.ts serve \
            --work "$RUNNER_TEMP/channels" > "$served" 2> "$RUNNER_TEMP/channels.log" &
          for _ in $(seq 1 60); do
            if [ -s "$served" ]; then exit 0; fi
            sleep 2
          done
          echo "The channels did not start; their log:"
          cat "$RUNNER_TEMP/channels.log"
          exit 1
      - name: Generate and check from each channel, and refuse each tampered copy
        run: scripts/consumers/python/channel-smoke.sh "$WORK/cases" "$WORK/venv" "$RUNNER_TEMP/served.json" seampact-fastapi

  wheels:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Remove Node from the runner, so the Python build and install are proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - name: Build each package's wheel, its build requirements checked against their hashes
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: scripts/consumers/python/build-wheels.sh "$RUNNER_TEMP/dist"
      - name: Check each wheel carries the repository's LICENSE
        shell: bash
        run: |
          set -euo pipefail
          for wheel in "$RUNNER_TEMP"/dist/*.whl; do
            distribution=$(basename "$wheel" | cut -d- -f1-2)
            if ! unzip -p "$wheel" "$distribution.dist-info/licenses/LICENSE" | cmp -s - LICENSE; then
              echo "::error::$(basename "$wheel") does not carry the repository's LICENSE."
              exit 1
            fi
          done
      - name: Export the third-party runtime requirements of the wheels, pinned by hash from the lock file
        working-directory: python
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv export --frozen --all-packages --no-dev --no-emit-workspace --format requirements.txt
          --output-file "$RUNNER_TEMP/third-party-requirements.txt"
      # ADR 0011's two steps: third-party requirements from PyPI by hash, then the seampact wheels with no index.
      - name: Install the wheels into a fresh virtual environment, the seampact ones from the built wheels only, then import each package
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m venv clean-venv
          clean-venv/bin/python -I -m pip install --require-hashes --no-deps -r third-party-requirements.txt
          clean-venv/bin/python -I -m pip install --no-index --find-links dist dist/*.whl
          wheel_count=$(find dist -name '*.whl' | wc -l)
          clean-venv/bin/python -I - "$wheel_count" <<'PYTHON'
          import importlib
          import pkgutil
          import sys

          import seampact

          packages = sorted(module.name for module in pkgutil.iter_modules(seampact.__path__, "seampact."))
          for package in packages:
              importlib.import_module(package)
          if len(packages) != int(sys.argv[1]):
              sys.exit(f"{sys.argv[1]} wheels installed, but {len(packages)} seampact packages import: {packages}")
          print("Imported", ", ".join(packages))
          PYTHON
          clean-venv/bin/seampact --help

  audit:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Export every locked dependency with its hashes
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv export --locked --all-packages --all-groups --no-emit-workspace --format requirements-txt
          --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Audit the locked dependencies for known vulnerabilities
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv run --locked --only-group audit pip-audit --strict --disable-pip --require-hashes --progress-spinner off
          --requirement "$RUNNER_TEMP/requirements.txt"

  python-core:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, regenerate, packages, binary, binary-runner, channel-smoke, wheels, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.python-core }}
          allow-skip: ${{ needs.changes.outputs.binary-row == 'false' && 'binary binary-runner channel-smoke' || '' }}
