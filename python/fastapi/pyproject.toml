[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-fastapi"
version = "1.0.1"
description = "The FastAPI target of seampact: its generator and the placement runtime of the generated code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# FastAPI breaks in minors: 0.162 is the matrix floor, a later minor is untested and refused at boot unless the app
# config allows it. Starlette and Pydantic come through FastAPI's own ranges; Pydantic 2.9 is FastAPI 0.162's floor.
dependencies = [
    "fastapi>=0.162",
    "seampact-codegen[pydantic]==1.0.1",
    "seampact-hooks==1.0.1",
]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/backend/fastapi/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

[project.optional-dependencies]
# What the generator itself needs; a production install of an app leaves it out.
generate = ["seampact-codegen[generate]==1.0.1", "seampact-ir==1.0.1"]

[project.entry-points."seampact.generators"]
fastapi = "seampact.fastapi.generator:FastApiGenerator"

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]

[tool.uv.sources]
seampact-codegen = { workspace = true }
seampact-hooks = { workspace = true }
seampact-ir = { workspace = true }
