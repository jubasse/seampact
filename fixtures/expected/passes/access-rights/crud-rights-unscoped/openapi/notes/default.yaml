openapi: 3.1.0
info:
  title: notes
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/notes:
    get:
      operationId: listNotes
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.forbidden"
          x-seampact-errors:
            - code: api.forbidden
              derivedFrom: requirement.errors
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-requires:
        - right: notes.list
      x-seampact-paging:
        none: true
      x-seampact-maturity:
        level: experimental
        source: api
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.forbidden"
          x-seampact-errors:
            - code: api.forbidden
              derivedFrom: requirement.errors
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-requires:
        - right: notes.create
      x-seampact-maturity:
        level: experimental
        source: api
  /v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.forbidden"
          x-seampact-errors:
            - code: api.forbidden
              derivedFrom: requirement.errors
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: owner.caller
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-requires:
        - right: settings.get
      x-seampact-owner: caller
      x-seampact-maturity:
        level: experimental
        source: api
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.forbidden"
          x-seampact-errors:
            - code: api.forbidden
              derivedFrom: requirement.errors
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: owner.caller
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-requires:
        - right: settings.update
      x-seampact-owner: caller
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiForbiddenParams:
      type: object
      properties:
        pointer:
          type: string
    ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    CreateNote:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        title:
          type: string
      required:
        - noteId
        - title
    Settings:
      type: object
      properties:
        theme:
          type: string
      required:
        - theme
    api.forbidden:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.forbidden
            status:
              type: integer
              const: 403
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.forbidden
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiForbiddenParams"
      x-seampact-nature:
        base: refused
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        type:
          type: string
          const: api.not_found
        status:
          type: integer
          const: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.not_found
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    api.payload_too_large:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.payload_too_large
            status:
              type: integer
              const: 413
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.payload_too_large
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiPayloadTooLargeParams"
      x-seampact-nature:
        base: refused
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        type:
          type: string
          const: api.unauthenticated
        status:
          type: integer
          const: 401
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unauthenticated
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    api.unsupported_media_type:
      type: object
      properties:
        type:
          type: string
          const: api.unsupported_media_type
        status:
          type: integer
          const: 415
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unsupported_media_type
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
