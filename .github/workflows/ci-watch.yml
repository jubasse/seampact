name: CI watch

# Opens one issue per workflow, labelled `ci-watch`, when a run of that workflow fails on a push to develop (a
# post-merge row) or on the nightly schedule (a drift row), or comments on that issue when it is still open. It names
# the workflow, the failed jobs and the commit, and never reverts: the next merge fixes or reverts by hand, and the
# lead checks the open `ci-watch` issues before merging. A cancelled run (superseded by a newer push) opens nothing,
# and a green run closes nothing: a run whose path filter skipped every job proves nothing. Every workflow that runs
# on a push or the schedule is listed below; a test keeps the list complete.

on:
  workflow_run:
    workflows:
      - CI
      - Repository checks
      - Golden IR determinism
      - Native IR models
      - p3-binary
      - Contract bundles
      - Packed consumer
      - Native hooks packages
      - MSW consumer
      - AdonisJS consumer
      - Express and Fastify consumers
      - Hono consumer
      - NestJS consumer
      - Angular consumers
      - JVM core
      - JVM plugins
      - PHP core packages
      - Front consumers
      - Spring Boot target
      - Vue consumers
      - Own validators consumer
    types: [completed]
    branches: [develop]

permissions:
  issues: write

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every value from the run goes through the environment, never into the script: a squash title is the PR title,
      # which an outside author writes.
      - name: Open or update the workflow's ci-watch issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="ci-watch: $WORKFLOW_NAME fails on develop"

          if failed_jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"' 2>&1); then
            if [ -z "$failed_jobs" ]; then failed_jobs="- none listed as failed; see the run"; fi
          else
            failed_jobs="- not listed: the jobs API refused ($failed_jobs); see the run"
          fi

          case "$RUN_EVENT" in
            push) row_class="post-merge rows: fix or revert the merge below with the next merge" ;;
            *) row_class="drift rows (nightly): an upstream change or a runner fault, never a revert" ;;
          esac

          body_file="$RUNNER_TEMP/ci-watch-body.md"
          {
            echo "**$WORKFLOW_NAME** failed on a $RUN_EVENT run: $RUN_URL"
            echo
            echo "Commit: $SERVER_URL/$GH_REPO/commit/$HEAD_SHA"
            echo
            echo "Class: $row_class."
            echo
            echo "Failed jobs:"
            echo "$failed_jobs"
          } > "$body_file"

          gh label create ci-watch --color D93F0B --force \
            --description "A post-merge or nightly CI run failed on develop"

          open_issue=$(gh issue list --label ci-watch --state open --limit 200 --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')

          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file "$body_file"
            echo "Commented on issue #$open_issue."
          else
            gh issue create --title "$title" --label ci-watch --body-file "$body_file"
          fi
