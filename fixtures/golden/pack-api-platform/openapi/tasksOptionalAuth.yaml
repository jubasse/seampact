openapi: 3.1.0
info:
  title: tasksOptionalAuth
  version: "1"
  summary: A greeting that visitors and signed-in users both read.
x-seampact-api:
  kind: product
x-seampact-format: jsonld
paths:
  /welcome/v1/greeting:
    get:
      operationId: greeting
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      "@context":
                        const: /contexts/Greeting
                      "@id":
                        type: string
                        format: uri-reference
                      "@type":
                        const: Greeting
                    required:
                      - "@context"
                      - "@id"
                      - "@type"
                  - $ref: "#/components/schemas/Greeting"
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
        - {}
      x-seampact-access:
        identity: user
        optionalAuth: Visitors see the greeting before they sign in.
        onRefused: anonymous
      x-seampact-maturity:
        level: provisional
        source: api
  /welcome/v1/strict-greeting:
    get:
      operationId: strictGreeting
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      "@context":
                        const: /contexts/Greeting
                      "@id":
                        type: string
                        format: uri-reference
                      "@type":
                        const: Greeting
                    required:
                      - "@context"
                      - "@id"
                      - "@type"
                  - $ref: "#/components/schemas/Greeting"
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
        - {}
      x-seampact-access:
        identity: user
        optionalAuth: A bad token must be told, not read as a visitor.
        onRefused: reject
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssuesItem"
      required:
        - issues
    Greeting:
      type: object
      properties:
        signedIn:
          type: boolean
      required:
        - signedIn
    IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 400
            code:
              type: string
              const: api.schema_invalid
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - status
            - code
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
