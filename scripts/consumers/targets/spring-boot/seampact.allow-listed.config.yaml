# The config of the 'allow-listed-framework-route' boot variant: the consumer's, with the variant's route
# allow-listed on the tasks api.
outDir: build/generated/sources/seampact/main
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    use: io.github.jubasse:seampact-spring-boot
    api: tasks
    options: { package: com.example.tasks.api, springSecurity: { matchers: true } }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
  - id: tasksService
    use: io.github.jubasse:seampact-spring-boot
    api: tasksService
    options: { package: com.example.tasksservice.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
  - id: tasksServiceWrites
    use: io.github.jubasse:seampact-spring-boot
    api: tasksServiceWrites
    options: { package: com.example.tasksservicewrites.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
  - id: tasksDevices
    use: io.github.jubasse:seampact-spring-boot
    api: tasksDevices
    options: { package: com.example.tasksdevices.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
  - id: tasksOptionalAuth
    use: io.github.jubasse:seampact-spring-boot
    api: tasksOptionalAuth
    options: { package: com.example.tasksoptionalauth.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
  - id: tasksAbsoluteUrls
    use: io.github.jubasse:seampact-spring-boot
    api: tasksAbsoluteUrls
    options: { package: com.example.tasksabsoluteurls.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
      - { method: GET, path: /v1/unlisted, reason: "The boot variant's framework route outside the contract." }
