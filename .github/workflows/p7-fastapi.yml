name: FastAPI target

# The FastAPI target of the Python packages (ADR 0026): its golden package for the reference contract, checked as an
# app's generated code by ruff, `mypy --strict` with the Pydantic plugin and pyright strict, and the target's tests,
# on two rows: Python 3.12 with FastAPI 0.162 and its own floor Starlette and Pydantic, and the latest Python with the
# locked latest FastAPI, Starlette and Pydantic. On a pull request or a push they run only when the change touches the
# Python packages, the golden IR files or this workflow; `fastapi` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fastapi: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the FastAPI target or the files its tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The Python packages the target builds on, the golden IR files its golden package comes from, the hooks
          # shape and this workflow.
          watched-paths: |
            ^python/
            ^fixtures/golden/
            ^fixtures/hooks-shape/
            ^\.github/actions/
            ^\.github/workflows/p7-fastapi\.yml$

  golden:
    name: golden (${{ matrix.row }})
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: floor
            python-version: "3.12"
            floor: true
          - row: latest
            python-version: "3.x"
            floor: false
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Install FastAPI 0.162 with its floor Starlette and Pydantic, pinned by hash
        if: matrix.floor
        run: uv pip install --require-hashes --no-deps -r fastapi/ci/floor-requirements.txt
      - name: Show the framework versions
        run: uv run --no-sync python -c "import fastapi, pydantic, starlette; print(fastapi.__version__, starlette.__version__, pydantic.VERSION)"
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Check the format
        run: uv run --no-sync ruff format --check
      - name: Type-check the target and its golden package
        run: uv run --no-sync mypy
      - name: Type-check the golden package as Pylance users do
        run: uv run --no-sync pyright
      - name: Test the target and the shared code generation
        run: uv run --no-sync pytest fastapi/fastapi_tests codegen/tests

  fastapi:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, golden]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.fastapi }}
