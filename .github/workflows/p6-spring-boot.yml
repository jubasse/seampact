name: Spring Boot target

# The spring-boot generator (ADR 0022): its option and golden tests, then the golden tree compiled by javac against
# Spring Boot 4 and its redaction checked, on Java 21 and 25 (A13). The consumer is then built by the Gradle plugin
# with Node removed from the runner, and the shared http suite runs against its jar ("The consumer and the proof").
# On a pull request it runs only when the change touches the JVM modules, the reference contract, the consumer, the
# binary, the http suite or this workflow; `spring-boot` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: spring-boot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spring-boot: ${{ steps.detect.outputs.spring-boot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request can be compared with its base.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a change to the generator, its inputs or its pins
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "spring-boot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The JVM modules and their pins, the reference contract and its IRs, the consumer, the binary and the
          # core packages it embeds, the http suite, the lockfile and this workflow.
          watched='^(jvm/|fixtures/reference/|fixtures/golden/reference/|scripts/consumers/targets/spring-boot/'
          watched+='|packages/core/|packages/tools/binary/|packages/tools/http-suite/|pnpm-lock\.yaml$'
          watched+='|\.github/workflows/p6-spring-boot\.yml$)'
          # Both sides of a move, with names NUL-separated and never quoted, so that a moved path, or one with a
          # quote, a backslash, a tab or a non-ASCII byte, still matches.
          changed=$(git diff -z --name-only --no-renames "origin/$PR_BASE...HEAD" | tr '\0' '\n')
          # An empty diff runs every job rather than none.
          if [ -z "$changed" ] || grep -Eq "$watched" <<< "$changed"; then
            echo "spring-boot=true" >> "$GITHUB_OUTPUT"
          else
            echo "spring-boot=false" >> "$GITHUB_OUTPUT"
          fi

  golden:
    needs: changes
    if: needs.changes.outputs.spring-boot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both JDKs are installed: Gradle runs on the last one, and the tests run on the matrix one, which the
      # toolchain detection finds without a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate, compare and compile the golden tree on Java ${{ matrix.test-jdk }}
        working-directory: jvm
        run: ./gradlew :seampact-spring-boot:check -PtestJdk=${{ matrix.test-jdk }}

  binary:
    name: binary (linux x64)
    needs: changes
    if: needs.changes.outputs.spring-boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spring-boot-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  # The consumer built by the Gradle plugin, twice: as configured, and with the boot variant's route allow-listed.
  build:
    needs: [changes, binary]
    if: needs.changes.outputs.spring-boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the JVM path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spring-boot-binary-linux-x64
          path: bin
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the consumer and its allow-listed variant on Java ${{ matrix.jdk }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/seampact-linux-x64
          for variant in configured allow-listed; do
            app="$RUNNER_TEMP/$variant"
            sh scripts/consumers/targets/spring-boot/assemble.sh "$app" "${variant/configured/}"
            (cd "$app" && ./gradlew bootJar -PjavaVersion=${{ matrix.jdk }} -PseampactJvm="$GITHUB_WORKSPACE/jvm" \
              -PseampactBinary="$GITHUB_WORKSPACE/bin/seampact-linux-x64")
            mkdir -p jars
            cp "$app/build/libs/consumer.jar" "jars/$variant.jar"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spring-boot-consumer-jdk${{ matrix.jdk }}
          path: jars
          retention-days: 3
          if-no-files-found: error

  http-suite:
    needs: [changes, build]
    if: needs.changes.outputs.spring-boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spring-boot-consumer-jdk${{ matrix.jdk }}
          path: jars
      - name: Run the default, hand-written and boot profiles on Java ${{ matrix.jdk }}
        env:
          SEAMPACT_SPRING_JAR: ${{ github.workspace }}/jars/configured.jar
          SEAMPACT_SPRING_ALLOW_LISTED_JAR: ${{ github.workspace }}/jars/allow-listed.jar
          SEAMPACT_SPRING_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/spring-boot/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spring-boot-http-suite-jdk${{ matrix.jdk }}
          path: reports
          retention-days: 7
          if-no-files-found: warn

  # The required check: a skipped job (no change to watch) counts as passed, a failed or cancelled one does not.
  spring-boot:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, golden, binary, build, http-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A spring-boot job ended in $result (results: $RESULTS)."
              exit 1
            fi
          done
