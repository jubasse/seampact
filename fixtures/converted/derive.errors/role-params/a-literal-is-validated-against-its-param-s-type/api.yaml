api: { name: shop, version: 1 }
conventions:
  errors: { derived: { sortKeyForbidden: { code: shop.sort_denied, params: { key: $key, reason: a } } } }
enums:
  Reason: { values: [a, b] }
errors:
  shop.sort_denied:
    status: 403
    params: { key: { type: string }, reason: { enum: Reason }, note?: { type: string, nullable: true } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
