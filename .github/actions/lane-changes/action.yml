# The change filter of a lane, shared by every lane's `changes` job: it says whether the lane has something to test.
# A composite action, not a reusable workflow: a reusable workflow would rename the check to `caller / job`.
name: Lane changes
description: >-
  Says run=true when a changed path matches the lane's watched paths (its pull-request paths on a pull request to
  develop, when given), run=false when none does or when the change only touches documentation or package tests no
  lane runs; a pull request and a merge group compare with their base, a push with its old tip. Also says which row
  classes the run holds: PR rows on every event but a push, queue rows on a merge group, a pull request to main and
  the drift events, post-merge rows on a push, drift rows on the schedule, a manual run or a release. The calling job
  checks out the full history first.

inputs:
  watched-paths:
    description: >-
      Extended regular expressions, one per line, matched against each changed path; the lane runs when one matches.
    required: true
  pull-request-paths:
    description: >-
      Extended regular expressions, one per line, that replace watched-paths on a pull request to develop: the fast
      tier runs the lane only for its own code, and the merge queue runs it on every watched path. Empty by default,
      which keeps watched-paths everywhere.
    required: false
    default: ""

outputs:
  run:
    description: "`true` when the lane has something to test, `false` when it has nothing."
    value: ${{ steps.decide.outputs.run }}
  pr-rows:
    description: "`true` when the lane runs and this event runs its PR rows: every event but a push."
    value: ${{ steps.classes.outputs.pr-rows }}
  queue:
    description: "`true` when the lane runs and this event runs its queue rows."
    value: ${{ steps.classes.outputs.queue }}
  post-merge:
    description: "`true` when the lane runs and this event runs its post-merge rows."
    value: ${{ steps.classes.outputs.post-merge }}
  drift:
    description: "`true` when the lane runs and this event runs its drift rows."
    value: ${{ steps.classes.outputs.drift }}

runs:
  using: composite
  steps:
    - name: Decide whether the lane runs
      id: decide
      shell: bash
      env:
        WATCHED_PATHS: ${{ inputs.watched-paths }}
        PULL_REQUEST_PATHS: ${{ inputs.pull-request-paths }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        watched_pattern=$(bash "$GITHUB_ACTION_PATH/lane-paths.sh")

        range=$(bash "$GITHUB_ACTION_PATH/change-range.sh")
        if [ -z "$range" ]; then
          echo "No base to compare with on this $EVENT event: the lane runs."
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Both sides of a move, with names NUL-separated and never quoted, so that a moved path, or one with a
        # quote, a backslash, a tab or a non-ASCII byte, still matches.
        run=$(git diff -z --name-only --no-renames "$range" | bash "$GITHUB_ACTION_PATH/lane-run.sh" "$watched_pattern")
        echo "Changes in $range: run=$run"
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Decide which row classes run
      id: classes
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        LANE_RUN: ${{ steps.decide.outputs.run }}
        PR_BASE: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/row-classes.sh" "$EVENT" "$LANE_RUN" "$PR_BASE" | tee -a "$GITHUB_OUTPUT"
