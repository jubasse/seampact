name: Native IR models

# The native IR models generated from the IR JSON Schema (ADR 0010): the regenerate-and-diff check, then the
# Kotlin model's tests on Java 21 and 25 (A13), with bytecode for Java 21, and the PHP model's tests and static
# analysis on the latest PHP 8.3 and 8.5 (the patched floor, ADR 0010). On a pull request or a push they run only when the change touches the models,
# their sources, the toolchain pins or this workflow; `native-ir` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly and manual runs are the only ones that write the Gradle caches, from the first row of each pull request job;
  # every other run and row reads them.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: native-ir-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native-ir: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the native IR models or their sources
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The sources of the models and of `regenerate`: the golden IR files, the IR and naming schemas, code and vectors, the
          # generator, the spec package's exports, the workspace and toolchain pins, the models and this workflow.
          watched-paths: |
            ^jvm/
            ^php/
            ^scripts/ir-models/
            ^fixtures/golden/
            ^packages/core/spec/(schemas/ir|src/ir|vectors/ir|src/naming|vectors/naming)/
            ^\.github/actions/
            ^\.github/workflows/p2-native-ir\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^packages/core/spec/package\.json$
            ^\.nvmrc$

  regenerate:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated models are current
        run: node --import ./scripts/ir-models/register.ts scripts/ir-models/cli.ts --check

  kotlin:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [21]
    steps: &kotlin-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both JDKs are installed: Gradle runs on the last one, and the tests run on the matrix one, which the
      # toolchain detection finds without a download.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # One writer per pull request job, its first row in the nightly or a manual run, so the cache holds one Gradle home and
          # dependency set per job. The other rows restore that entry; the queue, post-merge and drift copies, which write
          # none, restore the latest entry of the runner's OS.
          cache-read-only: >-
            ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || strategy.job-index != 0 || endsWith(github.job, '-post-merge')
            || endsWith(github.job, '-queue') || endsWith(github.job, '-drift') }}
      - uses: ./.github/actions/gradle-retry
      - name: Test the Kotlin model on Java ${{ matrix.test-jdk }}
        working-directory: jvm
        run: ./gradlew check -PtestJdk=${{ matrix.test-jdk }}

  kotlin-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [25]
    steps: *kotlin-steps

  php:
    needs: changes
    if: needs.changes.outputs.native-ir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # seampact/ir admits symfony/yaml 8, which Symfony 8 apps hold; the reader is proven on it too.
          - php-version: "8.5"
            yaml: "8"
    name: php (PHP ${{ matrix.php-version }}, symfony/yaml ${{ matrix.yaml }})
    steps: &php-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - uses: ./.github/actions/composer-cache
        with:
          dependency-hash: ${{ hashFiles('php/ir/composer.lock') }}
      - name: Install the PHP dev tools from the lock file
        working-directory: php/ir
        run: bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" install --no-interaction --no-progress --no-plugins --no-scripts
      # The lock holds symfony/yaml 7.4 on the PHP 8.3 platform; yaml 8 needs PHP 8.4, so this row moves both.
      - name: Move to symfony/yaml 8
        if: matrix.yaml == '8'
        working-directory: php/ir
        run: |
          composer config platform.php 8.5.12
          composer require --no-update --no-interaction "symfony/yaml:~8.1.0"
          bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" update --no-interaction --no-progress --no-plugins --no-scripts --with-all-dependencies symfony/yaml
          composer show symfony/yaml | grep -E '^versions : \* v8\.'
      - name: Test the PHP model and reader on PHP ${{ matrix.php-version }}
        working-directory: php/ir
        run: vendor/bin/phpunit
      - name: Analyse the PHP model and reader
        working-directory: php/ir
        run: vendor/bin/phpstan analyse --no-progress

  php-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.3"
            yaml: "7.4"
          - php-version: "8.5"
            yaml: "7.4"
    name: php (PHP ${{ matrix.php-version }}, symfony/yaml ${{ matrix.yaml }})
    steps: *php-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  native-ir:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, regenerate, kotlin, kotlin-queue, php, php-queue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.native-ir }}
