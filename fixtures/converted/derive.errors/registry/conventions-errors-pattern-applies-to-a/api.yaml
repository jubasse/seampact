api: { name: shop, version: 1 }
conventions: { errors: { pattern: '^(shop|api)[.][a-z]+$' } }
errors:
  api.not_found: { status: 404, title: Not here. }
  api.rate_limited: { status: 429, title: Slow down. }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
