api: { name: shop, version: 1 }
conventions:
  rateLimit: { header: Retry-After, param: wait, unit: s }
  errors:
    derived:
      sortKeyForbidden: { code: shop.sort_denied, params: { key: { at: $key } } }
      rateLimited: { code: shop.slow_down, params: { wait: $retryAfterMs } }
enums:
  Reason: { values: [a, b] }
schemas:
  Notice:
    discriminator: kind
    oneOf: { done: { type: object, properties: { at: { type: string } } } }
errors:
  shop.sort_denied: { status: 403, params: { key: { type: string } } }
  shop.slow_down: { status: 429, params: { wait: { type: number, minimum: -1 } } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
