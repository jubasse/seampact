packages:
  - packages/*/*

# simple-git-hooks installs the hooks through the root `prepare` script; its own postinstall is not needed.
# @scarf/scarf (pulled by swagger-ui-dist) has a postinstall that only sends install telemetry.
allowBuilds:
  # esbuild's install script only picks a platform binary, which the binary build does not need.
  esbuild: false
  "@scarf/scarf": false
  # vue-demi's postinstall switches its entry between Vue 2 and 3; it ships the Vue 3 entry, which Vue 3.5 needs.
  vue-demi: false
  simple-git-hooks: false
  # msw's postinstall only copies its worker script into the app's own `msw.workerDirectory`, which no package sets.
  msw: false

# Advisories `pnpm audit` skips, each with no fix this repo can take:
auditConfig:
  ignoreGhsas:
    # The Adonis 6 floor row (`@adonisjs/core-6`) tests the oldest Adonis seampact supports; the fixes ship only in
    # Adonis 7, which the main Adonis pin already uses.
    - GHSA-6qvv-pj99-48qm
    - GHSA-2m6q-8v3h-jqww
    - GHSA-524c-h47v-m3h8
    # minimatch through ESLint, on this repo's own lint globs only; the fix is a major ESLint does not accept yet.
    - GHSA-g3hv-75wg-m249
