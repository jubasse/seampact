      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    Bounds:
      type: object
      properties:
        aboveZero:
          type: integer
          exclusiveMinimum: 0
        belowHundred:
          type: integer
          exclusiveMaximum: 100
        step:
          type: integer
          multipleOf: 5
        tenth:
          type: integer
          multipleOf: 0.1
        hundredth:
          type: integer
          multipleOf: 0.01
        seventh:
          type: integer
          multipleOf: 0.07
        hundredThousandth:
          type: integer
          multipleOf: 0.00001
        fraction:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        plain:
          type: number
    Bounds.input:
      type: object
      properties:
        aboveZero:
          type: integer
          exclusiveMinimum: 0
        belowHundred:
          type: integer
          exclusiveMaximum: 100
        step:
          type: integer
          multipleOf: 5
        tenth:
          type: integer
          multipleOf: 0.1
        hundredth:
          type: integer
          multipleOf: 0.01
        seventh:
          type: integer
          multipleOf: 0.07
        hundredThousandth:
          type: integer
          multipleOf: 0.00001
        fraction:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        plain:
          type: number
      additionalProperties: false
    Comment:
      type: object
      properties:
        text:
          type: string
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
      required:
        - text
    Comment.input:
      type: object
      properties:
        text:
          type: string
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment.input"
      required:
        - text
      additionalProperties: false
    Counts:
