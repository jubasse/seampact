# docs/conformance/proofs/audit-idempotency-cases.yaml
# Idempotency enforced by none is refused by name at generation on the Node servers: the tests that generation refuses
# it at the operation's idempotency, not the item's proof. The shared http suite cases prove CHK-043, CHK-149 and
# CHK-041 on the servers.
lane: audit-idempotency-cases
proofs:
  - id: CHK-189
    refusals:
      - 'nestjs: packages/targets/codegen-nestjs/src/reference-boundary.test.ts#idempotency enforced by none is refused by name'
      - 'fastify: packages/targets/codegen-fastify/src/reference-boundary.test.ts#idempotency enforced by none is refused by name'
      - 'express: packages/targets/codegen-express/src/reference-boundary.test.ts#idempotency enforced by none is refused by name'
      - 'adonis: packages/targets/codegen-adonis/src/reference-boundary.test.ts#idempotency enforced by none is refused by name'
      - 'hono: packages/targets/codegen-hono/src/reference-boundary.test.ts#idempotency enforced by none is refused by name'
