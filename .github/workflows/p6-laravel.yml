name: Laravel target

# The Laravel generator (ADR 0023) and the framework-neutral emitters it shares with the other PHP targets:
# `seampact/laravel` and `seampact/codegen`, each validated, installed from its lock file, audited, tested and
# analysed at PHPStan level max on the latest PHP 8.3 and 8.5. The laravel tests compare the reference contract's
# generated tree with the committed golden, which PHPStan analyses against Laravel 13 and `php -l` lints. The consumer
# is then generated with Node removed from the runner, from the reference contract's bundle in a local git repository,
# and served by PHP's built-in server to the shared http suite, on the same two PHP versions ("The consumer and the
# proof"); a variant generated from the contract with `@seampact/pack-laravel` applied runs the `pack:laravel` profile. They run only when the change touches the PHP packages, the reference contract, the consumer, the binary,
# the http suite or this workflow; `laravel` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      laravel: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the PHP packages, the consumer or the files they read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^php/
            ^fixtures/reference/
            ^fixtures/golden/reference/
            ^fixtures/golden/pack-laravel/
            ^packages/packs/pack-laravel/
            ^packages/core/
            ^packages/tools/binary/
            ^packages/tools/http-suite/
            ^scripts/consumers/targets/laravel/
            ^scripts/consumers/php/
            ^scripts/consumers/targets/spring-boot/(contract-source\.sh|credentials\.json)$
            ^scripts/consumers/served-app\.ts$
            ^pnpm-lock\.yaml$
            ^\.github/actions/
            ^\.github/workflows/p6-laravel\.yml$

  packages:
    needs: changes
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.5"]
        package: [codegen, laravel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - name: Validate the Composer manifest
        working-directory: php/${{ matrix.package }}
        run: composer validate --strict --no-interaction
      - name: Install from the lock file, the sibling packages through their path repositories
        working-directory: php/${{ matrix.package }}
        run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - name: Audit the locked dependencies
        working-directory: php/${{ matrix.package }}
        run: composer audit --locked --no-interaction
      - name: Lint the golden tree
        if: matrix.package == 'laravel'
        working-directory: php/laravel
        shell: bash
        run: |
          set -euo pipefail
          find tests/golden -name '*.php' -print0 | xargs -0 -n 1 php -l > /dev/null
      - name: Test ${{ matrix.package }} on PHP ${{ matrix.php-version }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpunit
      - name: Analyse ${{ matrix.package }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  # The reference contract and its pack-laravel variant bundled once by the compiler binary, so the consumer jobs fetch
  # them without Node.
  contract-bundle:
    needs: changes
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - name: Bundle the reference contract and its pack-laravel variant
        run: |
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/reference"
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/pack-laravel" fixtures/golden/pack-laravel/contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laravel-contract-bundle
          path: ${{ runner.temp }}/bundles
          # The pack-laravel bundle keeps its packs under `sources/.packs`, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The consumer generated from the bundle with Node removed, then served by `php -S` to the http suite's default,
  # hand-written, boot and pack:laravel profiles; the floor and the latest PHP are both PR rows.
  e2e:
    name: e2e (PHP ${{ matrix.php-version }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.5"]
    env:
      WORK: ${{ github.workspace }}/../laravel-consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - name: Remove Node from the runner, so the PHP path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: laravel-contract-bundle
          path: ${{ runner.temp }}/bundles
          # The pack-laravel bundle keeps its packs under `sources/.packs`, which upload-artifact skips by default.
          include-hidden-files: true
      - name: Assemble, install and generate the consumer and its allow-listed and pack-laravel variants
        shell: bash
        run: |
          set -euo pipefail
          for variant in "" allow-listed pack-laravel; do
            bundled="$RUNNER_TEMP/bundles/reference"
            if [ "$variant" = "pack-laravel" ]; then bundled="$RUNNER_TEMP/bundles/pack-laravel"; fi
            scripts/consumers/targets/laravel/assemble.sh "$WORK" "$bundled" $variant
            app="$WORK/app${variant:+-$variant}"
            (
              cd "$app"
              composer update --no-interaction --no-progress --no-plugins --no-scripts
              composer audit --no-interaction
              vendor/bin/seampact generate
              php artisan route:cache
              php artisan config:cache
            )
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the default, hand-written, boot and pack:laravel profiles
        env:
          SEAMPACT_LARAVEL_APP: ${{ env.WORK }}/app
          SEAMPACT_LARAVEL_ALLOW_LISTED_APP: ${{ env.WORK }}/app-allow-listed
          SEAMPACT_LARAVEL_PACK_APP: ${{ env.WORK }}/app-pack-laravel
          SEAMPACT_LARAVEL_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/laravel/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: laravel-http-suite-php${{ matrix.php-version }}
          path: reports
          retention-days: 7
          if-no-files-found: warn

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  laravel:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, packages, contract-bundle, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.laravel }}
