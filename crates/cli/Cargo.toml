[package]
name = "seampact-cli"
description = "The seampact binary: arguments, dispatch, help and the commands of the Rust port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "seampact"
path = "src/main.rs"

[features]
# The oracle's tool subject, `seampact_cli::oracle`, for xtask only.
oracle = ["dep:seampact-oracle"]

[dependencies]
anyhow.workspace = true
camino.workspace = true
indexmap.workspace = true
seampact-bundle.workspace = true
seampact-bundle-fetch.workspace = true
seampact-cli-config.workspace = true
seampact-compiler.workspace = true
seampact-diagnostics.workspace = true
seampact-diff.workspace = true
seampact-diff-table.workspace = true
seampact-editor-schemas.workspace = true
seampact-ir.workspace = true
seampact-json.workspace = true
seampact-load.workspace = true
seampact-lint.workspace = true
seampact-openapi.workspace = true
seampact-oracle = { workspace = true, optional = true }
seampact-pipeline.workspace = true
seampact-span.workspace = true
seampact-target.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
