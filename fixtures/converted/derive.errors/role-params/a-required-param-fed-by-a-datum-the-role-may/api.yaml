api: { name: shop, version: 1 }
conventions:
  errors: { derived: { forbidden: { code: shop.denied, params: { pointer: $pointer } } } }
errors:
  shop.denied: { status: 403, params: { pointer: { type: string } } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
