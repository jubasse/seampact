name: FastAPI target

# The FastAPI target of the Python packages (ADR 0026): its golden package for the reference contract, checked as an
# app's generated code by ruff, `mypy --strict` with the Pydantic plugin and pyright strict, and the target's tests,
# on two rows: Python 3.12 with FastAPI 0.162 and its own floor Starlette and Pydantic, and the latest Python with the
# locked latest FastAPI, Starlette and Pydantic. The consumer is then installed from the built wheels and generated
# with Node removed from the runner, from the reference contract's bundle in a local git repository, and served by
# uvicorn to the shared http suite on the same two rows ("The consumer and the proof"). On a pull request or a push
# they run only when the change touches the Python packages, the reference contract, the consumer, the binary, the
# http suite or this workflow; the local-YAML row generates the target from the reference contract's YAML through the
# binary with no bundle; `fastapi` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: fastapi-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fastapi: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the FastAPI target or the files its tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The Python packages the target builds on, the golden IR files its golden package comes from, the hooks
          # shape, what the consumer is built and checked with, and this workflow.
          watched-paths: |
            ^python/
            ^fixtures/golden/
            ^fixtures/hooks-shape/
            ^fixtures/reference/
            ^packages/core/
            ^packages/tools/binary/
            ^packages/tools/http-suite/
            ^scripts/consumers/targets/fastapi/
            ^scripts/consumers/python/
            ^scripts/consumers/php/bundle\.sh$
            ^scripts/consumers/targets/spring-boot/(contract-source\.sh|credentials\.json)$
            ^scripts/consumers/served-app\.ts$
            ^scripts/consumers/golden-pack-profile\.ts$
            ^packages/packs/pack-laravel/
            ^pnpm-lock\.yaml$
            ^\.github/actions/
            ^\.github/workflows/p7-fastapi\.yml$

  golden:
    name: golden (${{ matrix.row }})
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: latest
            python-version: "3.x"
            floor: false
    defaults:
      run:
        working-directory: python
    steps: &golden-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Install FastAPI 0.162 with its floor Starlette and Pydantic, pinned by hash
        if: matrix.floor
        run: uv pip install --require-hashes --no-deps -r fastapi/ci/floor-requirements.txt -r fastapi/ci/floor-test-requirements.txt
      - name: Show the framework versions
        run: uv run --no-sync python -c "import fastapi, pydantic, starlette; print(fastapi.__version__, starlette.__version__, pydantic.VERSION)"
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Check the format
        run: uv run --no-sync ruff format --check
      - name: Type-check the target and its golden package
        run: uv run --no-sync mypy
      - name: Type-check the golden package as Pylance users do
        run: uv run --no-sync pyright
      # Starlette 0.46's TestClient uses an anyio alias the locked anyio deprecates; only the floor row sees it.
      - name: Test the target and the shared code generation
        env:
          PYTEST_ADDOPTS: ${{ matrix.row == 'floor' && '-W "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"' || '' }}
        run: uv run --no-sync pytest fastapi/fastapi_tests codegen/tests

  golden-queue:
    name: golden (${{ matrix.row }})
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: floor
            python-version: "3.12"
            floor: true
    defaults:
      run:
        working-directory: python
    steps: *golden-steps

  # The reference contract bundled once by the compiler binary, so the consumer jobs fetch it without Node.
  contract-bundle:
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore or build the compiler binary
        uses: ./.github/actions/compiler-binary
      - name: Bundle the reference contract and its pack-laravel variant
        run: |
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/reference"
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/pack-laravel" fixtures/golden/pack-laravel/contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastapi-contract-bundle
          path: ${{ runner.temp }}/bundles
          # The pack-laravel bundle keeps its packs under `sources/.packs`, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      # `nativeDocs` has the Python runner emit seampact's document through the compiler binary, unpublished until v1.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastapi-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  # The consumer installed from the built wheels and generated from the bundle with Node removed, then served by
  # uvicorn to the http suite's default, hand-written and boot profiles over every operation of the tasks and tasksService apis; the floor
  # and the latest rows are both PR rows.
  e2e:
    name: e2e (${{ matrix.row }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: latest
            python-version: "3.x"
            pins: ""
    env:
      WORK: ${{ github.workspace }}/../fastapi-consumer
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the Python path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastapi-contract-bundle
          path: ${{ runner.temp }}/bundles
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastapi-binary-linux-x64
          path: ${{ runner.temp }}/binary
      - name: Build the wheels and write the hash-pinned requirements from the lock
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          scripts/consumers/python/build-wheels.sh "$WORK/wheels"
          scripts/consumers/python/requirements.sh "$WORK/requirements.txt" seampact-fastapi generate uvicorn
      - name: Install with pip, then assemble and generate the consumer and its allow-listed and pack-laravel variants
        shell: bash
        env:
          SEAMPACT_CONSUMER_BINARY: ${{ runner.temp }}/binary/seampact-linux-x64
        run: |
          set -euo pipefail
          chmod +x "$SEAMPACT_CONSUMER_BINARY"
          scripts/consumers/python/install.sh "$WORK/venv" "$WORK/requirements.txt" "$WORK/wheels" \
            'seampact-fastapi[generate]' ${{ matrix.pins }}
          # The app's stripe hook verifies signatures with seampact-signed-webhooks, which depends on nothing.
          "$WORK/venv/bin/python" -m pip install --no-input --disable-pip-version-check --no-index \
            --find-links "$WORK/wheels" seampact-signed-webhooks
          "$WORK/venv/bin/python" -c "import fastapi, pydantic, starlette; print(fastapi.__version__, starlette.__version__, pydantic.VERSION)"
          for variant in "" allow-listed pack-laravel; do
            bundled="$RUNNER_TEMP/bundles/reference"
            if [ "$variant" = "pack-laravel" ]; then bundled="$RUNNER_TEMP/bundles/pack-laravel"; fi
            scripts/consumers/targets/fastapi/assemble.sh "$WORK" "$bundled" $variant
            (cd "$WORK/app${variant:+-$variant}" && "$WORK/venv/bin/seampact" generate)
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node came back during the install or the generation."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the default, hand-written, boot and pack:laravel profiles
        env:
          SEAMPACT_FASTAPI_APP: ${{ env.WORK }}/app
          SEAMPACT_FASTAPI_ALLOW_LISTED_APP: ${{ env.WORK }}/app-allow-listed
          SEAMPACT_FASTAPI_PACK_APP: ${{ env.WORK }}/app-pack-laravel
          SEAMPACT_FASTAPI_VENV: ${{ env.WORK }}/venv
          SEAMPACT_FASTAPI_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/fastapi/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fastapi-http-suite-${{ matrix.row }}
          path: reports
          retention-days: 90
          if-no-files-found: warn

  e2e-queue:
    name: e2e (${{ matrix.row }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: floor
            python-version: "3.12"
            pins: python/fastapi/ci/floor-requirements.txt
    env:
      WORK: ${{ github.workspace }}/../fastapi-consumer
    steps: *e2e-steps

  # The target generated and checked from the reference contract's local YAML (a `path` source) through the pinned
  # compiler binary, with no bundle and Node removed from the runner for the install and the generation: the entry's
  # files and the api's OpenAPI documents are written and checked.
  local-yaml:
    name: local YAML (fastapi)
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORK: ${{ github.workspace }}/../fastapi-local-yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the Python path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastapi-binary-linux-x64
          path: ${{ runner.temp }}/binary
      - name: Install from the built wheels, then generate and check from the local YAML through the binary
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/binary/seampact-linux-x64"
          scripts/consumers/python/build-wheels.sh "$WORK/wheels"
          scripts/consumers/python/requirements.sh "$WORK/requirements.txt" seampact-fastapi generate uvicorn
          scripts/consumers/python/install.sh "$WORK/venv" "$WORK/requirements.txt" "$WORK/wheels" 'seampact-fastapi[generate]'
          scripts/consumers/python/local-yaml.sh "$WORK/projects" "$WORK/venv" "$RUNNER_TEMP/binary/seampact-linux-x64" seampact-fastapi
          if command -v node || command -v npm || command -v npx; then
            echo "Node came back during the install or the generation."
            exit 1
          fi

  fastapi:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, golden, golden-queue, contract-bundle, e2e, e2e-queue, local-yaml]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.fastapi }}
          # Queue rows: a pull request to develop runs without them.
          allow-skip: ${{ needs.changes.outputs.queue == 'false' && 'local-yaml' || '' }}
