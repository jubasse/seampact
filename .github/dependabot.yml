# Weekly version updates, one grouped pull request per ecosystem for minor and patch releases. Security updates are
# separate and come as soon as an advisory is published. Majors are left out: a new framework major is a support
# decision, taken by hand with its matrix rows. A release is proposed only after a week, so a version pulled soon
# after publication never lands. Gradle is not listed: each update needs `jvm/gradle/verification-metadata.xml`
# regenerated, which Dependabot cannot do.
# Version updates target develop (git flow); security updates always target the default branch, main, and are
# retargeted to develop by hand.

version: 2

updates:
  - package-ecosystem: github-actions
    target-branch: develop
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Every manifest pins an exact version, which `increase` moves; peer dependency ranges are not updated.
  - package-ecosystem: npm
    target-branch: develop
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The floor rows test the oldest supported version on purpose.
      - dependency-name: express4
      - dependency-name: "@adonisjs/core-6"

  # Framework requirements are the supported ranges and stay as they are; exact pins (build and dev tools) move.
  - package-ecosystem: uv
    target-branch: develop
    directory: "/python"
    versioning-strategy: increase-if-necessary
    exclude-paths:
      # The floor rows install the oldest supported versions on purpose.
      - "*/ci/**"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "seampact*"

  # The composer.json constraints are the supported ranges; only the lock files move.
  - package-ecosystem: composer
    target-branch: develop
    directories:
      - "/php/codegen"
      - "/php/hooks"
      - "/php/ir"
      - "/php/laravel"
      - "/php/signed-webhooks"
      - "/php/symfony"
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    cooldown:
      default-days: 7
    groups:
      php:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: "seampact/*"
