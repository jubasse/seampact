[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-drf"
version = "1.0.0"
description = "The seampact Django REST Framework target: its generator and the runtime of the code it generates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["djangorestframework>=3.18", "seampact-django==1.0.0"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
# What the generator needs; a production install of an app leaves it out.
generate = ["seampact-django[generate]==1.0.0"]

# The target `use: pypi:seampact-drf` names; `seampact generate` finds it through this group.
[project.entry-points."seampact.generators"]
drf = "seampact.drf.generator:DrfGenerator"

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]

[tool.uv.sources]
seampact-django = { workspace = true }
