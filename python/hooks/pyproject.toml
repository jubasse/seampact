[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "seampact-hooks"
version = "1.1.0"
description = "The seampact hook protocols and the values they exchange, for Python apps and generated code."
keywords = ["hooks", "authorization", "python", "seampact", "api-contract", "openapi", "codegen"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://jubasse.github.io/seampact/concepts/packages/"
Documentation = "https://jubasse.github.io/seampact/"
Source = "https://github.com/jubasse/seampact"
Issues = "https://github.com/jubasse/seampact/issues"

# PEP 420: `seampact` is a namespace shared by every seampact distribution, so it has no `__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/seampact"]

[tool.hatch.build.targets.sdist]
include = ["src/seampact", "LICENSE"]
