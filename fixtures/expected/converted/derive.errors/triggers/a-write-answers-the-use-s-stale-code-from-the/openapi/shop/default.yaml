openapi: 3.1.0
info:
  title: shop
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/ping:
    get:
      operationId: ping
      responses:
        "204":
          description: Success.
          headers:
            X-Rights-Version:
              required: true
              schema:
                type: string
              x-seampact-semantic: versionToken
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: viewer
      x-seampact-maturity:
        level: experimental
        source: api
  /v1/poke:
    post:
      operationId: poke
      parameters:
        - name: If-Rights-Version
          in: header
          required: false
          schema:
            type: string
          x-seampact-semantic: versionToken
      responses:
        "204":
          description: Success.
          headers:
            X-Rights-Version:
              required: true
              schema:
                type: string
              x-seampact-semantic: versionToken
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "409":
          description: shop.rights_stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/shop.rights_stale"
          x-seampact-errors:
            - code: shop.rights_stale
              derivedFrom: identity.versionToken
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: viewer
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        type:
          type: string
          const: api.unauthenticated
        status:
          type: integer
          const: 401
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.unauthenticated
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
    shop.rights_stale:
      type: object
      properties:
        type:
          type: string
          const: shop.rights_stale
        status:
          type: integer
          const: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: shop.rights_stale
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
