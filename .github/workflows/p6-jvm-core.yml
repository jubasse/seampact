name: JVM core

# The JVM path to the IR (ADR 0010, ADR 0011): the bundle reader and verifier on the shared bundle vectors, the
# bundle channels, the app config reader and each entry's IR view, the generated-file writer, the pinned standalone
# binary and its runner, and the compiler's classifier publication, on Java 21 and 25 (A13). A
# Node job builds the linux x64 binary; the Java job runs with Node removed from the runner and compiles the
# reference contract with that binary, whose IR must equal the golden IR byte for byte. A Windows job runs the binary
# cache checks on a real NTFS ACL: the profile, the ACEs, the junctions and the SIDs. On a pull request they run
# only when the change touches a watched path; `jvm-core` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jvm-core: ${{ steps.detect.outputs.jvm-core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request can be compared with its base.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a change to the JVM modules or what they read
        id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "jvm-core=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The JVM modules, the bundle, config and IR schemas, the bundle vectors, the compatibility matrix, the reference contract and the
          # golden IR, the binary package, the signed webhook vectors, the workspace and toolchain pins and this workflow.
          watched='^(jvm/|packages/core/spec/schemas/(bundle|config|ir)/|packages/core/spec/vectors/bundle/|packages/core/spec/compatibility/'
          watched+='|fixtures/reference/|fixtures/golden/|packages/tools/binary/|packages/runtime/signed-webhooks/vectors/|\.github/workflows/p6-jvm-core\.yml$'
          watched+='|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.nvmrc$)'
          # Both sides of a move, with names NUL-separated and never quoted, so that a moved path, or one with a
          # quote, a backslash, a tab or a non-ASCII byte, still matches.
          changed=$(git diff -z --name-only --no-renames "origin/$PR_BASE...HEAD" | tr '\0' '\n')
          # An empty diff runs every job rather than none.
          if [ -z "$changed" ] || grep -Eq "$watched" <<< "$changed"; then
            echo "jvm-core=true" >> "$GITHUB_OUTPUT"
          else
            echo "jvm-core=false" >> "$GITHUB_OUTPUT"
          fi

  binary:
    name: binary (linux x64)
    needs: changes
    if: needs.changes.outputs.jvm-core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-core-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  java:
    needs: [changes, binary]
    if: needs.changes.outputs.jvm-core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the JVM path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jvm-core-binary-linux-x64
          path: bin
      # Both JDKs are installed: Gradle runs on the last one, and the tests run on the matrix one, which the
      # toolchain detection finds without a download.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the JVM core modules on Java ${{ matrix.test-jdk }}
        working-directory: jvm
        run: |
          ./gradlew :seampact-ir:check :seampact-compiler:check :seampact-runner:check :seampact-signed-webhooks:check \
            -PtestJdk=${{ matrix.test-jdk }} -PseampactBinary="$GITHUB_WORKSPACE/bin/seampact-linux-x64"
      # ADR 0011 "Unpublished installs for test consumers": every module installs to Maven local and resolves from it.
      - name: Publish to Maven local and resolve every module from it
        if: matrix.test-jdk == 25
        run: jvm/build-logic/maven-local/check.sh "$RUNNER_TEMP/maven-local"

  windows-cache:
    name: binary cache checks (Windows)
    needs: changes
    if: needs.changes.outputs.jvm-core == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run the binary cache tests on Windows
        working-directory: jvm
        shell: bash
        run: ./gradlew :seampact-ir:test --tests 'io.github.jubasse.seampact.ir.binary.*'

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  jvm-core:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, binary, java, windows-cache]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.jvm-core }}
