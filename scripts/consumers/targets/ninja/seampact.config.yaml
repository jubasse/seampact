# The consumer's app config: the reference contract's apis through seampact-ninja, serving every
# operation, with the views `assemble.sh` writes in place of `sync`; the suite's control views sit outside the api's
# base path. The tasks routes join Ninja's document (`nativeDocs`), which the suite compares with seampact's `full`
# document written beside it.
outDir: generated
openapi:
  tasks:
    full: openapi/tasks.full.yaml
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-ninja
    api: tasks
    options: { views: sync }
    artefacts: { nativeDocs: true }
    frameworkRoutes:
      - { path: "/v1/patterned/**", reason: "The pattern-allow-listed-framework-route boot case's routes (ADR 0015)." }
  - id: tasksService
    out: tasks_service
    use: pypi:seampact-ninja
    api: tasksService
    options: { views: sync }
  - id: tasksServiceWrites
    out: tasks_service_writes
    use: pypi:seampact-ninja
    api: tasksServiceWrites
    options: { views: sync }
  - id: tasksDevices
    out: tasks_devices
    use: pypi:seampact-ninja
    api: tasksDevices
    options: { views: sync }
  - id: tasksOptionalAuth
    out: tasks_optional_auth
    use: pypi:seampact-ninja
    api: tasksOptionalAuth
    options: { views: sync }
  - id: tasksAbsoluteUrls
    out: tasks_absolute_urls
    use: pypi:seampact-ninja
    api: tasksAbsoluteUrls
    options: { views: sync }
  - id: tasksPaging
    out: tasks_paging
    use: pypi:seampact-ninja
    api: tasksPaging
    # The changes-since feed carries the complete page fact, which this target refuses by name in 1.0.
    operations: { exclude: [listChanges, listEvents] }
    options: { views: sync }
  - id: tasksSplitSort
    out: tasks_split_sort
    use: pypi:seampact-ninja
    api: tasksSplitSort
    options: { views: sync }
