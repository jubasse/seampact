api: { name: shop, version: 1 }
conventions:
  rateLimit: { header: Retry-After, param: wait, unit: s }
  errors: { derived: { rateLimited: { code: shop.slow_down, params: { wait: $retryAfterMs } } } }
errors:
  shop.slow_down: { status: 429, params: { wait: { type: integer, minimum: 1 } } }

surfaces:
  app:
    prefix: /v{version}
    access: { public: The contract checks error declarations and role bindings only. }
    routes:
      ping: { method: get }
