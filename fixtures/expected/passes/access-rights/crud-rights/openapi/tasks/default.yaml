        - scope: channel
          from: path.channelId
      x-seampact-requires:
        - right: tasks.update
          subject: path.taskId
        - rule: throttle
          bucket: perUser
        - right: channels.member
          subject: scope.channel
      x-seampact-maturity:
        level: experimental
        source: api
  /v1/channels/{channelId}/tasks/{taskId}/archive:
    post:
      operationId: archiveTask
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
