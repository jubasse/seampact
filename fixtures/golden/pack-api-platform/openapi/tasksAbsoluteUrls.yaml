openapi: 3.1.0
info:
  title: tasksAbsoluteUrls
  version: "1"
  summary: Notes whose page links are absolute URLs.
x-seampact-api:
  kind: product
x-seampact-format: jsonld
paths:
  /absolute-urls/v1/notes:
    get:
      operationId: listNotes
      parameters:
        - name: page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
        - name: itemsPerPage
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  "@context":
                    const: /contexts/Note
                  "@id":
                    type: string
                  "@type":
                    const: Collection
                  totalItems:
                    type: integer
                  member:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            "@id":
                              type: string
                              format: uri
                            "@type":
                              const: Note
                          required:
                            - "@id"
                            - "@type"
                        - $ref: "#/components/schemas/Note"
                  view:
                    type: object
                    properties:
                      "@id":
                        type: string
                        format: uri
                      "@type":
                        const: PartialCollectionView
                      first:
                        type: string
                        format: uri
                      last:
                        type: string
                        format: uri
                      previous:
                        type: string
                        format: uri
                      next:
                        type: string
                        format: uri
                    required:
                      - "@id"
                      - "@type"
                      - first
                      - last
                required:
                  - "@context"
                  - "@id"
                  - "@type"
                  - totalItems
                  - member
                  - view
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "422":
          description: api.validation_failed
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.validation_failed"
          x-seampact-errors:
            - code: api.validation_failed
              derivedFrom: input.invalid
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: hydra
        position: page
        roles:
          page: query.page
          limit: query.itemsPerPage
          sort: query.order[{key}]
        maxLimit: 100
        defaultLimit: 100
        overLimit: reject
        sortKeys: []
      x-seampact-maturity:
        level: provisional
        source: api
  /absolute-urls/v1/notes/{noteId}:
    get:
      operationId: getNote
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      "@context":
                        const: /contexts/Note
                      "@id":
                        type: string
                        format: uri
                      "@type":
                        const: Note
                    required:
                      - "@context"
                      - "@id"
                      - "@type"
                  - $ref: "#/components/schemas/Note"
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "404":
          description: api.not_found
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: member.notFound
        "422":
          description: api.validation_failed
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.validation_failed"
          x-seampact-errors:
            - code: api.validation_failed
              derivedFrom: input.invalid
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiValidationFailedParams:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationFailedParamsViolationsItem"
      required:
        - violations
    ApiValidationFailedParamsViolationsItem:
      type: object
      properties:
        propertyPath:
          type: string
        message:
          type: string
      required:
        - propertyPath
        - message
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - noteId
        - text
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.not_found:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 404
        code:
          type: string
          const: api.not_found
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.validation_failed:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            title:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 422
            code:
              type: string
              const: api.validation_failed
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - title
            - status
            - code
        - $ref: "#/components/schemas/ApiValidationFailedParams"
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
