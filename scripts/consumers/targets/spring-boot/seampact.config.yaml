# The consumer's app config: the reference contract as a local `path` source, compiled by the pinned binary, and one
# spring-boot entry per api, serving every operation of the api (ADR 0022); the tasks api also generates the Spring
# Security beans with the customizer, which `SuiteSecurity` wires.
outDir: build/generated/sources/seampact/main
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    use: io.github.jubasse:seampact-spring-boot
    api: tasks
    options: { package: com.example.tasks.api, springSecurity: { matchers: true } }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
  - id: tasksService
    use: io.github.jubasse:seampact-spring-boot
    api: tasksService
    options: { package: com.example.tasksservice.api, springSecurity: false }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
