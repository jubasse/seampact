# The consumer's app config: the reference contract's tasks and tasksService apis through seampact-drf, serving every
# operation; the suite's control views sit outside the api's base path.
outDir: generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-drf
    api: tasks
  - id: tasksService
    out: tasks_service
    use: pypi:seampact-drf
    api: tasksService
