components:
  schemas:
    ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    ApiRateLimitedParams:
      type: object
      properties:
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - retryAfterMs
