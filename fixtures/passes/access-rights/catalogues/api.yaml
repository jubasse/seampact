# The access catalogues (ADR 0002 section 9, ADR 0004 section 4): rights named as their libraries name them, with
# params, the three subject kinds, a guest reason, denial codes, a codeName, docs and extension values; rules with
# a bucket, a body proof and a header proof; nested scopes; buckets counting addresses, principals and body fields.
api: { name: shop, version: 1 }

extensions:
  acme:
    tier: { at: [right, rule, scope], schema: { type: string } }

schemes:
  bearer: { kind: bearer }

identities:
  user:
    schemes: { read: [bearer], write: [bearer] }
    principal: UserPrincipal

schemas:
  OrgId: { type: string, format: uuid }
  ProjectId: { type: string, minLength: 1 }
  ArticleId: { type: string, format: uuid }
  Article:
    type: object
    required: [articleId]
    properties: { articleId: ArticleId }
  UserPrincipal:
    type: object
    required: [userId]
    properties: { userId: { type: string } }
  ReauthToken: { type: string, minLength: 1, maxLength: 512 }
  SignedAt: { type: string, format: date-time }

scopes:
  org:
    id: OrgId
    errors: [api.not_found]
    summary: An organisation the caller belongs to.
    x-acme-tier: gold
  project: { id: ProjectId, within: org, errors: [api.forbidden] }

rights:
  read:articles:
    guest: Published articles are readable without an account.
    summary: Read the published articles.
  edit articles:
    subject: { resource: Article, id: ArticleId }
    errors: [api.forbidden, api.not_found]
  ROLE_ADMIN:
    params: { level: { type: integer, minimum: 1 } }
    subject: { scope: org }
    x-acme-tier: platinum
  update-post:
    subject: { scope: project }
  '*':
    codeName: anyRight
    description: Any right at all, for the superuser.

rules:
  throttle: { bucket: true, errors: [api.rate_limited] }
  recentAuth:
    params: { intent: { type: string } }
    proof: { in: body, name: reauthToken, schema: ReauthToken }
    errors: [api.reauthentication_required]
    x-acme-tier: silver
  signedRecently:
    proof: { in: header, name: X-Signed-At, schema: SignedAt }

buckets:
  perAddress: { key: [address/64, address], limit: 10, window: 15m }
  perUser: { key: [principal.userId] }
  perEmail: { key: [body.email], limit: 5, window: 1h }

surfaces:
  app:
    prefix: /v{version}
    identity: user
    routes:
      ping: { method: get }
