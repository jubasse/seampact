name: Docs site

# Builds the documentation website from docs/ with Starlight: the prebuild copies the pages and rewrites their links,
# then the build fails on any link to a missing page, file or anchor. The Pages deploy is the release workflow's.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the site package
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^packages/tools/docs-site/
            ^pnpm-lock\.yaml$
            ^\.github/workflows/docs-site\.yml$
      # The shared filter counts docs/ as documentation no lane reads, and this lane reads all of it.
      - name: Detect a change to docs/
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PACKAGE_CHANGED: ${{ steps.detect.outputs.run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || [ "$PACKAGE_CHANGED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$(git diff --name-only "origin/$PR_BASE...HEAD" -- docs)" ]; then
            echo "Neither docs/ nor the site package changed: the lane skips."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ changed: the lane runs."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site and check its links
        run: pnpm --filter @seampact/docs-site build

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  docs-site:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
