# seampact conformance checklist (FR-18). The 1.0 release proves every item.
#
# One testable fact per id. Ids (CHK-NNN) are stable: an item is never renumbered or reused;
# a retired item stays with `retired: <reason>`.
#   source:    an acceptance area ("14 <area>", from the project's acceptance list), a product
#              decision (An, see docs/decisions.md) or a success metric (SM-n).
#   frs:       the FEAT-001 requirements the item realises.
#   scenario:  the FEAT-001 scenario that proves it.
#   targets:   who must pass it. "server" = nestjs, fastify, express, adonis, spring-boot,
#              laravel, symfony, api-platform (A17, through the shared HTTP suite);
#              "core" = compiler, emitter or CLI only. "14 <area>" items need at least
#              zod, fetch, nestjs and fastify fixtures.
#   fixture:   added when it exists: the monorepo fixture path that shows the item (SM-2).
#   tests:     added when they exist: per target, the test-consumer test that proves the
#              item end to end (SM-1), as "<target>: <project>/<test file>#<test name>".
#
# How CI consumes this file: a checklist script in the monorepo reads it on every push and
#   - fails on a malformed entry, a duplicate or renumbered id, an unknown FR or scenario id
#     (checked against FEAT-001), or a fixture or test path that does not exist;
#   - reports, per target, the share of ids with a passing fixture (SM-2) and with a passing
#     test-consumer test (SM-1), using the CI results of the named fixtures and tests;
#   - from the 1.0 release gate on, also fails on any id without a fixture and, for every
#     listed target, a test-consumer test (SCN-057), naming the id and the target.
schema: 1
