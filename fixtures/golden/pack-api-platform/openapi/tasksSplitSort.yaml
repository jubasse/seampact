openapi: 3.1.0
info:
  title: tasksSplitSort
  version: "1"
  summary: Notes listed by GitHub-style pages, sorted by one key and its direction.
x-seampact-api:
  kind: product
x-seampact-format: jsonld
paths:
  /split-sort/v1/notes:
    get:
      operationId: listNotes
      parameters:
        - name: page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            pattern: ^(?:created)$
        - name: direction
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            pattern: ^(?:asc|desc)$
      responses:
        "200":
          description: Success.
          headers:
            Link:
              schema:
                type: string
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "422":
          description: api.validation_failed
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.validation_failed"
          x-seampact-errors:
            - code: api.validation_failed
              derivedFrom: input.invalid
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
        - sessionCookie: []
      x-seampact-access:
        identity: user
      x-seampact-paging:
        style: githubPages
        position: page
        roles:
          page: query.page
          limit: query.per_page
          sort: query.sort
        maxLimit: 100
        defaultLimit: 30
        overLimit: clamp
        sortKeys:
          - key: created
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiValidationFailedParams:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ApiValidationFailedParamsViolationsItem"
      required:
        - violations
    ApiValidationFailedParamsViolationsItem:
      type: object
      properties:
        propertyPath:
          type: string
        message:
          type: string
      required:
        - propertyPath
        - message
    Note:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
        created:
          type: string
          format: date-time
      required:
        - noteId
        - text
        - created
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
    api.validation_failed:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            title:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 422
            code:
              type: string
              const: api.validation_failed
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - title
            - status
            - code
        - $ref: "#/components/schemas/ApiValidationFailedParams"
      x-seampact-nature:
        base: refused
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
