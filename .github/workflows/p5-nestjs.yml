name: NestJS consumer

# Builds and packs the seampact packages, then installs them from the tarballs into the NestJS test consumer,
# generates the NestJS boundary of both reference apis, typechecks, boots NestJS on Express and runs
# `reference slice answers` against it (ADR 0016).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: nestjs-consumer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nestjs-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the NestJS consumer from packed tarballs
        run: node scripts/consumers/cli.ts --target nestjs --dir "$RUNNER_TEMP/test-seampact-nestjs"
