# Dependency resolution retries a 429, a 5xx or a timeout from a repository after a doubling pause (2, 4, 8, 16 then
# 32 seconds) before it disables that repository for the build; Gradle's own default is 3 attempts from 1 second.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Unchanged tasks reuse their outputs from the build cache, and an unchanged build reuses its task graph from the
# configuration cache; a configuration cache problem fails the build.
org.gradle.caching=true
org.gradle.configuration-cache=true
