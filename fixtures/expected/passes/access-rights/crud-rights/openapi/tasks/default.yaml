          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - bearer: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: channel
          from: path.channelId
      x-seampact-requires:
        - right: tasks.batch
          subject: scope.channel
        - right: channels.member
          subject: scope.channel
      x-seampact-maturity:
        level: experimental
        source: api
  /v1/channels/{channelId}/tasks/{taskId}:
    patch:
      operationId: updateTask
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
