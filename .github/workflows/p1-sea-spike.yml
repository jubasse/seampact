# Spike for ADR 0010: a stand-in compiler as a Node single executable application, built for five
# platforms from one Linux job and smoke-run on each platform's own runner. Never required;
# removed or folded into the binary workflow once p3-binary lands.
name: p1-sea-spike

on:
  workflow_dispatch:
  push:
    branches: [feat/p1-sea-spike]

permissions:
  contents: read

jobs:
  build:
    name: build (linux, five binaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the spike (outside the root workspace)
        working-directory: spikes/sea
        run: pnpm install --frozen-lockfile
      - name: Build the five binaries
        working-directory: spikes/sea
        run: pnpm build
      - name: Write the Node reference output
        working-directory: spikes/sea
        run: node scripts/reference.mjs dist/reference
      - name: Record the build time
        working-directory: spikes/sea
        run: |
          {
            echo "### Build (linux, ubuntu-24.04)"
            echo "Build time of the Linux job script: $(cat dist/build-seconds.txt) s"
            echo
            echo '```'
            ls -l dist/bin
            echo '```'
            echo "Size in bytes and gzip level 9 size per binary:"
            echo '```'
            cat dist/sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sea-binaries
          path: spikes/sea/dist/bin/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sea-reference
          path: spikes/sea/dist/reference/
          retention-days: 3
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.id }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x64, runner: ubuntu-24.04, binary: seampact-spike-linux-x64 }
          - { id: linux-arm64, runner: ubuntu-24.04-arm, binary: seampact-spike-linux-arm64 }
          - { id: darwin-arm64, runner: macos-15, binary: seampact-spike-darwin-arm64 }
          - { id: darwin-x64, runner: macos-15-intel, binary: seampact-spike-darwin-x64 }
          - { id: win32-x64, runner: windows-2025, binary: seampact-spike-win32-x64.exe }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with CRLF line endings (Windows only)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sea-binaries
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sea-reference
          path: reference
      - name: Verify the binary against the build manifest
        working-directory: bin
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const line = readFileSync("SHA256SUMS", "utf8").split("\n").find((l) => l.endsWith("  ${{ matrix.binary }}"));
            const got = createHash("sha256").update(readFileSync("${{ matrix.binary }}")).digest("hex");
            if (!line || line.split("  ")[0] !== got) { console.error("hash mismatch"); process.exit(1); }
            console.log("hash ok", got);
          '
      - name: Make the binary executable
        if: runner.os != 'Windows'
        run: chmod +x "bin/${{ matrix.binary }}"
      - name: Check the runner architecture against the matrix id
        run: |
          want="${MATRIX_ID#*-}"
          got="$(node -p process.arch)"
          machine="$(uname -m)"
          case "$machine" in
            x86_64 | AMD64 | amd64 | x64) machine_arch=x64 ;;
            aarch64 | arm64) machine_arch=arm64 ;;
            *) machine_arch="$machine" ;;
          esac
          if [ "$RUNNER_OS" = macOS ] && [ "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" = 1 ]; then
            machine_arch="$machine_arch (Rosetta)"
          fi
          echo "runner: ${{ matrix.runner }}, uname -m: $machine, machine arch: $machine_arch, node arch: $got, binary: $want"
          [ "$got" = "$want" ] || { echo "node architecture $got is not $want"; exit 1; }
          [ "$machine_arch" = "$want" ] || { echo "machine architecture $machine_arch is not $want"; exit 1; }
        env:
          MATRIX_ID: ${{ matrix.id }}
      - name: Windows, check the PE security directory is empty
        if: runner.os == 'Windows'
        run: |
          # Fail closed: the script must print its verdict line, or the guard did not run.
          out="$(node spikes/sea/scripts/pe.mjs check "bin/${{ matrix.binary }}")"
          echo "$out"
          [ "$out" = "pe: security directory offset 0, size 0" ] || { echo "pe check did not confirm an empty security directory"; exit 1; }
      - name: macOS, fetch with curl, run before re-signing and show attributes (information only)
        if: runner.os == 'macOS'
        run: |
          mkdir fetched
          python3 -m http.server 8765 --bind 127.0.0.1 --directory bin > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 120 \
            --output "fetched/${{ matrix.binary }}" "http://127.0.0.1:8765/${{ matrix.binary }}"
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          cmp "bin/${{ matrix.binary }}" "fetched/${{ matrix.binary }}"
          chmod +x "fetched/${{ matrix.binary }}"
          xattr -l "fetched/${{ matrix.binary }}" || true
          echo "quarantine attribute present: $(xattr -l "fetched/${{ matrix.binary }}" | grep -c quarantine || true)"
          codesign -dv "fetched/${{ matrix.binary }}" 2>&1 || true
          set +e
          "fetched/${{ matrix.binary }}" spikes/sea/fixtures/ok > unsigned.out 2> unsigned.err
          code=$?
          echo "unsigned run exit code: $code"
          if cmp -s unsigned.out reference/ok.stdout; then same=identical; else same=DIFFERENT; fi
          echo "unsigned run stdout versus the Node reference: $same"
          echo "unsigned run stderr ($(wc -c < unsigned.err | tr -d ' ') bytes):"
          cat unsigned.err
          {
            echo "### macOS ${{ matrix.id }}"
            echo "Binary fetched with curl from a local HTTP server, run before the ad hoc re-sign: exit code $code, stdout $same, stderr $(wc -c < unsigned.err | tr -d ' ') bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: macOS, ad hoc re-sign
        if: runner.os == 'macOS'
        run: |
          codesign --remove-signature "bin/${{ matrix.binary }}" || true
          codesign --force --sign - "bin/${{ matrix.binary }}"
          codesign --verify --verbose=2 "bin/${{ matrix.binary }}"
      - name: Smoke
        env:
          EXPECT_CRLF: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          {
            echo "### Smoke ${{ matrix.id }} (${{ matrix.runner }})"
            echo "| platform | result | size MiB | first launch ms | warm start median of 7 ms |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          node spikes/sea/scripts/smoke.mjs "bin/${{ matrix.binary }}" reference --label "${{ matrix.id }}"
      - name: Smoke with a non-UTC TZ and a non-English LANG
        if: matrix.id == 'linux-x64'
        env:
          SMOKE_ENV: '{"TZ":"Asia/Kolkata","LANG":"fr_FR.UTF-8","LC_ALL":"fr_FR.UTF-8"}'
        run: node spikes/sea/scripts/smoke.mjs "bin/${{ matrix.binary }}" reference --label "linux-x64 TZ=Asia/Kolkata LANG=fr_FR.UTF-8"
      - name: Keep the re-signed macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.id }}
          path: bin/${{ matrix.binary }}
          retention-days: 3
