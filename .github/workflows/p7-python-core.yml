name: Python core packages

# The Python packages of the uv workspace `python/` (ADR 0010): the regenerate-and-diff check of the Python IR model,
# then each package tested and checked on the Python 3.12 floor and the latest Python: `uv sync --locked`, ruff lint
# and format, `mypy --strict` and pytest. On a pull request or a push they run only when the change touches the
# Python packages, the generator of their IR model, the files their tests read or this workflow; `python-core` is the
# one check to require. The binary row builds the linux-x64 compiler binary and runs the runner test with it, with
# Node removed; on a pull request it runs only when what it proves changes.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-core: ${{ steps.detect.outputs.run }}
      # The binary row builds the compiler: on a pull request it runs only when what it proves changes.
      binary-row: ${{ steps.detect.outputs.post-merge == 'true' || steps.binary-row.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the Python packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages, the model generator and its sources, the golden IR files and shared vectors the tests read,
          # the Node toolchain pins of `regenerate`, and this workflow.
          watched-paths: |
            ^python/
            ^scripts/ir-models/
            ^fixtures/golden/
            ^packages/core/spec/(schemas/(ir|bundle)|src/ir|vectors/(ir|bundle)|src/naming|vectors/naming)/
            ^packages/core/spec/package\.json$
            ^pnpm-lock\.yaml$
            ^package\.json$
            ^\.nvmrc$
            ^\.github/actions/
            ^\.github/workflows/p7-python-core\.yml$
      - name: Detect a change to what the binary row proves
        id: binary-row
        uses: ./.github/actions/lane-changes
        with:
          # The runner and its binary module, the binary and the CLI and compiler it embeds, the reference
          # contract and its golden IR, and this workflow.
          watched-paths: |
            ^python/ir/
            ^packages/tools/binary/
            ^packages/core/cli/
            ^packages/core/compiler/
            ^fixtures/reference/
            ^fixtures/golden/reference/
            ^\.github/actions/
            ^\.github/workflows/p7-python-core\.yml$

  regenerate:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated models are current
        run: node --import ./scripts/ir-models/register.ts scripts/ir-models/cli.ts --check

  packages:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor, and `3.x`, the latest stable Python.
        python-version: ["3.12", "3.x"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run --locked ruff check
      - name: Check the format
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      - name: Test on Python ${{ matrix.python-version }}
        run: uv run --locked pytest

  binary:
    name: binary (linux x64)
    needs: changes
    if: needs.changes.outputs.python-core == 'true' && needs.changes.outputs.binary-row == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-core-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  # The runner test: the pinned binary compiles the reference contract and its IR is byte-identical to the golden
  # files. Node is removed first, so the Python path is proven to need none.
  binary-runner:
    name: binary runner (linux x64)
    needs: [changes, binary]
    if: needs.changes.outputs.python-core == 'true' && needs.changes.outputs.binary-row == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-core-binary-linux-x64
          path: ${{ runner.temp }}/bin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Run the binary through the runner
        env:
          RUNNER_BINARY_DIRECTORY: ${{ runner.temp }}/bin
        run: |
          chmod +x "$RUNNER_BINARY_DIRECTORY/seampact-linux-x64"
          SEAMPACT_BINARY="$RUNNER_BINARY_DIRECTORY/seampact-linux-x64" \
            uv run --locked pytest ir/tests/test_binary_runner.py -rs

  python-core:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, regenerate, packages, binary, binary-runner]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.python-core }}
