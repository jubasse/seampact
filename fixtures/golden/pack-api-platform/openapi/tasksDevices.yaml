openapi: 3.1.0
info:
  title: tasksDevices
  version: "1"
  summary: The status a paired wall display reads.
x-seampact-api:
  kind: product
x-seampact-format: jsonld
paths:
  /devices/v1/status:
    get:
      operationId: status
      responses:
        "200":
          description: Success.
          content:
            application/ld+json:
              schema:
                allOf:
                  - type: object
                    properties:
                      "@context":
                        const: /contexts/DeviceStatus
                      "@id":
                        type: string
                        format: uri-reference
                      "@type":
                        const: DeviceStatus
                    required:
                      - "@context"
                      - "@id"
                      - "@type"
                  - $ref: "#/components/schemas/DeviceStatus"
        "400":
          description: api.schema_invalid
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "401":
          description: api.unauthenticated
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.unauthenticated"
          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "500":
          description: api.internal
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - deviceToken: []
      x-seampact-access:
        identity: device
      x-seampact-maturity:
        level: provisional
        source: api
components:
  schemas:
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssuesItem"
      required:
        - issues
    DeviceStatus:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
      required:
        - deviceId
    IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    api.internal:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 500
        code:
          type: string
          const: api.internal
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: failed
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            "@context":
              const: /contexts/Error
            "@id":
              type: string
            "@type":
              const: Error
            type:
              type: string
            detail:
              type: string
            status:
              type: integer
              const: 400
            code:
              type: string
              const: api.schema_invalid
          required:
            - "@context"
            - "@id"
            - "@type"
            - type
            - status
            - code
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
    api.unauthenticated:
      type: object
      properties:
        "@context":
          const: /contexts/Error
        "@id":
          type: string
        "@type":
          const: Error
        type:
          type: string
        detail:
          type: string
        status:
          type: integer
          const: 401
        code:
          type: string
          const: api.unauthenticated
      required:
        - "@context"
        - "@id"
        - "@type"
        - type
        - status
        - code
      x-seampact-nature:
        base: refused
  securitySchemes:
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
