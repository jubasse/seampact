api: { name: t, version: 1 }
surfaces:
  app:
    routes:
      tasks:
        kind: collection
        id: { taskId: { type: string } }
        errors:
          api.forbidden: { status: 403, params: { right: { type: string } } }
      boards:
        kind: collection
        id: { boardId: { type: string } }
        errors:
          tasks.locked: { status: 423, params: { until: { type: string } } }
