name: npm audit

# Audits the pnpm lock file against the npm advisory database, every dependency included, at every severity. It runs
# when the lock file or the workspace file (which lists the advisories skipped, each with its reason) changes, and
# nightly, since a new advisory needs no change here; a failed nightly reaches ci-watch. Python and PHP audit their
# own lock files in their workflows (`pip-audit`, `composer audit`).

on:
  push:
    branches: [main, develop]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/npm-audit.yml
  pull_request:
    branches: [main, develop]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/npm-audit.yml
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Audit the lock file
        run: pnpm audit --audit-level low
