  # An Angular api service over the fetch client, sending through HttpClient: resource() readers, no query library.
  - id: queries
    use: "@seampact/codegen-angular"
    apis: [tasks, tasksService]
    options:
      query: fetch
    link:
      client: client
  # The same fetchers without the service, as server code reads its data.
  - id: queriesPlain
    use: "@seampact/codegen-angular"
    apis: [tasks]
    options:
      query: fetch
    artefacts:
      service: false
    link:
      client: client
  # Declared errors returned as data.
  - id: queriesData
    use: "@seampact/codegen-angular"
    apis: [tasks]
    options:
      query: fetch
      errors: data
    link:
      client: client
