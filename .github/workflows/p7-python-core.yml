name: Python core packages

# The Python packages of the uv workspace `python/` (ADR 0010): the regenerate-and-diff check of the Python IR model,
# then each package tested and checked on the Python 3.12 floor and the latest Python: `uv sync --locked`, ruff lint
# and format, `mypy --strict` and pytest. On a pull request or a push they run only when the change touches the
# Python packages, the generator of their IR model, the files their tests read or this workflow; `python-core` is the
# one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-core: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the Python packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # The packages, the model generator and its sources, the golden IR files and shared vectors the tests read,
          # the Node toolchain pins of `regenerate`, and this workflow.
          watched-paths: |
            ^python/
            ^scripts/ir-models/
            ^fixtures/golden/
            ^packages/core/spec/(schemas/ir|src/ir|vectors/ir|src/naming|vectors/naming)/
            ^packages/core/spec/package\.json$
            ^pnpm-lock\.yaml$
            ^package\.json$
            ^\.nvmrc$
            ^\.github/actions/
            ^\.github/workflows/p7-python-core\.yml$

  regenerate:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated models are current
        run: node --import ./scripts/ir-models/register.ts scripts/ir-models/cli.ts --check

  packages:
    needs: changes
    if: needs.changes.outputs.python-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor, and `3.x`, the latest stable Python.
        python-version: ["3.12", "3.x"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the workspace from the lock file
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run --locked ruff check
      - name: Check the format
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      - name: Test on Python ${{ matrix.python-version }}
        run: uv run --locked pytest

  python-core:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, regenerate, packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.python-core }}
