name: Packed consumer

# Builds and packs the seampact packages, then installs them from the tarballs into the stub test consumer,
# generates, typechecks and runs `reference slice answers` there (ADR 0011 "Unpublished installs for test
# consumers"). The server targets' consumers depend on packed installs staying green.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: packed-consumer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      pr-rows: ${{ steps.detect.outputs.pr-rows }}
      queue: ${{ steps.detect.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change beyond documentation no test reads
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          # Every package, since the stub consumer installs them all, the consumer harness, the stub overlay and the pins.
          watched-paths: |
            ^packages/
            ^scripts/consumers/(cli|build-and-pack|consumer-project|install-into|ignore-vendor|packed-packages|run-step|served-app|validator-choice)\.ts$
            ^scripts/consumers/template/
            ^scripts/consumers/targets/stub/
            ^scripts/golden/
            ^\.github/actions/
            ^\.github/workflows/p4-client\.yml$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^package\.json$
            ^tsconfig(\.base)?\.json$
            ^\.nvmrc$

  stub-consumer:
    needs: changes
    if: needs.changes.outputs.pr-rows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the stub consumer from packed tarballs
        run: node scripts/consumers/cli.ts --target stub --dir "$RUNNER_TEMP/test-seampact-stub"

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  packed-consumer:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, stub-consumer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.run }}
