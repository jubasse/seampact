# The consumer's app config: the reference contract and one seampact/laravel entry serving the operations of the
# tasks api, which this release generates; the suite's control routes are allow-listed framework routes.
outDir: app/Generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: Tasks
    use: seampact/laravel
    api: tasks
    operations: { exclude: [searchTasks] }
    frameworkRoutes:
      - { path: "/__seampact/**", reason: "The http suite's control routes (ADR 0015); not part of the api." }
