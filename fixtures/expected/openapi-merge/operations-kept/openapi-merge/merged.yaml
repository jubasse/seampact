          x-seampact-errors:
            - code: api.unauthenticated
              derivedFrom: identity.authenticate
        "403":
          description: api.csrf_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.csrf_invalid"
          x-seampact-errors:
            - code: api.csrf_invalid
              derivedFrom: csrf.cookieWrite
        "404":
          description: api.not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.not_found"
          x-seampact-errors:
            - code: api.not_found
              derivedFrom: member.notFound
        "409":
          description: api.idempotency_in_progress, state.conflict
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Tasks.api.idempotency_in_progress"
                  - $ref: "#/components/schemas/Tasks.state.conflict"
                discriminator:
                  propertyName: code
                  mapping:
                    api.idempotency_in_progress: "#/components/schemas/Tasks.api.idempotency_in_progress"
                    state.conflict: "#/components/schemas/Tasks.state.conflict"
          x-seampact-errors:
            - code: api.idempotency_in_progress
              derivedFrom: idempotency.write
            - code: state.conflict
              derivedFrom: concurrency.version
        "413":
          description: api.payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.payload_too_large"
          x-seampact-errors:
            - code: api.payload_too_large
              derivedFrom: body.limit
        "415":
          description: api.unsupported_media_type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.unsupported_media_type"
          x-seampact-errors:
            - code: api.unsupported_media_type
              derivedFrom: body.media
        "422":
          description: api.idempotency_key_reused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.idempotency_key_reused"
          x-seampact-errors:
            - code: api.idempotency_key_reused
              derivedFrom: idempotency.write
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Tasks.api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security:
        - Tasks.bearer: []
        - Tasks.sessionCookie: []
          Tasks.csrfToken: []
      x-seampact-access:
        identity: user
      x-seampact-scopes:
        - scope: channel
          from: path.channelId
      x-seampact-restricted-to:
        - schema: Tasks.Task
          pointer: /effort
          right: tasks.seeEffort
          subject: holderField.taskId
          direction: output
      x-seampact-concurrency:
        version: body.expectedVersion
        field: version
      x-seampact-idempotency:
        header: Idempotency-Key
        replayHeader: Idempotency-Replayed
        lifetimeMs: 86400000
        required: true
        enforce: boundary
      x-seampact-maturity:
        level: provisional
        source: api
      x-seampact-internal: true
      x-seampact-source-api: tasks
components:
  schemas:
    Tasks.ApiForbiddenParams:
      type: object
      properties:
        pointer:
          type: string
    Tasks.ApiPayloadTooLargeParams:
      type: object
      properties:
        limitBytes:
          type: integer
          minimum: 0
    Tasks.ApiRateLimitedParams:
      type: object
      properties:
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - retryAfterMs
    Tasks.ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Tasks.IssuesItem"
      required:
        - issues
    Tasks.ArchiveTask:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - reason
        - expectedVersion
    Tasks.CreateTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        effort:
          type: integer
          minimum: 0
      required:
        - title
    Tasks.IssuesItem:
      type: object
      properties:
        pointer:
          type: string
        rule:
          type: string
      required:
        - pointer
        - rule
    Tasks.Task:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        state:
          $ref: "#/components/schemas/Tasks.TaskState"
        effort:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      required:
        - taskId
        - title
        - state
        - version
        - createdAt
    Tasks.TaskState:
      type: string
      enum:
        - open
        - done
        - archived
    Tasks.api.csrf_invalid:
      type: object
      properties:
        type:
          type: string
          const: api.csrf_invalid
        status:
          type: integer
          const: 403
        detail:
