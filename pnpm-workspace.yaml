packages:
  - packages/*/*

# simple-git-hooks installs the hooks through the root `prepare` script; its own postinstall is not needed.
# @scarf/scarf (pulled by swagger-ui-dist) has a postinstall that only sends install telemetry.
allowBuilds:
  # esbuild's install script only picks a platform binary, which the binary build does not need.
  esbuild: false
  "@scarf/scarf": false
  simple-git-hooks: false
