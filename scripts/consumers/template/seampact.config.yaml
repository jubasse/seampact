# The slice consumer: the reference contract's types, validators and fetch client for both apis. An overlay
# appends its own entries to `targets`, which stays the last key.
outDir: generated
sources:
  reference:
    path: ./contract
targets:
  - id: types
    use: "@seampact/codegen-ts"
    apis: [tasks, tasksService]
  - id: validators
    use: "@seampact/codegen-zod"
    apis: [tasks, tasksService]
  - id: client
    use: "@seampact/codegen-fetch"
    apis: [tasks, tasksService]
    link:
      types: types
