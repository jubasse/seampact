# Bodies beyond JSON, refused (ADR 0002 section 7): a file in a form, a file above the body limit, a file inside
# a JSON body, a form input that is no object, and an opaque form field.
api: { name: uploads, version: 1, kind: product }

conventions:
  bodyLimit: 1MiB

surfaces:
  app:
    prefix: /v{version}
    routes:
      formFile:
        method: post
        inputMedia: form
        input:
          type: object
          properties:
            file: { file: { media: [image/png] } }
      tooLarge:
        method: post
        inputMedia: multipart
        input:
          type: object
          properties:
            file: { file: { media: [image/png], maxSize: 2MiB } }
      jsonFile:
        method: post
        input:
          type: object
          properties:
            file: { file: { media: [image/png] } }
      formScalar:
        method: post
        inputMedia: form
        input: { type: string }
      formOpaque:
        method: post
        inputMedia: form
        input:
          type: object
          properties:
            anything: { opaque: "The caller sends any shape." }
