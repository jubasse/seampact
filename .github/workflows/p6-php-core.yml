name: PHP core packages

# The Composer packages of the PHP path (ADR 0010): `seampact/hooks` checked against the shared hooks shape manifest
# and `seampact/signed-webhooks` against the ADR 0013 vectors, each tested and analysed on the latest PHP 8.3 and 8.5;
# then the split job, which builds every `php/<name>` mirror tree without pushing it and installs each one alone
# into a throwaway project through a Composer path repository. On a pull request or a push they run only when the change
# touches the PHP packages, the files their tests read or this workflow; `php-core` is the one check to require.
# The split proves the PHP 8.3 floor on every run; its PHP 8.5 row, where Packagist resolves newer releases, runs nightly.
# The binary rows build the linux-x64 compiler binary and run `vendor/bin/seampact` with it: the local-YAML rows
# compile the reference contract's YAML for the Laravel and Symfony targets and write and check the OpenAPI documents
# with Node removed; the channel smoke (ADR 0011 "Channel smoke tests") generates from the release and git channels
# with no binary and expects each tampered copy to be refused. On a pull request they run only when what they prove
# changes; a push to develop runs them.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run holds the drift row (the split on PHP 8.5).
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: php-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php-core: ${{ steps.detect.outputs.run }}
      drift: ${{ steps.detect.outputs.drift }}
      # The binary rows build the compiler and install Laravel: on a pull request they run only when what they prove changes.
      binary-rows: ${{ steps.detect.outputs.post-merge == 'true' || steps.binary-rows.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only, and only the shared
          # actions are checked out.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Detect a change to the PHP packages or the files their tests read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^php/
            ^fixtures/hooks-shape/
            ^packages/runtime/signed-webhooks/vectors/
            ^fixtures/golden/reference/
            ^packages/core/spec/schemas/(bundle|config|ir)/
            ^packages/core/spec/vectors/bundle/
            ^packages/core/spec/compatibility/
            ^packages/tools/binary/
            ^fixtures/reference/
            ^scripts/dist-smoke/
            ^scripts/consumers/php/bundle\.sh$
            ^\.github/actions/
            ^\.github/workflows/p6-php-core\.yml$
      - name: Detect a change to what the binary rows prove
        id: binary-rows
        uses: ./.github/actions/lane-changes
        with:
          # The runner, the targets and their shared code, the binary and the CLI and compiler it embeds, the
          # reference contract, the smoke's channels, and this workflow.
          watched-paths: |
            ^php/ir/(src|bin|resources)/
            ^php/(codegen|laravel|symfony|hooks)/
            ^packages/tools/binary/
            ^packages/core/cli/
            ^packages/core/compiler/
            ^fixtures/reference/
            ^scripts/dist-smoke/
            ^scripts/consumers/php/bundle\.sh$
            ^\.github/actions/
            ^\.github/workflows/p6-php-core\.yml$

  packages:
    needs: changes
    if: needs.changes.outputs.php-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.5"]
        package: [hooks, signed-webhooks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - name: Validate the Composer manifest
        working-directory: php/${{ matrix.package }}
        run: composer validate --strict --no-interaction
      - name: Install the PHP dev tools from the lock file
        working-directory: php/${{ matrix.package }}
        run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - name: Audit the locked dependencies
        working-directory: php/${{ matrix.package }}
        run: composer audit --locked --no-interaction
      - name: Test ${{ matrix.package }} on PHP ${{ matrix.php-version }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpunit
      - name: Analyse ${{ matrix.package }}
        working-directory: php/${{ matrix.package }}
        run: vendor/bin/phpstan analyse --no-progress

  # The PR row; the drift job below runs the same steps on PHP 8.5.
  split:
    name: &split-name split (${{ matrix.php-version }})
    needs: changes
    if: needs.changes.outputs.php-core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3"]
    steps: &split-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, which the split rewrites.
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      # No platform override here: Composer checks the real runtime against each package's PHP floor.
      - name: Split each PHP package and install it alone through a path repository
        shell: bash
        env:
          WORK: ${{ runner.temp }}/php-split
        run: |
          set -euo pipefail
          work="$WORK"
          rm -rf "$work"; mkdir -p "$work/trees" "$work/projects"
          # Every mirror tree first, so that each install proof resolves its seampact siblings from the PR copies.
          for manifest in php/*/composer.json; do
            name=$(basename "$(dirname "$manifest")")
            # The mirror's history: the directory's commits rewritten with php/<name> as the root; never pushed.
            split=$(git subtree split --quiet --prefix="php/$name" HEAD)
            mkdir "$work/trees/$name"
            git archive "$split" | tar -x -C "$work/trees/$name"
            test -f "$work/trees/$name/composer.json" || { echo "The split tree of php/$name has no composer.json at its root."; exit 1; }
          done
          for manifest in php/*/composer.json; do
            name=$(basename "$(dirname "$manifest")")
            package=$(php -r 'echo json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR)["name"];' "$work/trees/$name/composer.json")
            project="$work/projects/$name"
            mkdir "$project"
            php -r '
              [, $package, $trees, $target] = $argv;
              $siblings = array_map(
                static fn (string $tree): array => ["type" => "path", "url" => $tree, "options" => ["symlink" => false]],
                glob("$trees/*", GLOB_ONLYDIR),
              );
              // Each seampact package this one needs, transitively, is required "*@dev" by name: the dev stability
              // of the PR copies never reaches a third-party package.
              $requires = [];
              foreach (glob("$trees/*/composer.json") as $manifest) {
                $read = json_decode(file_get_contents($manifest), true, flags: JSON_THROW_ON_ERROR);
                $requires[$read["name"]] = array_values(array_filter(array_keys($read["require"] ?? []), static fn (string $name): bool => str_starts_with($name, "seampact/")));
              }
              $needed = [$package => "*@dev"];
              for ($pending = [$package]; $pending !== []; ) {
                foreach ($requires[array_pop($pending)] ?? [] as $sibling) {
                  if (!isset($needed[$sibling])) {
                    $needed[$sibling] = "*@dev";
                    $pending[] = $sibling;
                  }
                }
              }
              $project = [
                "name" => "seampact-ci/install-proof",
                "version" => "0.0.0",
                // Every split tree, then Packagist without seampact/*: a published sibling never stands in for the PR
                // copy, while a pinned third-party runtime dependency (the JSON Schema validator of seampact/ir)
                // still resolves.
                "repositories" => [
                  ...$siblings,
                  ["type" => "composer", "url" => "https://repo.packagist.org", "exclude" => ["seampact/*"]],
                  ["packagist.org" => false],
                ],
                "require" => $needed,
              ];
              file_put_contents($target, json_encode($project, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n");
            ' "$package" "$work/trees" "$project/composer.json"
            composer update --working-dir="$project" --no-interaction --no-progress
            test ! -L "$project/vendor/$package" || { echo "$package was symlinked, not copied."; exit 1; }
            # Every class of the installed copy loads through its own autoloader.
            php -r '
              [, $project, $package] = $argv;
              require "$project/vendor/autoload.php";
              $installed = json_decode(file_get_contents("$project/vendor/$package/composer.json"), true, flags: JSON_THROW_ON_ERROR);
              $loaded = 0;
              foreach ($installed["autoload"]["psr-4"] as $prefix => $directory) {
                $root = "$project/vendor/$package/" . rtrim($directory, "/");
                foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS)) as $file) {
                  $type = $prefix . str_replace("/", "\\", substr($file->getPathname(), strlen($root) + 1, -4));
                  if (!class_exists($type) && !interface_exists($type) && !enum_exists($type)) {
                    fwrite(STDERR, "$package: $type does not load from the installed copy.\n");
                    exit(1);
                  }
                  $loaded++;
                }
              }
              if ($loaded === 0) {
                fwrite(STDERR, "$package: no type loads from the installed copy; check its psr-4 autoload.\n");
                exit(1);
              }
              echo "$package installs alone from its split tree; $loaded types load.\n";
            ' "$project" "$package"
          done

  split-drift:
    name: *split-name
    needs: changes
    if: needs.changes.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.5"]
    steps: *split-steps

  binary:
    name: binary (linux x64)
    needs: changes
    if: needs.changes.outputs.php-core == 'true' && needs.changes.outputs.binary-rows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binaries
        working-directory: packages/tools/binary
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-core-binary-linux-x64
          path: packages/tools/binary/dist/bin/seampact-linux-x64
          retention-days: 3
          if-no-files-found: error

  # A project per target that compiles the reference contract's YAML (a `path` source) with the pinned binary, then
  # generates and checks the entry and the OpenAPI documents, and lints the generated PHP. Node is removed first.
  local-yaml:
    name: local YAML (laravel, symfony)
    needs: [changes, binary]
    if: needs.changes.outputs.php-core == 'true' && needs.changes.outputs.binary-rows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the PHP path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-core-binary-linux-x64
          path: bin
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:2.10.2
          coverage: none
      - name: Generate and check each target from the local YAML through the binary
        shell: bash
        env:
          WORK: ${{ runner.temp }}/local-yaml
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/bin/seampact-linux-x64"
          chmod +x "$binary"
          sha256=$(sha256sum "$binary" | cut -d' ' -f1)
          # Packagist downloads retry with backoff; the last attempt's failure fails the step.
          retry() { for delay in 10 30 90; do "$@" && return 0; echo "Retrying in ${delay} s: $*"; sleep "$delay"; done; "$@"; }
          for target in laravel symfony; do
            case "$target" in
              laravel) framework='"laravel/framework": "~13.38.0"' ;;
              symfony) framework='"symfony/framework-bundle": "~7.4.21"' ;;
            esac
            app="$WORK/$target"
            mkdir -p "$app/src"
            cp -R fixtures/reference "$app/contract"
            repositories=""
            for package in ir codegen hooks "$target"; do
              repositories="$repositories{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/php/$package\", \"options\": {\"symlink\": false, \"versions\": {\"seampact/$package\": \"dev-develop\"}}},"
            done
            cat > "$app/composer.json" <<JSON
          {
            "name": "seampact-ci/local-yaml-$target",
            "type": "project",
            "require": {"php": ">=8.3.36 <8.4 || >=8.4.27 <8.5 || >=8.5.12", $framework, "seampact/$target": "dev-develop"},
            "repositories": [${repositories%,}],
            "autoload": {"psr-4": {"App\\\\": "src/"}},
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": {"platform": {"php": "8.3.36"}},
            "extra": {"seampact": {"binary": {"path": "$binary", "sha256": "$sha256"}}}
          }
          JSON
            # No `openapi` key: the binary writes the default documents of the entry's api.
            cat > "$app/seampact.config.yaml" <<YAML
          outDir: src/Generated
          sources:
            contract: { path: contract }
          targets:
            - id: tasks
              out: Tasks
              use: seampact/$target
              api: tasks
              operations: { include: [health, getChannel, getDraft, getTask, getTasksBatch] }
          YAML
            retry composer update --working-dir="$app" --no-interaction --no-progress
            (cd "$app" && vendor/bin/seampact generate && vendor/bin/seampact check)
            test -n "$(ls "$app/openapi")" || { echo "$target: the binary wrote no OpenAPI document."; exit 1; }
            find "$app/src/Generated" -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
            echo "$target: generated and checked from the local YAML, documents included."
          done

  # The runner's hand-over to the binary: the reference contract bundled by the binary and pinned as a local git tag,
  # a Laravel project with no `openapi` key, so `vendor/bin/seampact` fetches and checks the bundle, then hands its
  # cache entry to the binary's documents run. With the git repository removed, check still passes: the binary
  # fetched nothing. Node is removed first.
  bundle-hand-over:
    name: bundle hand-over (php)
    needs: [changes, binary]
    if: needs.changes.outputs.php-core == 'true' && needs.changes.outputs.binary-rows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Node from the runner, so the PHP path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-core-binary-linux-x64
          path: bin
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:2.10.2
          coverage: none
      - name: Generate and check the documents from a handed-over bundle
        shell: bash
        env:
          WORK: ${{ runner.temp }}/hand-over
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/bin/seampact-linux-x64"
          chmod +x "$binary"
          sha256=$(sha256sum "$binary" | cut -d' ' -f1)
          retry() { for delay in 10 30 90; do "$@" && return 0; echo "Retrying in ${delay} s: $*"; sleep "$delay"; done; "$@"; }
          sh scripts/consumers/php/bundle.sh "$binary" "$WORK/bundled"
          integrity=$(cat "$WORK/bundled/integrity")
          contract_repo="$WORK/contract-repo"
          mkdir -p "$contract_repo"
          cp -R "$WORK/bundled/bundle" "$contract_repo/bundle"
          git -C "$contract_repo" init -q
          git -C "$contract_repo" add bundle
          git -C "$contract_repo" -c user.name=seampact -c user.email=seampact@localhost commit -qm "Bundle the reference contract."
          git -C "$contract_repo" tag v1.0.0
          app="$WORK/app"
          mkdir -p "$app/src"
          repositories=""
          for package in ir codegen hooks laravel; do
            repositories="$repositories{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/php/$package\", \"options\": {\"symlink\": false, \"versions\": {\"seampact/$package\": \"dev-develop\"}}},"
          done
          cat > "$app/composer.json" <<JSON
          {
            "name": "seampact-ci/bundle-hand-over",
            "type": "project",
            "require": {"php": ">=8.3.36 <8.4 || >=8.4.27 <8.5 || >=8.5.12", "laravel/framework": "~13.38.0", "seampact/laravel": "dev-develop"},
            "repositories": [${repositories%,}],
            "autoload": {"psr-4": {"App\\\\": "src/"}},
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": {"platform": {"php": "8.3.36"}},
            "extra": {"seampact": {"binary": {"path": "$binary", "sha256": "$sha256"}}}
          }
          JSON
          # No `openapi` key: the binary writes the default documents of the entry's api from the handed-over bundle.
          cat > "$app/seampact.config.yaml" <<YAML
          outDir: src/Generated
          allowLocal: true
          sources:
            contract:
              git: { url: "$contract_repo", tag: v1.0.0, directory: bundle }
              integrity: "$integrity"
          targets:
            - { id: tasks, out: Tasks, use: seampact/laravel, api: tasks, operations: { include: [health, getTask] } }
          YAML
          retry composer update --working-dir="$app" --no-interaction --no-progress
          (cd "$app" && vendor/bin/seampact generate && vendor/bin/seampact check)
          test -n "$(ls "$app/openapi")" || { echo "The binary wrote no OpenAPI document."; exit 1; }
          rm -rf "$contract_repo"
          (cd "$app" && vendor/bin/seampact check)
          echo "The bundle was handed over: check passes with the contract repository removed."

  # The PHP leg of the channel smoke tests: a Laravel project generates and checks from the release and git channels
  # that `scripts/dist-smoke/cli.ts serve` starts, with `openapi: none` and no binary, and each tampered copy is
  # refused as `bundle.file-hash`, naming the file. The bundle cache is emptied before each case: it is keyed by
  # integrity, which the tampered copy shares.
  channel-smoke:
    name: channel smoke (php)
    needs: changes
    if: needs.changes.outputs.php-core == 'true' && needs.changes.outputs.binary-rows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:2.10.2
          coverage: none
      - name: Serve the release and git channels
        shell: bash
        run: |
          set -euo pipefail
          served="$RUNNER_TEMP/served.json"
          node --experimental-transform-types --import ./scripts/ir-models/register.ts scripts/dist-smoke/cli.ts serve \
            --work "$RUNNER_TEMP/channels" > "$served" 2> "$RUNNER_TEMP/channels.log" &
          for _ in $(seq 1 60); do
            if [ -s "$served" ]; then exit 0; fi
            sleep 2
          done
          echo "The channels did not start; their log:"
          cat "$RUNNER_TEMP/channels.log"
          exit 1
      - name: Generate and check from each channel with vendor/bin/seampact
        shell: bash
        env:
          WORK: ${{ runner.temp }}/smoke
        run: |
          set -euo pipefail
          served="$RUNNER_TEMP/served.json"
          integrity=$(jq -r .integrity "$served")
          tampered_file=$(jq -r .tamperedFile "$served")
          ca_file=$(jq -r .release.caFile "$served")
          app="$WORK/app"
          cache="$WORK/composer-cache"
          mkdir -p "$app/src" "$cache"
          retry() { for delay in 10 30 90; do "$@" && return 0; echo "Retrying in ${delay} s: $*"; sleep "$delay"; done; "$@"; }
          repositories=""
          for package in ir codegen hooks laravel; do
            repositories="$repositories{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/php/$package\", \"options\": {\"symlink\": false, \"versions\": {\"seampact/$package\": \"dev-develop\"}}},"
          done
          cat > "$app/composer.json" <<JSON
          {
            "name": "seampact-ci/channel-smoke",
            "type": "project",
            "require": {"php": ">=8.3.36 <8.4 || >=8.4.27 <8.5 || >=8.5.12", "laravel/framework": "~13.38.0", "seampact/laravel": "dev-develop"},
            "repositories": [${repositories%,}],
            "autoload": {"psr-4": {"App\\\\": "src/"}},
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": {"platform": {"php": "8.3.36"}}
          }
          JSON
          retry composer update --working-dir="$app" --no-interaction --no-progress

          # `pass` expects a generated and checked app, `tampered` the refusal naming the tampered file. The local git
          # channel is a file URL, which `allowLocal` accepts.
          run_case() {
            name="$1"; source_lines="$2"; expected="$3"
            rm -rf "$app/src/Generated" "$cache/seampact/bundles"
            printf 'outDir: src/Generated\nopenapi: none\nallowLocal: true\nsources:\n%s\ntargets:\n  - { id: tasks, out: Tasks, use: seampact/laravel, api: tasks, operations: { include: [health, getTask] } }\n' \
              "$source_lines" > "$app/seampact.config.yaml"
            if (cd "$app" && export COMPOSER_CACHE_DIR="$cache" && php -d openssl.cafile="$ca_file" vendor/bin/seampact generate \
              && php -d openssl.cafile="$ca_file" vendor/bin/seampact check) > "$WORK/$name.log" 2>&1; then
              outcome=pass
            else
              outcome=refused
            fi
            if [ "$expected" = pass ] && [ "$outcome" = pass ]; then
              echo "php $name: generated and checked from the bundle."
            elif [ "$expected" = tampered ] && [ "$outcome" = refused ] && grep -q 'bundle.file-hash' "$WORK/$name.log" \
              && grep -qF "$tampered_file" "$WORK/$name.log"; then
              echo "php $name: the tampered copy is refused as bundle.file-hash, naming $tampered_file."
            else
              echo "php $name: expected $expected, the run ended $outcome; its log:" >&2
              cat "$WORK/$name.log" >&2
              exit 1
            fi
          }
          release_source() { printf '  contract:\n    release: { url: "%s" }\n    integrity: "%s"' "$1" "$integrity"; }
          git_source() {
            printf '  contract:\n    git: { url: "%s", tag: "%s", directory: "%s" }\n    integrity: "%s"' \
              "$(jq -r .git.url "$served")" "$1" "$(jq -r .git.directory "$served")" "$integrity"
          }

          run_case release "$(release_source "$(jq -r .release.url "$served")")" pass
          run_case release-tampered "$(release_source "$(jq -r .release.tamperedUrl "$served")")" tampered
          run_case git "$(git_source "$(jq -r .git.tag "$served")")" pass
          run_case git-tampered "$(git_source "$(jq -r .git.tamperedTag "$served")")" tampered

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  php-core:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, packages, split, split-drift, binary, local-yaml, bundle-hand-over, channel-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.php-core }}
          allow-skip: ${{ needs.changes.outputs.binary-rows == 'false' && 'binary local-yaml bundle-hand-over channel-smoke' || '' }}
