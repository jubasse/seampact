openapi: 3.1.0
info:
  title: shop
  version: "1"
x-seampact-api:
  kind: product
x-seampact-format: bare
paths:
  /v1/ping:
    get:
      operationId: ping
      responses:
        "204":
          description: Success.
        "400":
          description: api.schema_invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.schema_invalid"
          x-seampact-errors:
            - code: api.schema_invalid
              derivedFrom: input.invalid
        "429":
          description: api.rate_limited
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.rate_limited"
          x-seampact-errors:
            - code: api.rate_limited
              derivedFrom: rule.bucket
        "500":
          description: api.internal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api.internal"
          x-seampact-errors:
            - code: api.internal
              derivedFrom: response.undeclared
      security: []
      x-seampact-access:
        public: The contract checks the retry header only.
      x-seampact-requires:
        - rule: slowDown
          bucket: writes
          entry: writeLimit
      x-seampact-maturity:
        level: experimental
        source: api
components:
  schemas:
    ApiRateLimitedParams:
      type: object
      properties:
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - retryAfterMs
    ApiSchemaInvalidIssue:
      type: object
      properties:
        in:
          type: string
          pattern: ^(?:path|query|header|body)$
        pointer:
          type: string
        rule:
          type: string
      required:
        - in
        - pointer
        - rule
    ApiSchemaInvalidParams:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ApiSchemaInvalidIssue"
      required:
        - issues
    api.internal:
      type: object
      properties:
        type:
          type: string
          const: api.internal
        status:
          type: integer
          const: 500
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          const: api.internal
        nature:
          type: string
        traceId:
          type: string
      required:
        - type
        - status
        - code
        - nature
      x-seampact-nature:
        base: failed
    api.rate_limited:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.rate_limited
            status:
              type: integer
              const: 429
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.rate_limited
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiRateLimitedParams"
      x-seampact-nature:
        base: unavailable
    api.schema_invalid:
      allOf:
        - type: object
          properties:
            type:
              type: string
              const: api.schema_invalid
            status:
              type: integer
              const: 400
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
              const: api.schema_invalid
            nature:
              type: string
            traceId:
              type: string
          required:
            - type
            - status
            - code
            - nature
        - $ref: "#/components/schemas/ApiSchemaInvalidParams"
      x-seampact-nature:
        base: refused
