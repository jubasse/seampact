# tasks-responses/api.yaml
api:
  name: tasksResponses
  version: 1
  kind: product
  maturity: provisional
  summary: Notes whose routes answer several successes, cache directives, a sensitive field, a deprecation and If-Match, and memos deleted with a body-sourced version.

conventions:
  cache:
    families:
      everyDirective:
        maxAge: 60s
        sharedMaxAge: 120s
        staleWhileRevalidate: 30s
        staleIfError: 1h
        immutable: true
        noCache: true
        mustRevalidate: true

schemas:
  NoteId: { type: string, format: uuid }
  Note:
    type: object
    required: [noteId, text, revision]
    properties:
      noteId: NoteId
      text: { type: string, minLength: 1, maxLength: 500 }
      revision: { type: integer, minimum: 0 }
  EditNote:
    type: object
    required: [text]
    properties:
      text: { type: string, minLength: 1, maxLength: 500 }
  MemoId: { type: string, format: uuid }
  Memo:
    type: object
    required: [memoId, text, version]
    properties:
      memoId: MemoId
      text: { type: string, minLength: 1, maxLength: 500 }
      version: { type: integer, minimum: 1 }
  NoteKey:
    type: object
    required: [noteId, secret]
    properties:
      noteId: NoteId
      secret: { type: string, sensitive: true }

surfaces:
  responses:
    prefix: /responses/v{version}
    identity: user
    routes:
      digest:
        method: get
        access: { public: "The digest is the same for every reader." }
        cache: { freshness: everyDirective, anonymous: public }
        output: Note
      notes:
        kind: collection
        id: { noteId: NoteId }
        item: Note
        concurrency: { version: header.If-Match, field: revision }
        ops:
          get: { cache: { freshness: everyDirective } }
          update: { input: EditNote }
        member:
          routes:
            save:
              method: post
              input: EditNote
              responses:
                200: { body: Note }
                201: { body: Note }
            key:
              method: get
              output: NoteKey
            legacy:
              method: get
              output: Note
              deprecated: { since: '2026-12-31', sunset: '2027-06-30', successor: getNote }
      memos:
        kind: collection
        id: { memoId: MemoId }
        item: Memo
        concurrency: { version: body.expectedVersion, field: version }
        ops:
          get: {}
          delete: {}
