name: Symfony target

# The Symfony generator (ADR 0024), `seampact/symfony`: validated, installed from its lock file, audited, tested and
# analysed at PHPStan level max on PHP 8.3 and 8.5 with Symfony 7.4, and on PHP 8.5 with Symfony 8. The tests compare
# the reference contract's generated tree with the committed golden, run its input constraints in Symfony's Validator
# and its bundle in a container; PHPStan analyses the golden against each Symfony major and `php -l` lints it. The e2e
# job serves the consumer with PHP's built-in server to the shared http suite on Symfony 7.4 and 8; a variant
# generated from the contract with `@seampact/pack-laravel` applied runs the `pack:laravel` profile. On a pull request
# they run only when the change touches the PHP packages, the reference contract, the consumer or this workflow;
# `symfony` is the one check to require.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
    branches: [main, develop]
  workflow_dispatch:
  # The nightly run has no base, so it runs every row whatever the change: the net under the narrowed paths.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: symfony-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      symfony: ${{ steps.detect.outputs.run }}
      queue: ${{ steps.detect.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents: the change list reads commits and trees only.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Detect a change to the PHP packages, the consumer or the files they read
        id: detect
        uses: ./.github/actions/lane-changes
        with:
          watched-paths: |
            ^php/
            ^fixtures/reference/
            ^fixtures/golden/reference/
            ^fixtures/golden/pack-laravel/
            ^packages/packs/pack-laravel/
            ^packages/core/
            ^packages/tools/binary/
            ^packages/tools/http-suite/
            ^scripts/consumers/targets/symfony/
            ^scripts/consumers/php/
            ^scripts/consumers/targets/spring-boot/(contract-source\.sh|credentials\.json)$
            ^scripts/consumers/served-app\.ts$
            ^scripts/consumers/golden-pack-profile\.ts$
            ^pnpm-lock\.yaml$
            ^\.github/actions/
            ^\.github/workflows/p6-symfony\.yml$
          # The fast tier: a pull request to develop runs this lane only for its own code.
          pull-request-paths: |
            ^php/symfony/
            ^scripts/consumers/targets/symfony/
            ^\.github/workflows/p6-symfony\.yml$

  generator:
    needs: changes
    if: needs.changes.outputs.symfony == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.5"
            symfony: "8"
    steps: &generator-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - uses: ./.github/actions/composer-cache
        with:
          dependency-hash: ${{ hashFiles('php/symfony/composer.lock') }}
      - name: Validate the Composer manifest
        working-directory: php/symfony
        run: composer validate --strict --no-interaction
      - name: Install from the lock file, the sibling packages through their path repositories
        working-directory: php/symfony
        run: bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" install --no-interaction --no-progress --no-plugins --no-scripts
      # The lock pins Symfony 7.4 on the PHP 8.3 platform; Symfony 8 needs PHP 8.4, so this row moves both.
      - name: Move to Symfony 8
        if: matrix.symfony == '8'
        working-directory: php/symfony
        env:
          # The siblings are required at `self.version`, locked at dev-develop: a partial update keeps them there, so
          # the root takes that version too rather than the `dev-<sha>` of a pull request checkout.
          COMPOSER_ROOT_VERSION: dev-develop
        run: |
          composer config platform.php 8.5.12
          composer require --no-update --no-interaction symfony/console:8.1.11 symfony/framework-bundle:8.1.11
          composer require --dev --no-update --no-interaction \
            symfony/http-kernel:8.1.11 symfony/routing:8.1.11 symfony/validator:8.1.11 symfony/var-dumper:8.1.10 \
            symfony/security-core:8.1.11 symfony/security-http:8.1.11
          bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" update --no-interaction --no-progress --no-plugins --no-scripts --with-all-dependencies \
            symfony/console symfony/framework-bundle symfony/http-kernel symfony/routing symfony/validator symfony/var-dumper \
            symfony/security-core symfony/security-http
      - name: Audit the locked dependencies
        working-directory: php/symfony
        run: bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" audit --locked --no-interaction
      - name: Lint the golden tree
        working-directory: php/symfony
        shell: bash
        run: |
          set -euo pipefail
          find tests/golden -name '*.php' -print0 | xargs -0 -n 1 php -l > /dev/null
      - name: Test on PHP ${{ matrix.php-version }} with Symfony ${{ matrix.symfony }}
        working-directory: php/symfony
        run: vendor/bin/phpunit
      - name: Analyse with Symfony ${{ matrix.symfony }}
        working-directory: php/symfony
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  generator-queue:
    needs: changes
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.3"
            symfony: "7.4"
          - php-version: "8.5"
            symfony: "7.4"
    steps: *generator-steps

  # The reference contract and its pack-laravel variant bundled once by the compiler binary, so the consumer jobs fetch
  # them without Node.
  contract-bundle:
    needs: changes
    if: needs.changes.outputs.symfony == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore or build the compiler binary
        uses: ./.github/actions/compiler-binary
      - name: Bundle the reference contract and its pack-laravel variant
        run: |
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/reference"
          scripts/consumers/php/bundle.sh packages/tools/binary/dist/bin/seampact-linux-x64 "$RUNNER_TEMP/bundles/pack-laravel" fixtures/golden/pack-laravel/contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symfony-contract-bundle
          path: ${{ runner.temp }}/bundles
          # The pack-laravel bundle keeps its packs under `sources/.packs`, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # The consumer generated from the bundle with Node removed, warmed by `cache:warmup` (the boot check), then served by
  # `php -S` to the http suite's default, hand-written, boot and pack:laravel profiles; the floor and the latest are both
  # PR rows.
  e2e:
    name: e2e (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.symfony == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.5"
            symfony: "8"
    env:
      WORK: ${{ github.workspace }}/../symfony-consumer
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - uses: ./.github/actions/composer-cache
        with:
          dependency-hash: ${{ hashFiles('php/*/composer.json', 'scripts/consumers/targets/symfony/composer.json') }}
      - name: Remove Node from the runner, so the PHP path is proven to need none
        shell: bash
        run: |
          set -euo pipefail
          for node in $(which -a node nodejs npm npx corepack 2>/dev/null | sort -u); do
            sudo rm -f "$node"
          done
          if command -v node || command -v npm || command -v npx; then
            echo "Node is still on the PATH."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: symfony-contract-bundle
          path: ${{ runner.temp }}/bundles
      - name: Assemble, install, generate and warm the consumer and its allow-listed and pack-laravel variants
        shell: bash
        env:
          SYMFONY_MAJOR: ${{ matrix.symfony }}
        run: |
          set -euo pipefail
          for variant in "" allow-listed pack-laravel; do
            bundled="$RUNNER_TEMP/bundles/reference"
            if [ "$variant" = "pack-laravel" ]; then bundled="$RUNNER_TEMP/bundles/pack-laravel"; fi
            scripts/consumers/targets/symfony/assemble.sh "$WORK" "$bundled" "$SYMFONY_MAJOR" $variant
            app="$WORK/app${variant:+-$variant}"
            (
              cd "$app"
              bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" update --no-interaction --no-progress --no-plugins --no-scripts
              "$GITHUB_WORKSPACE/scripts/consumers/targets/symfony/check-majors.sh" . "$SYMFONY_MAJOR"
              bash "$GITHUB_WORKSPACE/.github/actions/composer-cache/composer-with-retry.sh" audit --no-interaction
              vendor/bin/seampact generate
              php bin/console cache:warmup
            )
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the default, hand-written, boot and pack:laravel profiles
        env:
          SEAMPACT_SYMFONY_APP: ${{ env.WORK }}/app
          SEAMPACT_SYMFONY_ALLOW_LISTED_APP: ${{ env.WORK }}/app-allow-listed
          SEAMPACT_SYMFONY_PACK_APP: ${{ env.WORK }}/app-pack-laravel
          SEAMPACT_SYMFONY_REPORTS: ${{ github.workspace }}/reports
        run: pnpm vitest run --config scripts/consumers/targets/symfony/suite/vitest.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: symfony-http-suite-php${{ matrix.php-version }}-symfony${{ matrix.symfony }}
          path: reports
          retention-days: 90
          if-no-files-found: warn

  e2e-queue:
    name: e2e (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})
    needs: [changes, contract-bundle]
    if: needs.changes.outputs.queue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.3"
            symfony: "7.4"
    env:
      WORK: ${{ github.workspace }}/../symfony-consumer
    steps: *e2e-steps

  # The required check: a skipped job passes only when the change filter said skip; a failed or cancelled one fails.
  symfony:
    # Every job this check stands for is listed here, or its failure would not reach the required check.
    needs: [changes, generator, generator-queue, contract-bundle, e2e, e2e-queue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/lane-aggregate
        with:
          needs: ${{ toJSON(needs) }}
          should-run: ${{ needs.changes.outputs.symfony }}
