# The consumer's app config for the `framework-route-check-off` boot cases: the app config with the framework-route
# check switched off on every api and no frameworkRoutes.
outDir: generated
openapi: none
sources:
  contract: { path: contract }
targets:
  - id: tasks
    out: tasks
    use: pypi:seampact-ninja
    api: tasks
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksService
    out: tasks_service
    use: pypi:seampact-ninja
    api: tasksService
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksServiceWrites
    out: tasks_service_writes
    use: pypi:seampact-ninja
    api: tasksServiceWrites
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksDevices
    out: tasks_devices
    use: pypi:seampact-ninja
    api: tasksDevices
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksOptionalAuth
    out: tasks_optional_auth
    use: pypi:seampact-ninja
    api: tasksOptionalAuth
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksAbsoluteUrls
    out: tasks_absolute_urls
    use: pypi:seampact-ninja
    api: tasksAbsoluteUrls
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksResponses
    out: tasks_responses
    use: pypi:seampact-ninja
    api: tasksResponses
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksPaging
    out: tasks_paging
    use: pypi:seampact-ninja
    api: tasksPaging
    # The changes-since feed carries the complete page fact, which this target refuses by name in 1.0.
    operations: { exclude: [listChanges, listEvents] }
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
  - id: tasksSplitSort
    out: tasks_split_sort
    use: pypi:seampact-ninja
    api: tasksSplitSort
    options: { views: sync }
    artefacts:
      bootCheck: { frameworkRoutes: false }
