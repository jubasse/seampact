api: { name: t, version: 1, kind: product }
schemas:
  Note: { type: object, required: [noteId], properties: { noteId: { type: string } } }
  Key: { type: object, required: [keyId, secret], properties: { keyId: { type: string }, secret: { type: string, sensitive: true } } }
conventions: { cache: { families: { minute: 60s } } }
surfaces:
  app:
    access: { public: Open. }
    routes:
      read: { method: get, output: Note, cache: { etag: true } }
